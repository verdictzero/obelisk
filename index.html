<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Obelisk</title>
<style>
  :root {
    --bg: #0e1116;
    --panel: #161b22;
    --panel-2: #1f262f;
    --border: #2a313c;
    --text: #e6edf3;
    --muted: #8b949e;
    --accent: #4f8cff;
    --accent-2: #79b8ff;
    --danger: #f85149;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 14px;
  }
  #canvas-container { position: fixed; left: 210px; top: 0; right: 340px; bottom: 0; }
  #canvas-container canvas { display: block; }
  body[data-world="achievements"] #canvas-container { left: 0; }
  body[data-world="achievements"] #palette { display: none; }

  /* ---- Top tab bar (worlds) — left-aligned inside the 3D space ---- */
  #tabs {
    position: fixed; top: 12px; left: 222px; z-index: 12;
    display: flex; gap: 6px; max-width: calc(100% - 562px);
    background: rgba(22,27,34,0.85); backdrop-filter: blur(8px);
    border: 1px solid var(--border); border-radius: 999px; padding: 5px;
  }
  body[data-world="achievements"] #tabs { left: 12px; }
  .tab {
    background: transparent; color: var(--muted); border: none;
    border-radius: 999px; padding: 8px 20px; font: inherit; font-size: 14px;
    font-weight: 600; letter-spacing: 0.02em; cursor: pointer;
    transition: background 120ms ease, color 120ms ease, box-shadow 120ms ease;
  }
  .tab:hover { color: var(--text); }
  .tab.active { color: #fff; }
  .tab[data-world="people"].active       { background: #1d3a66; color: #cfe2ff; box-shadow: 0 0 0 1px #4f8cff, 0 0 14px rgba(79,140,255,0.45); }
  .tab[data-world="tasks"].active        { background: #4a1418; color: #ffd8d8; box-shadow: 0 0 0 1px #e5484d, 0 0 14px rgba(229,72,77,0.45); }
  .tab[data-world="achievements"].active { background: #3a2a08; color: #ffe9b0; box-shadow: 0 0 0 1px #ffd700, 0 0 16px rgba(255,215,0,0.5); }

  /* bottom-left dock: instructional bar (status) above the activity bar (toolbar) */
  #bottom-dock {
    position: fixed; left: 222px; bottom: 12px; z-index: 10;
    display: flex; flex-direction: column; align-items: flex-start; gap: 10px;
    max-width: calc(100% - 562px);
  }
  body[data-world="achievements"] #bottom-dock { left: 12px; max-width: calc(100% - 364px); }
  #toolbar {
    display: flex; gap: 6px; flex-wrap: wrap;
    background: rgba(22,27,34,0.85); backdrop-filter: blur(8px);
    border: 1px solid var(--border); border-radius: 8px; padding: 6px;
  }
  button {
    background: var(--panel-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px;
    padding: 7px 12px; font: inherit; font-size: 13px; cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: white; }
  button.primary:hover { background: var(--accent-2); border-color: var(--accent-2); }
  button.danger { color: var(--danger); }
  button.danger:hover { border-color: var(--danger); }
  button:disabled { opacity: 0.4; cursor: not-allowed; }

  /* grouping controls live in the People and Tasks worlds (not Achievements) */
  #group-toggle-btn, #add-project-btn { display: none; }
  body[data-world="tasks"] #group-toggle-btn, body[data-world="tasks"] #add-project-btn,
  body[data-world="people"] #group-toggle-btn, body[data-world="people"] #add-project-btn { display: inline-block; }
  #group-toggle-btn.on { background: #b07cff; border-color: #b07cff; color: #190a33; }
  #group-toggle-btn.on:hover { background: #c79bff; border-color: #c79bff; }

  body[data-world="people"]       #add-primary-btn { background: #4f8cff; border-color: #4f8cff; }
  body[data-world="people"]       #add-primary-btn:hover { background: #6aa8ff; border-color: #6aa8ff; }
  body[data-world="tasks"]        #add-primary-btn { background: #e5484d; border-color: #e5484d; }
  body[data-world="tasks"]        #add-primary-btn:hover { background: #f2555a; border-color: #f2555a; }
  body[data-world="achievements"] #add-primary-btn { background: #d4a017; border-color: #d4a017; color: #1a1408; }
  body[data-world="achievements"] #add-primary-btn:hover { background: #ffd700; border-color: #ffd700; }

  button#autosave-btn { max-width: 240px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  button#autosave-btn.active { background: #2da44e; border-color: #2da44e; color: white; }
  button#autosave-btn.active:hover { background: #3fb461; border-color: #3fb461; }
  button#autosave-btn.paused { border-color: #f7b955; color: #f7b955; }
  button#autosave-btn.paused:hover { background: rgba(247,185,85,0.1); }
  button#autosave-btn.error { border-color: var(--danger); color: var(--danger); }

  /* ---- Left palette (unassigned items) ---- */
  #palette {
    position: fixed; left: 0; top: 0; bottom: 0; width: 210px; z-index: 9;
    background: var(--panel); border-right: 1px solid var(--border);
    display: flex; flex-direction: column;
  }
  #palette-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 12px; border-bottom: 1px solid var(--border);
  }
  #palette-header h2 {
    margin: 0; font-size: 11px; font-weight: 600; letter-spacing: 0.06em;
    text-transform: uppercase; color: var(--muted);
  }
  #add-palette-btn { padding: 4px 10px; }
  #palette-strip { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
  #palette.drop-target { background: rgba(248,81,73,0.10); box-shadow: inset 0 0 0 2px var(--danger); }
  .palette-empty { color: var(--muted); font-style: italic; font-size: 12px; padding: 8px 4px; }
  .chip {
    display: flex; align-items: center; gap: 8px;
    background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 8px; padding: 8px 10px; font-size: 13px; cursor: grab;
    user-select: none; touch-action: none;
  }
  .chip:hover { border-color: var(--accent); }
  .chip:active { cursor: grabbing; }
  .chip .dot { width: 12px; height: 12px; border-radius: 3px; flex: 0 0 auto; }
  .chip.person .dot { border-radius: 50%; }
  .chip .label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .drag-ghost {
    position: fixed; z-index: 1000; pointer-events: none;
    background: var(--panel-2); border: 1px solid var(--accent);
    border-radius: 8px; padding: 6px 12px; font-size: 13px; color: var(--text);
    box-shadow: 0 8px 20px rgba(0,0,0,0.5); opacity: 0.95;
    display: flex; align-items: center; gap: 8px;
  }
  .drag-ghost .dot { width: 12px; height: 12px; border-radius: 3px; }
  .drag-ghost.person .dot { border-radius: 50%; }

  #status {
    color: var(--muted); font-size: 11px;
    background: rgba(22,27,34,0.7); backdrop-filter: blur(8px);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 12px 18px; pointer-events: none;
  }
  kbd {
    background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 3px; padding: 1px 4px; font-size: 10px;
    font-family: ui-monospace, monospace;
  }

  #sidebar {
    position: fixed; right: 0; top: 0; width: 340px; height: 100%; z-index: 20;
    background: var(--panel); border-left: 1px solid var(--border);
    display: flex; flex-direction: column;
  }
  #sidebar header {
    padding: 14px 16px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
  }
  #sidebar header h1 {
    margin: 0; font-size: 14px; font-weight: 600; letter-spacing: 0.04em;
    text-transform: uppercase; color: var(--muted);
  }
  #sidebar .body { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
  #sidebar .empty { color: var(--muted); font-style: italic; padding-top: 40px; text-align: center; }
  #sidebar label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
  #sidebar input, #sidebar textarea, #sidebar select {
    width: 100%; background: var(--panel-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px;
    padding: 8px 10px; font: inherit; font-size: 14px; resize: vertical;
  }
  #sidebar input:focus, #sidebar textarea:focus, #sidebar select:focus { outline: none; border-color: var(--accent); }
  #sidebar textarea { min-height: 120px; }
  #sidebar footer {
    padding: 12px 16px; border-top: 1px solid var(--border);
    display: flex; gap: 8px;
  }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .swatches { display: flex; gap: 6px; flex-wrap: wrap; }
  .swatch {
    width: 22px; height: 22px; border-radius: 50%;
    border: 2px solid transparent; cursor: pointer;
    transition: transform 80ms ease;
  }
  .swatch:hover { transform: scale(1.1); }
  .swatch.active { border-color: var(--text); }

  .link-row { display: flex; flex-wrap: wrap; gap: 6px; }
  .link-chip {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 999px; padding: 3px 6px 3px 10px; font-size: 12px;
  }
  .link-chip .dot { width: 10px; height: 10px; border-radius: 50%; }
  .link-chip.task .dot { border-radius: 3px; }
  .link-chip .x {
    display: inline-flex; align-items: center; justify-content: center;
    width: 16px; height: 16px; border-radius: 50%;
    background: rgba(255,255,255,0.08); color: var(--muted);
    font-size: 12px; cursor: pointer;
  }
  .link-chip .x:hover { background: rgba(248,81,73,0.25); color: var(--danger); }

  .dropdown-menu {
    position: fixed; z-index: 30;
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
    padding: 6px; min-width: 260px;
    display: none; flex-direction: column; gap: 2px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  }
  .dropdown-menu .item {
    padding: 8px 12px; border-radius: 4px; cursor: pointer;
    display: flex; justify-content: space-between; gap: 12px; font-size: 13px;
  }
  .dropdown-menu .item:hover { background: var(--panel-2); }
  .dropdown-menu .item .meta { color: var(--muted); font-size: 11px; }
  .dropdown-menu .empty { color: var(--muted); padding: 10px 12px; font-style: italic; font-size: 12px; }
</style>
</head>
<body>
  <div id="canvas-container"></div>

  <div id="tabs">
    <button class="tab" data-world="people">People</button>
    <button class="tab" data-world="tasks">Tasks</button>
    <button class="tab" data-world="achievements">Achievements</button>
  </div>

  <div id="palette">
    <div id="palette-header">
      <h2 id="palette-title">Unassigned tasks</h2>
      <button id="add-palette-btn" class="primary">+ Task</button>
    </div>
    <div id="palette-strip"></div>
  </div>

  <div id="restore-menu" class="dropdown-menu"></div>

  <!-- bottom-left dock: instructional bar above the activity (toolbar) bar -->
  <div id="bottom-dock">
    <div id="status">
      <kbd>L-drag</kbd> orbit · <kbd>scroll</kbd> zoom · <kbd>click</kbd> select · <kbd>drag a small box</kbd> reassign · <kbd>drag to palette</kbd> unassign · <kbd>del</kbd> delete
    </div>
    <div id="toolbar">
      <button id="add-primary-btn" class="primary">+ Person</button>
      <button id="group-toggle-btn" title="Group tasks into projects (boxes stacked along depth)">Group: Off</button>
      <button id="add-project-btn" title="Create a new project">+ Project</button>
      <button id="auto-fit-btn" title="Re-arrange cards into a tidy auto grid">Auto-fit</button>
      <button id="focus-btn" title="Frame the board">Reset view</button>
      <button id="save-json-btn" title="Download current state as JSON">Save .json</button>
      <button id="load-json-btn" title="Replace current state with a JSON file">Load .json</button>
      <button id="autosave-btn" title="Pick a JSON file on disk and keep it in sync automatically">Auto-save</button>
      <button id="restore-btn" title="Restore from an automatic backup of a previous state">Restore ▾</button>
      <button id="undo-btn" title="Undo (Ctrl+Z)">↶</button>
      <button id="redo-btn" title="Redo (Ctrl+Y / Ctrl+Shift+Z)">↷</button>
      <input type="file" id="load-json-input" accept=".json,application/json" style="display:none;" />
    </div>
  </div>

  <aside id="sidebar">
    <header><h1 id="sidebar-title">Selection</h1></header>
    <div class="body" id="sidebar-body">
      <div class="empty">Nothing selected.<br/>Click a card to edit it.</div>
    </div>
    <footer id="sidebar-footer" style="display:none;">
      <button id="delete-btn" class="danger">Delete</button>
    </footer>
  </aside>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ============================================================
// Scene / camera / renderer
// ============================================================
const container = document.getElementById('canvas-container');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b1220);
scene.fog = new THREE.Fog(0x0b1220, 60, 240);

const camera = new THREE.PerspectiveCamera(55, 1, 0.1, 5000);
const DEFAULT_CAM_POS = new THREE.Vector3(8, 8, 14);
const DEFAULT_CAM_TARGET = new THREE.Vector3(0, 1.5, 0);
camera.position.copy(DEFAULT_CAM_POS);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
container.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.target.copy(DEFAULT_CAM_TARGET);
controls.screenSpacePanning = true;
controls.mouseButtons = { LEFT: THREE.MOUSE.ROTATE, MIDDLE: THREE.MOUSE.PAN, RIGHT: null };

const ambientLight = new THREE.AmbientLight(0xffffff, 0.9);
scene.add(ambientLight);
const sun = new THREE.DirectionalLight(0xffffff, 0.4);
sun.position.set(10, 20, 10);
scene.add(sun);

// ============================================================
// Themed sky dome + ground floor (shown by worlds whose theme defines them)
// ============================================================
const floorGeo = new THREE.PlaneGeometry(2000, 2000);
floorGeo.rotateX(-Math.PI / 2);
const floorMat = new THREE.MeshStandardMaterial({ color: 0x1a1208, roughness: 0.92, metalness: 0.08 });
const floorMesh = new THREE.Mesh(floorGeo, floorMat);
floorMesh.position.y = -0.05;
floorMesh.renderOrder = -3;
floorMesh.visible = false;
scene.add(floorMesh);

const skyGeo = new THREE.SphereGeometry(900, 32, 16);
const skyMat = new THREE.ShaderMaterial({
  uniforms: {
    uHorizon: { value: new THREE.Color(0xffb84d) },
    uSky: { value: new THREE.Color(0x0a0703) },
    uGround: { value: new THREE.Color(0x1a1208) },
  },
  vertexShader: `
    varying vec3 vWorldDir;
    void main() {
      vWorldDir = normalize((modelMatrix * vec4(position, 0.0)).xyz);
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    precision highp float;
    varying vec3 vWorldDir;
    uniform vec3 uHorizon; uniform vec3 uSky; uniform vec3 uGround;
    void main() {
      float h = vWorldDir.y;
      float horizonGlow = exp(-abs(h) * 6.0);
      vec3 base = (h < 0.0) ? mix(uGround, uHorizon, smoothstep(-0.3, 0.0, h))
                            : mix(uHorizon, uSky, smoothstep(0.0, 0.5, h));
      vec3 col = base + uHorizon * horizonGlow * 0.6;
      gl_FragColor = vec4(col, 1.0);
    }
  `,
  side: THREE.BackSide, depthWrite: false,
});
const skyMesh = new THREE.Mesh(skyGeo, skyMat);
skyMesh.renderOrder = -10;
skyMesh.visible = false;
scene.add(skyMesh);

// ============================================================
// Infinite ground grid (shader on a large plane)
// ============================================================
const gridGeo = new THREE.PlaneGeometry(2000, 2000);
gridGeo.rotateX(-Math.PI / 2);
const gridMat = new THREE.ShaderMaterial({
  transparent: true, side: THREE.DoubleSide,
  uniforms: {
    uMinor: { value: new THREE.Color(0x16243a) },
    uMajor: { value: new THREE.Color(0x244062) },
    uAxisX: { value: new THREE.Color(0x3a5a8b) },
    uAxisZ: { value: new THREE.Color(0x3a5a8b) },
    uMinorStep: { value: 1.0 }, uMajorStep: { value: 10.0 },
    uFadeNear: { value: 30.0 }, uFadeFar: { value: 200.0 },
  },
  vertexShader: `
    varying vec3 vWorld;
    void main() { vec4 wp = modelMatrix * vec4(position, 1.0); vWorld = wp.xyz; gl_Position = projectionMatrix * viewMatrix * wp; }
  `,
  fragmentShader: `
    precision highp float;
    varying vec3 vWorld;
    uniform vec3 uMinor, uMajor, uAxisX, uAxisZ;
    uniform float uMinorStep, uMajorStep, uFadeNear, uFadeFar;
    float gridLine(vec2 p, float step) { vec2 g = abs(fract(p / step - 0.5) - 0.5) / fwidth(p / step); float l = min(g.x, g.y); return 1.0 - min(l, 1.0); }
    float axisLine(float c) { float w = fwidth(c); return 1.0 - smoothstep(0.0, w * 1.5, abs(c)); }
    void main() {
      vec2 p = vWorld.xz;
      float minor = gridLine(p, uMinorStep);
      float major = gridLine(p, uMajorStep);
      float ax2 = axisLine(vWorld.z);
      float az2 = axisLine(vWorld.x);
      vec3 col = uMinor * minor;
      col = mix(col, uMajor, major);
      col = mix(col, uAxisX, ax2 * 0.9);
      col = mix(col, uAxisZ, az2 * 0.9);
      float alpha = max(max(minor * 0.5, major), max(ax2, az2));
      float dist = length(vWorld.xz - cameraPosition.xz);
      float fade = 1.0 - smoothstep(uFadeNear, uFadeFar, dist);
      alpha *= fade;
      if (alpha < 0.005) discard;
      gl_FragColor = vec4(col, alpha);
    }
  `,
});
const grid = new THREE.Mesh(gridGeo, gridMat);
grid.renderOrder = -2;
scene.add(grid);

// ============================================================
// Worlds — theme + state
// ============================================================
const WORLDS = ['people', 'tasks', 'achievements'];
const WORLD_LABELS = { people: 'People', tasks: 'Tasks', achievements: 'Achievements' };
let currentWorld = 'people';

const WORLD_THEMES = {
  people: { // dark background, blue tint
    background: 0x080d18, fog: { color: 0x080d18, near: 60, far: 240 },
    grid: { minor: 0x16243a, major: 0x274a78, axisX: 0x3a5a8b, axisZ: 0x3a5a8b },
    ambient: { color: 0xcfe0ff, intensity: 0.9 }, sun: { color: 0xbcd4ff, intensity: 0.5 },
  },
  tasks: { // dark background, red tint
    background: 0x150709, fog: { color: 0x150709, near: 60, far: 240 },
    grid: { minor: 0x361119, major: 0x6e2733, axisX: 0x8e3a44, axisZ: 0x8e3a44 },
    ambient: { color: 0xffd9d9, intensity: 0.9 }, sun: { color: 0xffc9c9, intensity: 0.5 },
  },
  achievements: {
    background: 0x0a0703, fog: { color: 0x3a2208, near: 40, far: 200 },
    grid: { minor: 0x4a3818, major: 0xd4a017, axisX: 0xffd700, axisZ: 0xffd700 },
    ambient: { color: 0xffe4a0, intensity: 0.55 }, sun: { color: 0xffd87a, intensity: 1.3 },
    sky: { horizon: 0xffb84d, sky: 0x0a0703, ground: 0x1a1208 },
    floor: 0x1a1208,
  },
};

// Entity colors are constant across worlds so types stay recognizable:
// people = blue, tasks = green, achievements = gold.
const PERSON_PALETTE = ['#2f6fe0', '#4f8cff', '#1f5ad0', '#3a7bd5', '#5aa0ff'];
const TASK_PALETTE = ['#e5484d', '#f2555a', '#d23b40', '#ff6b6b', '#c0392b'];
const ACH_PALETTE = ['#ffd700', '#ffb84d', '#d4a017', '#daa520', '#e6c200'];
const PROJECT_PALETTE = ['#b07cff', '#ff9f5c', '#f25c8a', '#5cc8ff', '#ffd24a'];

// People = dark cards (light text); Tasks = white cards (faintly red-tinted).
const PERSON_CARD = { bg: '#10203a', bgSel: '#1d3a66', border: '#2a4a6e', borderSel: '#79b8ff', text: '#dbe9ff' };
const TASK_CARD = { bg: '#fff0f0', bgSel: '#ffdede', border: '#edc4c4', borderSel: '#e5484d', text: '#2e0d0d' };
const ACH_CARD = { bg: '#1a1408', bgSel: '#3a2a08', border: '#5a3a08', borderSel: '#ffd700', text: '#ffd87a' };

function getThemeFor(world) { return WORLD_THEMES[world] || WORLD_THEMES.people; }
function theme() { return getThemeFor(currentWorld); }

function applyTheme() {
  const t = theme();
  scene.background = new THREE.Color(t.background);
  scene.fog.color.set(t.fog.color);
  scene.fog.near = t.fog.near; scene.fog.far = t.fog.far;
  gridMat.uniforms.uMinor.value.set(t.grid.minor);
  gridMat.uniforms.uMajor.value.set(t.grid.major);
  gridMat.uniforms.uAxisX.value.set(t.grid.axisX);
  gridMat.uniforms.uAxisZ.value.set(t.grid.axisZ);
  gridMat.uniforms.uFadeFar.value = t.fog.far - 40;
  ambientLight.color.set(t.ambient.color); ambientLight.intensity = t.ambient.intensity;
  sun.color.set(t.sun.color); sun.intensity = t.sun.intensity;
  if (t.sky) {
    skyMesh.visible = true;
    skyMat.uniforms.uHorizon.value.set(t.sky.horizon);
    skyMat.uniforms.uSky.value.set(t.sky.sky);
    skyMat.uniforms.uGround.value.set(t.sky.ground);
  } else skyMesh.visible = false;
  if (t.floor != null) { floorMesh.visible = true; floorMat.color.set(t.floor); }
  else floorMesh.visible = false;
}

// ============================================================
// Data model
//   people:       id -> { id, title, description, color }
//   tasks:        id -> { id, title, description, color, assigneeIds:[] }
//   achievements: id -> { id, title, description, position:[x,y,z], color, mesh, canvas, texture }
// People <-> Tasks is many-to-many via task.assigneeIds.
// ============================================================
const people = new Map();
const tasks = new Map();
const achievements = new Map();
const projects = new Map();      // id -> { id, title, color }
const peopleGroups = new Map();  // id -> { id, title, color }
let groupTasks = false;          // Tasks-world grouping mode (tasks → project boxes)
let groupPeople = false;         // People-world grouping mode (people → group boxes)

function tasksForPerson(pid) { return [...tasks.values()].filter(t => t.assigneeIds.includes(pid)); }
function peopleForTask(t) { return t.assigneeIds.map(id => people.get(id)).filter(Boolean); }
function unassignedTasks() { return [...tasks.values()].filter(t => t.assigneeIds.length === 0); }
function assignedPersonIds() { const s = new Set(); for (const t of tasks.values()) for (const id of t.assigneeIds) s.add(id); return s; }
function unassignedPeople() { const a = assignedPersonIds(); return [...people.values()].filter(p => !a.has(p.id)); }
function tasksForProject(pid) { return [...tasks.values()].filter(t => t.projectId === pid); }
function ungroupedTasks() { return [...tasks.values()].filter(t => !t.projectId || !projects.has(t.projectId)); }
function peopleInGroup(gid) { return [...people.values()].filter(p => p.groupId === gid); }
function grouplessPeople() { return [...people.values()].filter(p => !p.groupId || !peopleGroups.has(p.groupId)); }

// People carry structured name fields; everything else just has a title.
function personName(p) {
  const last = (p.lastName || '').trim(), first = (p.firstName || '').trim();
  if (last && first) return `${last}, ${first}`;
  return last || first || 'Unnamed';
}
function labelOf(kind, e) { return kind === 'person' ? personName(e) : (e.title || 'Untitled'); }

function pick(palette) { return palette[Math.floor(Math.random() * palette.length)]; }

function addPerson({ firstName = '', lastName = '', jobTitle = '', rank = '', description = '', color, title } = {}) {
  // accept a legacy single "title" as a full name
  if (title && !firstName && !lastName) { const parts = title.trim().split(/\s+/); firstName = parts.shift() || ''; lastName = parts.join(' '); }
  if (!firstName && !lastName) firstName = 'New person';
  const id = crypto.randomUUID();
  const p = { id, firstName, lastName, jobTitle, rank, description, color: color || pick(PERSON_PALETTE),
    showJobTitle: true, showRank: true, showDescription: false, groupId: null, pos: null };
  people.set(id, p);
  refreshActiveWorld(); updatePalette();
  select('person', id); save(); scheduleHistorySnapshot(true);
  return p;
}
function addTask({ title = 'New task', description = '', color, assigneeIds = [], projectId = null } = {}) {
  const id = crypto.randomUUID();
  const t = { id, title, description, color: color || pick(TASK_PALETTE), assigneeIds: [...assigneeIds], projectId, showDescription: false, pos: null };
  tasks.set(id, t);
  refreshActiveWorld(); updatePalette();
  select('task', id); save(); scheduleHistorySnapshot(true);
  return t;
}
function addProject({ title = 'New project', color } = {}) {
  const id = crypto.randomUUID();
  const p = { id, title, color: color || pick(PROJECT_PALETTE), zOffset: 0 };
  projects.set(id, p);
  refreshActiveWorld();
  select('project', id); save(); scheduleHistorySnapshot(true);
  return p;
}
function deleteProject(id) {
  for (const t of tasks.values()) if (t.projectId === id) t.projectId = null;
  projects.delete(id);
  if (isSelected('project', id)) select(null);
  refreshActiveWorld(); save(); scheduleHistorySnapshot(true);
}
function addGroup({ title = 'New group', color } = {}) {
  const id = crypto.randomUUID();
  const g = { id, title, color: color || pick(PROJECT_PALETTE), zOffset: 0 };
  peopleGroups.set(id, g);
  refreshActiveWorld();
  select('group', id); save(); scheduleHistorySnapshot(true);
  return g;
}
function deleteGroup(id) {
  for (const p of people.values()) if (p.groupId === id) p.groupId = null;
  peopleGroups.delete(id);
  if (isSelected('group', id)) select(null);
  refreshActiveWorld(); save(); scheduleHistorySnapshot(true);
}
function addAchievement({ title = 'New achievement', description = '', color } = {}) {
  const id = crypto.randomUUID();
  const a = { id, title, description, color: color || pick(ACH_PALETTE), showDescription: false, pos: null };
  achievements.set(id, a);
  refreshActiveWorld();
  select('achievement', id); save(); scheduleHistorySnapshot(true);
  return a;
}

function deletePerson(id) {
  for (const t of tasks.values()) t.assigneeIds = t.assigneeIds.filter(x => x !== id);
  people.delete(id);
  if (isSelected('person', id)) select(null);
  refreshActiveWorld(); updatePalette(); save(); scheduleHistorySnapshot(true);
}
function deleteTask(id) {
  tasks.delete(id);
  if (isSelected('task', id)) select(null);
  refreshActiveWorld(); updatePalette(); save(); scheduleHistorySnapshot(true);
}
function deleteAchievement(id) {
  achievements.delete(id);
  if (isSelected('achievement', id)) select(null);
  refreshActiveWorld(); save(); scheduleHistorySnapshot(true);
}

// ============================================================
// Canvas drawing helpers
// ============================================================
function makeCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function wrapText(ctx, text, x, y, maxWidth, lineHeight, maxLines) {
  const words = String(text).split(/\s+/);
  let line = ''; const lines = [];
  for (const word of words) {
    const test = line ? line + ' ' + word : word;
    if (ctx.measureText(test).width > maxWidth && line) { lines.push(line); line = word; }
    else line = test;
    if (lines.length >= maxLines) break;
  }
  if (line && lines.length < maxLines) lines.push(line);
  if (lines.length === maxLines) {
    let last = lines[maxLines - 1];
    if (lines.join(' ').split(/\s+/).length < words.length) {
      while (ctx.measureText(last + '…').width > maxWidth && last.length > 0) last = last.slice(0, -1);
      lines[maxLines - 1] = last + '…';
    }
  }
  lines.forEach((l, i) => ctx.fillText(l, x, y + i * lineHeight));
}
function truncate(ctx, text, maxWidth) {
  let s = String(text);
  if (ctx.measureText(s).width <= maxWidth) return s;
  while (s.length > 1 && ctx.measureText(s + '…').width > maxWidth) s = s.slice(0, -1);
  return s + '…';
}
function drawStar(ctx, cx, cy, outer, inner, fill, stroke) {
  ctx.save(); ctx.translate(cx, cy); ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const r = (i % 2 === 0) ? outer : inner;
    const a = Math.PI / 5 * i - Math.PI / 2;
    const px = Math.cos(a) * r, py = Math.sin(a) * r;
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.closePath();
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = 2; ctx.stroke(); }
  ctx.restore();
}

// ---- Big cards (512x288) ----
const FONT = 'Segoe UI, Roboto, sans-serif';
function paintPersonBig(ctx, p, selected) {
  const w = 512, h = 288; ctx.clearRect(0, 0, w, h);
  const c = PERSON_CARD, accent = p.color || PERSON_PALETTE[0];
  ctx.fillStyle = selected ? c.bgSel : c.bg; roundRect(ctx, 4, 4, w - 8, h - 8, 36); ctx.fill();
  ctx.lineWidth = selected ? 7 : 3; ctx.strokeStyle = selected ? c.borderSel : c.border; roundRect(ctx, 4, 4, w - 8, h - 8, 36); ctx.stroke();
  ctx.fillStyle = accent; ctx.beginPath(); ctx.arc(54, 54, 26, 0, Math.PI * 2); ctx.fill();
  ctx.textBaseline = 'top';
  // name (core — always shown)
  ctx.fillStyle = c.text; ctx.font = `700 36px -apple-system, ${FONT}`;
  wrapText(ctx, personName(p), 98, 30, w - 130, 42, 2);
  // optional fields, stacked, only when "show on card" is checked
  let y = 120;
  if (p.showJobTitle && p.jobTitle) { ctx.fillStyle = '#5a6b82'; ctx.font = `500 27px -apple-system, ${FONT}`; ctx.fillText(truncate(ctx, p.jobTitle, w - 80), 40, y); y += 42; }
  if (p.showRank && p.rank) { ctx.fillStyle = accent; ctx.font = `700 25px -apple-system, ${FONT}`; ctx.fillText(truncate(ctx, 'Rank · ' + p.rank, w - 80), 40, y); y += 42; }
  if (p.showDescription && p.description) { ctx.fillStyle = '#6b7686'; ctx.font = `400 22px -apple-system, ${FONT}`; wrapText(ctx, p.description, 40, y, w - 80, 28, Math.max(1, Math.floor((h - 24 - y) / 28))); }
}
function paintTaskBig(ctx, task, selected) {
  const w = 512, h = 288; ctx.clearRect(0, 0, w, h);
  const c = TASK_CARD, accent = task.color || TASK_PALETTE[0];
  const showDesc = task.showDescription && task.description;
  ctx.fillStyle = selected ? c.bgSel : c.bg; roundRect(ctx, 4, 4, w - 8, h - 8, 8); ctx.fill();
  ctx.lineWidth = selected ? 7 : 3; ctx.strokeStyle = selected ? c.borderSel : c.border; roundRect(ctx, 4, 4, w - 8, h - 8, 8); ctx.stroke();
  ctx.fillStyle = accent; ctx.fillRect(18, 24, 12, h - 48);
  ctx.strokeStyle = accent; ctx.lineWidth = 4; roundRect(ctx, 50, 44, 42, 42, 6); ctx.stroke();
  ctx.fillStyle = c.text; ctx.font = `600 36px -apple-system, ${FONT}`; ctx.textBaseline = 'top';
  wrapText(ctx, task.title || 'Untitled', 110, 46, w - 140, 44, showDesc ? 2 : 4);
  if (showDesc) { ctx.fillStyle = '#7a5560'; ctx.font = `400 23px -apple-system, ${FONT}`; wrapText(ctx, task.description, 40, 150, w - 80, 29, 3); }
}
function paintAchievementBig(ctx, a, selected) {
  const w = 512, h = 288; ctx.clearRect(0, 0, w, h);
  const c = ACH_CARD, accent = a.color || ACH_PALETTE[0];
  const showDesc = a.showDescription && a.description;
  ctx.save(); ctx.globalAlpha = 0.18; drawStar(ctx, w / 2, h / 2, 120, 52, accent, null); ctx.restore();
  ctx.fillStyle = selected ? c.bgSel : c.bg; roundRect(ctx, 4, 4, w - 8, h - 8, 28); ctx.fill();
  ctx.lineWidth = selected ? 7 : 4; ctx.strokeStyle = selected ? c.borderSel : accent; roundRect(ctx, 4, 4, w - 8, h - 8, 28); ctx.stroke();
  drawStar(ctx, 42, 42, 18, 8, '#ffd700', '#b8860b');
  ctx.fillStyle = c.text; ctx.font = `700 36px -apple-system, ${FONT}`; ctx.textBaseline = 'top';
  wrapText(ctx, a.title || 'Achievement', 72, 40, w - 100, 44, showDesc ? 2 : 4);
  if (showDesc) { ctx.fillStyle = '#caa86a'; ctx.font = `400 23px -apple-system, ${FONT}`; wrapText(ctx, a.description, 72, 130, w - 110, 29, 3); }
}

// ---- Mini boxes (256x100) ----
function paintMini(ctx, title, accent, card, kind, selected) {
  const w = 256, h = 100; ctx.clearRect(0, 0, w, h);
  ctx.fillStyle = selected ? card.bgSel : card.bg; roundRect(ctx, 3, 3, w - 6, h - 6, kind === 'person' ? 22 : 8); ctx.fill();
  ctx.lineWidth = selected ? 6 : 3; ctx.strokeStyle = selected ? card.borderSel : card.border; roundRect(ctx, 3, 3, w - 6, h - 6, kind === 'person' ? 22 : 8); ctx.stroke();
  ctx.fillStyle = accent;
  if (kind === 'person') { ctx.beginPath(); ctx.arc(32, h / 2, 16, 0, Math.PI * 2); ctx.fill(); }
  else ctx.fillRect(14, 18, 8, h - 36);
  ctx.fillStyle = card.text; ctx.font = '600 30px -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif'; ctx.textBaseline = 'middle';
  ctx.fillText(truncate(ctx, title || 'Untitled', w - 70), 56, h / 2 + 2);
}

// ============================================================
// Mesh factories
// ============================================================
const NODE_ALTITUDE = 2.0;
// A card = front plane + a back plane whose texture is horizontally mirrored, so the
// text reads correctly from both sides. Returned `mesh` is a Group (front + back).
function makeTexturedPlane(w, h, canvas) {
  const aniso = renderer.capabilities.getMaxAnisotropy();
  const front = new THREE.CanvasTexture(canvas);
  front.anisotropy = aniso; front.colorSpace = THREE.SRGBColorSpace;
  const back = new THREE.CanvasTexture(canvas);
  back.anisotropy = aniso; back.colorSpace = THREE.SRGBColorSpace;
  back.wrapS = THREE.RepeatWrapping; back.repeat.x = -1; back.offset.x = 1; // mirror → readable from behind
  const geo = new THREE.PlaneGeometry(w, h);
  const group = new THREE.Group();
  group.add(new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ map: front, transparent: true, side: THREE.FrontSide })));
  group.add(new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ map: back, transparent: true, side: THREE.BackSide })));
  return { mesh: group, texture: front };
}
// ============================================================
// Board layout (People / Tasks worlds)
// ============================================================
// Big cards stand on the ground plane (bottom at y=0) — all at the SAME altitude —
// arranged in a grid: X = columns, Z = rows going back. Minis stack behind (−Z).
const PW = 3.2, PH = 1.8;
const MW = 1.5, MH = 0.6;
const COL_OFF = 0.85;              // mini column x offset from card center
const CELL_X = PW + 1.6;           // column pitch (X)
const STAND_Y = PH / 2;            // uniform card-center altitude (bottom on ground)
const MINI_Y = MH / 2;             // mini-box center altitude
const CARD_TO_MINI = 1.0;          // depth (−Z) from a card to its first mini row
const MINI_ROW_DZ = MH + 0.18;     // depth pitch between mini rows
const ROW_GAP_Z = 3.5;             // Z spacing between card rows (minis stack up, not back)
const GROUP_GAP = 2.5, GROUP_PAD = 1.0; // footprint padding / gap between groups
const SNAP = 1.0; // grid step (world units) for dragging
function snap(v) { return Math.round(v / SNAP) * SNAP; }
function validPos(p) { return p && typeof p.x === 'number' && typeof p.z === 'number' ? { x: p.x, z: p.z } : null; }

let boardObjects = [];   // all meshes for the current board
let boardPickables = []; // subset used for raycasting
let boardBounds = null;

function disposeBoard() {
  for (const o of boardObjects) {
    scene.remove(o);
    o.traverse(c => {
      if (c.geometry) c.geometry.dispose();
      if (c.material) { c.material.map?.dispose(); c.material.dispose(); }
    });
  }
  boardObjects = [];
  boardPickables = [];
}

// Returns the list of [entity, relatedMiniItems] for the active board world.
function boardEntries() {
  if (currentWorld === 'people') {
    return [...people.values()].map(p => ({
      kind: 'person', entity: p,
      minis: tasksForPerson(p.id).map(t => ({ kind: 'task', entity: t, taskId: t.id, personId: p.id })),
    }));
  } else if (currentWorld === 'tasks') {
    return [...tasks.values()].map(t => ({
      kind: 'task', entity: t,
      minis: peopleForTask(t).map(p => ({ kind: 'person', entity: p, taskId: t.id, personId: p.id })),
    }));
  } else { // achievements — standalone cards, no relationships
    return [...achievements.values()].map(a => ({ kind: 'achievement', entity: a, minis: [] }));
  }
}

function entryMiniRows(e) { return Math.ceil(e.minis.length / 2); }

// Place one entity's big card standing on the ground at (x, frontZ) — uniform
// altitude — with its mini boxes stacked behind it (−Z). Returns ground X/Z bounds.
function placeEntry(e, x, frontZ, groupKey) {
  const bigCanvas = makeCanvas(512, 288);
  const sel = isSelected(e.kind, e.entity.id);
  if (e.kind === 'person') paintPersonBig(bigCanvas.getContext('2d'), e.entity, sel);
  else if (e.kind === 'task') paintTaskBig(bigCanvas.getContext('2d'), e.entity, sel);
  else paintAchievementBig(bigCanvas.getContext('2d'), e.entity, sel);
  const big = makeTexturedPlane(PW, PH, bigCanvas);
  big.texture.needsUpdate = true;
  big.mesh.position.set(x, STAND_Y, frontZ);
  big.mesh.userData = { kind: e.kind, id: e.entity.id, groupKey };
  scene.add(big.mesh); boardObjects.push(big.mesh); boardPickables.push(big.mesh);

  const cardTop = STAND_Y + PH / 2;
  let topY = cardTop;
  e.minis.forEach((mi, k) => {
    const col = k % 2, row = Math.floor(k / 2);
    const mx = x + (col === 0 ? -COL_OFF : COL_OFF);
    const my = cardTop + CARD_TO_MINI + MH / 2 + row * MINI_ROW_DZ; // stack UP in the card's vertical plane
    const canvas = makeCanvas(256, 100);
    const msel = isSelected(mi.kind, mi.entity.id);
    const accent = mi.kind === 'person' ? (mi.entity.color || PERSON_PALETTE[0]) : (mi.entity.color || TASK_PALETTE[0]);
    const card = mi.kind === 'person' ? PERSON_CARD : TASK_CARD;
    paintMini(canvas.getContext('2d'), labelOf(mi.kind, mi.entity), accent, card, mi.kind, msel);
    const mini = makeTexturedPlane(MW, MH, canvas);
    mini.texture.needsUpdate = true;
    mini.mesh.position.set(mx, my, frontZ + 0.02);
    mini.mesh.userData = { kind: 'assign', miniKind: mi.kind, id: mi.entity.id, taskId: mi.taskId, personId: mi.personId, groupKey };
    scene.add(mini.mesh); boardObjects.push(mini.mesh); boardPickables.push(mini.mesh);
    topY = Math.max(topY, my + MH / 2);
  });
  return { minX: x - PW / 2, maxX: x + PW / 2, minZ: frontZ - 0.5, maxZ: frontZ + 0.5, maxY: topY };
}

// Lay entries into a grid on the ground (X columns, −Z rows) starting at frontZ.
// singleRow=true puts them all in one aligned row along X (for free/ungrouped cards).
function layoutGrid(entries, frontZ, groupKey, singleRow, originX = 0) {
  const n = entries.length;
  if (n === 0) return { minX: originX - PW / 2, maxX: originX + PW / 2, minZ: frontZ - 1, maxZ: frontZ + 1, maxY: PH };
  const cols = singleRow ? n : Math.ceil(Math.sqrt(n));
  const rowDepth = ROW_GAP_Z; // minis stack up now, so rows only need card spacing in Z
  let b = { minX: Infinity, maxX: -Infinity, minZ: Infinity, maxZ: -Infinity, maxY: -Infinity };
  entries.forEach((e, i) => {
    const r = Math.floor(i / cols), c = i % cols;
    let x = originX + (c - (cols - 1) / 2) * CELL_X;
    let z = frontZ - r * rowDepth;
    if (e.entity.pos) { x = e.entity.pos.x; z = e.entity.pos.z; } // manual placement wins
    const cb = placeEntry(e, x, z, groupKey);
    b.minX = Math.min(b.minX, cb.minX); b.maxX = Math.max(b.maxX, cb.maxX);
    b.minZ = Math.min(b.minZ, cb.minZ); b.maxZ = Math.max(b.maxZ, cb.maxZ);
    b.maxY = Math.max(b.maxY, cb.maxY);
  });
  return b;
}

function buildBoard() {
  disposeBoard();
  if (currentWorld === 'tasks' && groupTasks) { buildGrouped(tasksGroupConfig()); return; }
  if (currentWorld === 'people' && groupPeople) { buildGrouped(peopleGroupConfig()); return; }
  boardBounds = layoutGrid(boardEntries(), 0, undefined, true); // free cards → single aligned row
}

function tasksGroupConfig() {
  return {
    containerKind: 'project', ungroupedLabel: 'No project',
    containers: [...projects.values()],
    ungrouped: ungroupedTasks(),
    membersOf: id => tasksForProject(id),
    memberKind: 'task',
    minisOf: t => peopleForTask(t).map(p => ({ kind: 'person', entity: p, taskId: t.id, personId: p.id })),
  };
}
function peopleGroupConfig() {
  return {
    containerKind: 'group', ungroupedLabel: 'No group',
    containers: [...peopleGroups.values()],
    ungrouped: grouplessPeople(),
    membersOf: id => peopleInGroup(id),
    memberKind: 'person',
    minisOf: p => tasksForPerson(p.id).map(t => ({ kind: 'task', entity: t, taskId: t.id, personId: p.id })),
  };
}

// Generic grouped view: members bundled into container boxes stacked along -Z.
function buildGrouped(cfg) {
  const groups = [];
  if (cfg.ungrouped.length) groups.push({ container: null, members: cfg.ungrouped });
  for (const c of cfg.containers) groups.push({ container: c, members: cfg.membersOf(c.id) });
  if (groups.length === 0) { boardBounds = { minX: -PW, maxX: PW, minZ: -1, maxZ: 1, maxY: PH }; return; }

  // arrange the group boxes themselves into a grid (a box), not a single line
  const estimate = g => {
    const n = g.members.length;
    const singleRow = g.container === null;
    const cols = n === 0 ? 1 : (singleRow ? n : Math.ceil(Math.sqrt(n)));
    const rows = n === 0 ? 1 : Math.ceil(n / cols);
    return { w: cols * CELL_X, depth: (rows - 1) * ROW_GAP_Z + PW + 1 };
  };
  const sizes = groups.map(estimate);
  const cellW = Math.max(...sizes.map(s => s.w)) + GROUP_PAD * 2 + GROUP_GAP;
  const cellD = Math.max(...sizes.map(s => s.depth)) + GROUP_PAD * 2 + GROUP_GAP;
  const gCols = Math.ceil(Math.sqrt(groups.length));

  let B = { minX: Infinity, maxX: -Infinity, minZ: Infinity, maxZ: -Infinity, maxY: -Infinity };
  groups.forEach((g, gi) => {
    const gc = gi % gCols, gr = Math.floor(gi / gCols);
    const originX = (gc - (gCols - 1) / 2) * cellW;
    const frontZ = -gr * cellD;
    const groupKey = g.container ? g.container.id : '__ungrouped_' + gi;
    const entries = g.members.map(e => ({ kind: cfg.memberKind, entity: e, minis: cfg.minisOf(e) }));
    const gb = layoutGrid(entries, frontZ, groupKey, g.container === null, originX); // free group → single row
    addGroupBox(g.container, gb, cfg.containerKind, cfg.ungroupedLabel, groupKey);
    B.minX = Math.min(B.minX, gb.minX - GROUP_PAD); B.maxX = Math.max(B.maxX, gb.maxX + GROUP_PAD);
    B.minZ = Math.min(B.minZ, gb.minZ - GROUP_PAD); B.maxZ = Math.max(B.maxZ, gb.maxZ + GROUP_PAD);
    B.maxY = Math.max(B.maxY, gb.maxY);
  });
  boardBounds = B;
}

function paintGroupLabel(ctx, title, color, selected) {
  const w = ctx.canvas.width, h = ctx.canvas.height;
  ctx.clearRect(0, 0, w, h);
  ctx.fillStyle = '#161b22'; roundRect(ctx, 2, 2, w - 4, h - 4, h * 0.32); ctx.fill();
  ctx.lineWidth = selected ? 7 : 4; ctx.strokeStyle = color; roundRect(ctx, 2, 2, w - 4, h - 4, h * 0.32); ctx.stroke();
  ctx.fillStyle = '#e6edf3'; ctx.font = `700 ${Math.round(h * 0.5)}px -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif`; ctx.textBaseline = 'middle';
  ctx.fillText(truncate(ctx, title, w - 28), 18, h / 2 + 1);
}

function addGroupBox(container, gb, kind, ungroupedLabel, groupKey) {
  const w = (gb.maxX - gb.minX) + GROUP_PAD * 2;
  const depth = (gb.maxZ - gb.minZ) + GROUP_PAD * 2;
  const height = (gb.maxY || PH) + GROUP_PAD; // encompass the cards + their stacked minis
  const cx = (gb.minX + gb.maxX) / 2, cz = (gb.minZ + gb.maxZ) / 2;
  const color = container ? (container.color || PROJECT_PALETTE[0]) : '#8b949e';

  // wireframe cuboid encompassing the group's contents, sitting on the ground
  const box = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(w, height, depth)), new THREE.LineBasicMaterial({ color }));
  box.position.set(cx, height / 2, cz);
  box.userData = { groupKey };
  scene.add(box); boardObjects.push(box);

  // faint floor fill — also the click/drag/drop target for the container
  const panelGeo = new THREE.PlaneGeometry(w, depth); panelGeo.rotateX(-Math.PI / 2);
  const panel = new THREE.Mesh(panelGeo, new THREE.MeshBasicMaterial({ color, transparent: true, opacity: container ? 0.10 : 0.05, side: THREE.DoubleSide, depthWrite: false }));
  panel.position.set(cx, 0.04, cz);
  panel.userData = container ? { kind, id: container.id, groupKey } : { groupKey };
  scene.add(panel); boardObjects.push(panel);
  if (container) boardPickables.push(panel);

  // label standing at the front-top edge of the cuboid (fixed-facing, not billboarded)
  const lw = Math.min(w, 5), lh = 0.7;
  const lc = makeCanvas(Math.round(lw * 64), Math.round(lh * 64));
  paintGroupLabel(lc.getContext('2d'), container ? (container.title || 'Untitled') : ungroupedLabel, color, container ? isSelected(kind, container.id) : false);
  const label = makeTexturedPlane(lw, lh, lc);
  label.texture.needsUpdate = true;
  label.mesh.position.set(cx, height + 0.4, gb.maxZ + GROUP_PAD - 0.1);
  label.mesh.userData = container ? { kind, id: container.id, groupKey } : { groupKey };
  if (container) boardPickables.push(label.mesh);
  scene.add(label.mesh); boardObjects.push(label.mesh);
}

function refreshActiveWorld() {
  buildBoard();
}

function fitCamera() {
  if (!boardBounds) return;
  const b = boardBounds;
  const cx = (b.minX + b.maxX) / 2, cz = (b.minZ + b.maxZ) / 2;
  const top = b.maxY || PH;
  const size = Math.max(b.maxX - b.minX, b.maxZ - b.minZ, top, 8);
  controls.target.set(cx, top / 2, cz);
  camera.position.set(cx, top * 0.6 + size * 0.45 + 4, b.maxZ + size * 0.9 + 6);
}

// ============================================================
// Palette (left) — unassigned items, drag onto a card to assign
// ============================================================
const paletteStrip = document.getElementById('palette-strip');

function updatePalette() {
  paletteStrip.innerHTML = '';
  if (currentWorld === 'achievements') return;
  const items = currentWorld === 'people'
    ? unassignedTasks().map(t => ({ kind: 'task', entity: t }))
    : unassignedPeople().map(p => ({ kind: 'person', entity: p }));
  if (items.length === 0) {
    const empty = document.createElement('div');
    empty.className = 'palette-empty';
    empty.textContent = currentWorld === 'people' ? 'No unassigned tasks.' : 'No unassigned people.';
    paletteStrip.appendChild(empty);
    return;
  }
  for (const it of items) {
    const chip = document.createElement('div');
    chip.className = 'chip ' + it.kind;
    const accent = it.kind === 'person' ? (it.entity.color || PERSON_PALETTE[0]) : (it.entity.color || TASK_PALETTE[0]);
    chip.innerHTML = `<span class="dot" style="background:${accent}"></span><span class="label"></span>`;
    chip.querySelector('.label').textContent = labelOf(it.kind, it.entity);
    chip.addEventListener('pointerdown', (ev) => {
      ev.preventDefault();
      startAssignDrag({ kind: it.kind, id: it.entity.id, origin: 'palette' }, ev);
    });
    chip.addEventListener('click', () => select(it.kind, it.entity.id));
    paletteStrip.appendChild(chip);
  }
}

// ============================================================
// Selection + sidebar
// ============================================================
let selection = null; // { type:'person'|'task'|'achievement', id }
function isSelected(type, id) { return selection && selection.type === type && selection.id === id; }
function entityFor(sel) {
  if (!sel) return null;
  if (sel.type === 'person') return people.get(sel.id);
  if (sel.type === 'task') return tasks.get(sel.id);
  if (sel.type === 'achievement') return achievements.get(sel.id);
  if (sel.type === 'project') return projects.get(sel.id);
  if (sel.type === 'group') return peopleGroups.get(sel.id);

}
function select(type, id = null) {

  renderSidebar();
}

function makeField(labelText, value, multiline, onInput) {

// A field with a "Show on card" checkbox in its label row (for non-core data).
function makeToggleField(labelText, value, multiline, onInput, ent, flagKey) {

function renderSidebar() {
  const titleEl = document.getElementById('sidebar-title');
  const body = document.getElementById('sidebar-body');
  const footer = document.getElementById('sidebar-footer');
  const ent = entityFor(selection);
  if (!ent) {
    titleEl.textContent = 'Selection';
    body.innerHTML = '<div class="empty">Nothing selected.<br/>Click a card to edit it.</div>';
    footer.style.display = 'none';
    return;
  }
  body.innerHTML = '';
  const type = selection.type;
  titleEl.textContent = { person: 'Person', task: 'Task', project: 'Project', group: 'Group', achievement: 'Achievement' }[type] || 'Selection';

  if (type === 'person') {
    const nameChanged = v => { refreshActiveWorld(); updatePalette(); save(); };
    body.appendChild(makeField('Last name', ent.lastName, false, v => { ent.lastName = v; nameChanged(); }));
    body.appendChild(makeField('First name', ent.firstName, false, v => { ent.firstName = v; nameChanged(); }));
    body.appendChild(makeToggleField('Title', ent.jobTitle, false, v => { ent.jobTitle = v; refreshActiveWorld(); save(); }, ent, 'showJobTitle'));
    body.appendChild(makeToggleField('Rank', ent.rank, false, v => { ent.rank = v; refreshActiveWorld(); save(); }, ent, 'showRank'));
    body.appendChild(makeSwatches(PERSON_PALETTE, ent.color, col => { ent.color = col; refreshActiveWorld(); updatePalette(); save(); renderSidebar(); }));
    body.appendChild(groupField(ent));
    body.appendChild(makeToggleField('Notes', ent.description, true, v => { ent.description = v; refreshActiveWorld(); save(); }, ent, 'showDescription'));
    body.appendChild(linkSection('Assigned tasks', tasksForPerson(ent.id), 'task',
      tid => { const t = tasks.get(tid); if (t) t.assigneeIds = t.assigneeIds.filter(x => x !== ent.id); afterLinkChange(); },
      [...tasks.values()].filter(t => !t.assigneeIds.includes(ent.id)),
      tid => { const t = tasks.get(tid); if (t) t.assigneeIds.push(ent.id); afterLinkChange(); }));
    footer.style.display = 'flex';
    return;
  }

  body.appendChild(makeField('Title', ent.title, false, v => { ent.title = v; refreshActiveWorld(); updatePalette(); save(); }));
  const palette = type === 'task' ? TASK_PALETTE : (type === 'project' || type === 'group') ? PROJECT_PALETTE : ACH_PALETTE;
  body.appendChild(makeSwatches(palette, ent.color, col => { ent.color = col; refreshActiveWorld(); updatePalette(); save(); renderSidebar(); }));
  if (type !== 'project' && type !== 'group') body.appendChild(makeToggleField('Description', ent.description, true, v => { ent.description = v; refreshActiveWorld(); save(); }, ent, 'showDescription'));

  if (type === 'task') {
    body.appendChild(projectField(ent));
    body.appendChild(linkSection('Assigned people', peopleForTask(ent), 'person',
      pid => { ent.assigneeIds = ent.assigneeIds.filter(x => x !== pid); afterLinkChange(); },
      [...people.values()].filter(p => !ent.assigneeIds.includes(p.id)),
      pid => { ent.assigneeIds.push(pid); afterLinkChange(); }));
  } else if (type === 'project') {
    body.appendChild(linkSection('Tasks in project', tasksForProject(ent.id), 'task',
      tid => { const t = tasks.get(tid); if (t) t.projectId = null; afterLinkChange(); },
      [...tasks.values()].filter(t => t.projectId !== ent.id),
      tid => { const t = tasks.get(tid); if (t) t.projectId = ent.id; afterLinkChange(); }));
  } else if (type === 'group') {
    body.appendChild(linkSection('People in group', peopleInGroup(ent.id), 'person',
      pid => { const p = people.get(pid); if (p) p.groupId = null; afterLinkChange(); },
      [...people.values()].filter(p => p.groupId !== ent.id),
      pid => { const p = people.get(pid); if (p) p.groupId = ent.id; afterLinkChange(); }));
  }

  footer.style.display = 'flex';
}

function afterLinkChange() {
  refreshActiveWorld(); updatePalette(); renderSidebar(); save(); scheduleHistorySnapshot(true);
}

// Dropdown on a task to set its project (or create a new one).
function projectField(task) {

function linkSection(label, linkedEntities, linkKind, onRemove, addable, onAdd) {
  const f = document.createElement('div'); f.className = 'field';

  const row = document.createElement('div'); row.className = 'link-row';
  if (linkedEntities.length === 0) {

    m.textContent = 'None yet.'; row.appendChild(m);
  }
  for (const e of linkedEntities) {

    chip.innerHTML = `<span class="dot" style="background:${accent}"></span><span></span><span class="x">×</span>`;
    chip.querySelector('span:nth-child(2)').textContent = labelOf(linkKind, e);
    chip.querySelector('.x').addEventListener('click', () => onRemove(e.id));

    [...sel.options].forEach((opt, i) => { if (i > 0) opt.textContent = labelOf(linkKind, addable[i - 1]); });
    sel.addEventListener('change', () => { if (sel.value) onAdd(sel.value); });
    f.appendChild(sel);

// ============================================================
// Picking / dragging
// ============================================================
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
const dragPlane = new THREE.Plane();
const dragPoint = new THREE.Vector3();
const dragOffset = new THREE.Vector3();
const tmpVec = new THREE.Vector3();

let downPos = null, moved = false;
let pendingAssign = null;     // {payload} from a 3D mini box, not yet started
let pendingSelect = null;     // {kind,id} to select on click (no move)
let pendingMove = null;       // a big card OR container box that may be dragged
let moveOp = null;            // active reposition drag (type:'card'|'container')
let assignDrag = null;        // active drag: {payload, ghost}

function setPointer(ev) {
  const rect = renderer.domElement.getBoundingClientRect();
  pointer.x = ((ev.clientX - rect.left) / rect.width) * 2 - 1;
  pointer.y = -((ev.clientY - rect.top) / rect.height) * 2 + 1;
}
// Cards/labels are Groups (front + mirrored back), so raycast recursively and climb
// to the ancestor that carries userData.
function resolveBoardObj(obj) {
  while (obj && !(obj.userData && (obj.userData.kind || obj.userData.groupKey))) obj = obj.parent;
  return obj || null;
}
function pickHit(ev) {
  setPointer(ev);
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(boardPickables, true);
  for (const h of hits) {
    const o = resolveBoardObj(h.object);
    if (o) return { object: o, point: h.point };
  }
  return null;
}
function pickAt(ev) { const h = pickHit(ev); return h ? h.object.userData : null; }
function pickBigCardAt(ev) {
  setPointer(ev);
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(boardPickables, true);
  for (const hit of hits) {
    const o = resolveBoardObj(hit.object);
    if (o && (o.userData.kind === 'person' || o.userData.kind === 'task')) return o.userData;
  }
  return null;
}
// First container (project/group) under the cursor, seen through cards in front.
function pickContainerAt(ev) {
  setPointer(ev);
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(boardPickables, true);
  for (const hit of hits) {
    const o = resolveBoardObj(hit.object);
    if (o && (o.userData.kind === 'project' || o.userData.kind === 'group')) return o.userData;
  }
  return null;
}

renderer.domElement.addEventListener('pointerdown', (ev) => {
  if (ev.button !== 0) return;
  downPos = { x: ev.clientX, y: ev.clientY }; moved = false;
  pendingAssign = null; pendingSelect = null; pendingMove = null;
  const hit = pickHit(ev);
  const ud = hit ? hit.object.userData : null;
  if (ud && ud.kind === 'assign') {
    pendingAssign = { payload: { kind: ud.miniKind, id: ud.id, origin: { taskId: ud.taskId, personId: ud.personId } } };
    pendingSelect = { kind: ud.miniKind, id: ud.id };
    controls.enabled = false; // suppress orbit until we know it's a click vs drag
  } else if (ud && (ud.kind === 'person' || ud.kind === 'task' || ud.kind === 'achievement')) {
    // a big card: select on click, reposition on drag
    pendingSelect = { kind: ud.kind, id: ud.id };
    pendingMove = { type: 'card', kind: ud.kind, id: ud.id, mesh: hit.object };
    controls.enabled = false;
    // cards move on the ground plane (X/Z) at a fixed altitude
    dragPlane.setFromNormalAndCoplanarPoint(new THREE.Vector3(0, 1, 0), new THREE.Vector3(0, 0, 0));
    if (raycaster.ray.intersectPlane(dragPlane, dragPoint)) dragOffset.set(hit.object.position.x - dragPoint.x, 0, hit.object.position.z - dragPoint.z);
    else dragOffset.set(0, 0, 0);
  } else if (ud && (ud.kind === 'project' || ud.kind === 'group')) {
    // a container box: select on click, move the whole group on drag
    pendingSelect = { kind: ud.kind, id: ud.id };
    pendingMove = { type: 'container', kind: ud.kind, id: ud.id, groupKey: ud.id };
    controls.enabled = false;
    // boxes move along the GROUND plane (X across, Z in depth) — altitude stays fixed
    dragPlane.setFromNormalAndCoplanarPoint(new THREE.Vector3(0, 1, 0), new THREE.Vector3(0, 0, 0));
    pendingMove.start = raycaster.ray.intersectPlane(dragPlane, dragPoint) ? { x: dragPoint.x, z: dragPoint.z } : { x: 0, z: 0 };
  } else {
    pendingSelect = null;
  }
});

window.addEventListener('pointermove', (ev) => {
  if (downPos) {
    const dx = ev.clientX - downPos.x, dy = ev.clientY - downPos.y;
    if (dx * dx + dy * dy > 16) moved = true;
  }
  if (pendingMove && moved && !moveOp && !assignDrag) {
    moveOp = pendingMove;
    if (moveOp.type === 'container') {
      moveOp.items = boardObjects.filter(o => o.userData && o.userData.groupKey === moveOp.groupKey).map(o => ({ o, ox: o.position.x, oz: o.position.z }));
      moveOp.dx = 0; moveOp.dz = 0;
    }
  }
  if (moveOp) {
    setPointer(ev); raycaster.setFromCamera(pointer, camera);
    if (raycaster.ray.intersectPlane(dragPlane, dragPoint)) {
      if (moveOp.type === 'card') {
        moveOp._nx = snap(dragPoint.x + dragOffset.x);
        moveOp._nz = snap(dragPoint.z + dragOffset.z);
        moveOp.mesh.position.x = moveOp._nx;
        moveOp.mesh.position.z = moveOp._nz;
      } else {
        // ground move: shift X and Z only — Y (altitude) is never touched
        moveOp.dx = snap(dragPoint.x - moveOp.start.x);
        moveOp.dz = snap(dragPoint.z - moveOp.start.z);
        for (const it of moveOp.items) { it.o.position.x = it.ox + moveOp.dx; it.o.position.z = it.oz + moveOp.dz; }
      }
    }
    return;
  }
  if (pendingAssign && moved && !assignDrag) startAssignDrag(pendingAssign.payload, ev);
  if (assignDrag) positionGhost(ev);
});

window.addEventListener('pointerup', (ev) => {
  if (moveOp && moveOp.type === 'card') {
    const ent = entityFor({ type: moveOp.kind, id: moveOp.id });
    if (ent) {
      let reassigned = false;
      // dropping onto another container box reassigns (move between groups/projects)
      if (currentWorld === 'tasks' && groupTasks && moveOp.kind === 'task') {
        const c = pickContainerAt(ev);
        if (c && c.kind === 'project' && ent.projectId !== c.id) { ent.projectId = c.id; ent.pos = null; reassigned = true; }
      } else if (currentWorld === 'people' && groupPeople && moveOp.kind === 'person') {
        const c = pickContainerAt(ev);
        if (c && c.kind === 'group' && ent.groupId !== c.id) { ent.groupId = c.id; ent.pos = null; reassigned = true; }
      }
      if (!reassigned && moveOp._nx !== undefined) ent.pos = { x: moveOp._nx, z: moveOp._nz };
    }
    refreshActiveWorld(); save(); scheduleHistorySnapshot(true);
  } else if (moveOp && moveOp.type === 'container') {
    // the whole group slides on the ground (X/Z); each member keeps its altitude
    for (const it of moveOp.items) {
      const ud = it.o.userData;
      if (ud && (ud.kind === 'person' || ud.kind === 'task' || ud.kind === 'achievement')) {
        const ent = entityFor({ type: ud.kind, id: ud.id });
        if (ent) ent.pos = { x: it.o.position.x, z: it.o.position.z };
      }
    }
    refreshActiveWorld(); save(); scheduleHistorySnapshot(true);
  } else if (assignDrag) {
    finishAssignDrag(ev);
  } else if (!moved && downPos) {
    if (pendingSelect) select(pendingSelect.kind, pendingSelect.id);
    else if (overCanvas(ev)) select(null);
  }
  controls.enabled = true;
  downPos = null; pendingAssign = null; pendingSelect = null; pendingMove = null; moveOp = null; moved = false;
});

function overCanvas(ev) {
  const r = renderer.domElement.getBoundingClientRect();
  return ev.clientX >= r.left && ev.clientX <= r.right && ev.clientY >= r.top && ev.clientY <= r.bottom;
}
function overPalette(ev) {
  if (currentWorld === 'achievements') return false;
  const r = document.getElementById('palette').getBoundingClientRect();
  return ev.clientX >= r.left && ev.clientX <= r.right && ev.clientY >= r.top && ev.clientY <= r.bottom;
}

function startAssignDrag(payload, ev) {
  controls.enabled = false;
  const ghost = document.createElement('div');
  ghost.className = 'drag-ghost ' + payload.kind;
  const ent = payload.kind === 'person' ? people.get(payload.id) : tasks.get(payload.id);
  const accent = payload.kind === 'person' ? (ent?.color || PERSON_PALETTE[0]) : (ent?.color || TASK_PALETTE[0]);
  ghost.innerHTML = `<span class="dot" style="background:${accent}"></span><span></span>`;
  ghost.querySelector('span:nth-child(2)').textContent = ent ? labelOf(payload.kind, ent) : 'Untitled';
  document.body.appendChild(ghost);
  assignDrag = { payload, ghost };
  positionGhost(ev);
}
function positionGhost(ev) {
  if (!assignDrag) return;
  assignDrag.ghost.style.left = (ev.clientX + 12) + 'px';
  assignDrag.ghost.style.top = (ev.clientY + 12) + 'px';
  document.getElementById('palette').classList.toggle('drop-target', overPalette(ev));
}
function finishAssignDrag(ev) {
  const payload = assignDrag.payload;
  assignDrag.ghost.remove();
  document.getElementById('palette').classList.remove('drop-target');
  assignDrag = null;
  controls.enabled = true;

  if (overPalette(ev)) { dropOnPalette(payload); return; }
  if (overCanvas(ev)) {
    const target = pickBigCardAt(ev);
    if (target) dropOnCard(payload, target);
  }
}
// Drop a dragged item onto a big card → ADD an assignment (many-to-many).
function dropOnCard(payload, target) {
  if (currentWorld === 'people') {
    // dragging a TASK onto a PERSON card
    if (payload.kind !== 'task' || target.kind !== 'person') return;
    const t = tasks.get(payload.id); if (!t) return;
    if (!t.assigneeIds.includes(target.id)) t.assigneeIds.push(target.id);
  } else {
    // dragging a PERSON onto a TASK card
    if (payload.kind !== 'person' || target.kind !== 'task') return;
    const t = tasks.get(target.id); if (!t) return;
