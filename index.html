// ============================================================
// Persistence (localStorage + backups)
// ============================================================
const STORAGE_KEY = 'obelisk.v5';
const BACKUP_KEYS = [STORAGE_KEY + '.bak.1', STORAGE_KEY + '.bak.2', STORAGE_KEY + '.bak.3'];
const BACKUP_MIN_INTERVAL_MS = 10000;
let saveTimer = null;
let lastBackupAt = 0;
let isApplyingHistory = false;

function buildStateData() {
  return {
    savedAt: new Date().toISOString(),
    currentWorld, groupTasks, groupPeople,
    people: [...people.values()].map(p => ({ id: p.id, firstName: p.firstName, lastName: p.lastName, jobTitle: p.jobTitle, rank: p.rank, description: p.description, color: p.color, showJobTitle: p.showJobTitle, showRank: p.showRank, showDescription: p.showDescription, groupId: p.groupId || null, pos: p.pos || null })),
    tasks: [...tasks.values()].map(t => ({ id: t.id, title: t.title, description: t.description, color: t.color, assigneeIds: t.assigneeIds, projectId: t.projectId || null, showDescription: t.showDescription, pos: t.pos || null })),
    projects: [...projects.values()].map(p => ({ id: p.id, title: p.title, color: p.color, zOffset: p.zOffset || 0 })),
    peopleGroups: [...peopleGroups.values()].map(g => ({ id: g.id, title: g.title, color: g.color, zOffset: g.zOffset || 0 })),
    achievements: [...achievements.values()].map(a => ({ id: a.id, title: a.title, description: a.description, color: a.color, showDescription: a.showDescription, pos: a.pos || null })),
  };
}

function rotateBackups() {
  const now = Date.now();
  if (now - lastBackupAt < BACKUP_MIN_INTERVAL_MS) return;
  const current = localStorage.getItem(STORAGE_KEY);
  if (!current) return;
  try {
    const b1 = localStorage.getItem(BACKUP_KEYS[0]);
    const b2 = localStorage.getItem(BACKUP_KEYS[1]);
    if (b2) localStorage.setItem(BACKUP_KEYS[2], b2);
    if (b1) localStorage.setItem(BACKUP_KEYS[1], b1);
    localStorage.setItem(BACKUP_KEYS[0], current);
    lastBackupAt = now;
  } catch (e) {}
}

function save() {
  clearTimeout(saveTimer);
  const skipMaintenance = isApplyingHistory;
  saveTimer = setTimeout(() => {
    if (!skipMaintenance) rotateBackups();
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(buildStateData())); } catch (e) {}
    if (!skipMaintenance) scheduleHistorySnapshot();
  }, 200);
  if (typeof scheduleAutosave === 'function') scheduleAutosave();
}

function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return false;
    const data = JSON.parse(raw);
    const empty = (data.people || []).length === 0 && (data.tasks || []).length === 0 && (data.achievements || []).length === 0 && (data.projects || []).length === 0 && (data.peopleGroups || []).length === 0;
    if (empty) return false;
    applyStateData(data);
    return true;
  } catch (e) { return false; }
}

function clearAll() {
  disposeBoard();
  people.clear(); tasks.clear(); achievements.clear(); projects.clear(); peopleGroups.clear();
  selection = null;
}

function applyStateData(data) {
  clearAll();
  for (const g of (data.peopleGroups || [])) {
    if (!g || !g.id) continue;
    peopleGroups.set(g.id, { id: g.id, title: g.title || '', color: g.color || pick(PROJECT_PALETTE), zOffset: typeof g.zOffset === 'number' ? g.zOffset : 0 });
  }
  for (const p of (data.people || [])) {
    if (!p || !p.id) continue;
    let firstName = p.firstName || '', lastName = p.lastName || '';
    if (!firstName && !lastName && p.title) { const parts = p.title.trim().split(/\s+/); firstName = parts.shift() || ''; lastName = parts.join(' '); }
    const groupId = (p.groupId && peopleGroups.has(p.groupId)) ? p.groupId : null;
    people.set(p.id, {
      id: p.id, firstName, lastName, jobTitle: p.jobTitle || '', rank: p.rank || '',
      description: p.description || '', color: p.color || pick(PERSON_PALETTE),
      showJobTitle: p.showJobTitle !== false, showRank: p.showRank !== false, showDescription: !!p.showDescription,
      groupId, pos: validPos(p.pos),
    });
  }
  for (const pr of (data.projects || [])) {
    if (!pr || !pr.id) continue;
    projects.set(pr.id, { id: pr.id, title: pr.title || '', color: pr.color || pick(PROJECT_PALETTE), zOffset: typeof pr.zOffset === 'number' ? pr.zOffset : 0 });
  }
  for (const t of (data.tasks || [])) {
    if (!t || !t.id) continue;
    const assigneeIds = (t.assigneeIds || []).filter(id => people.has(id));
    const projectId = (t.projectId && projects.has(t.projectId)) ? t.projectId : null;
    tasks.set(t.id, { id: t.id, title: t.title || '', description: t.description || '', color: t.color || pick(TASK_PALETTE), assigneeIds, projectId, showDescription: !!t.showDescription, pos: validPos(t.pos) });
  }
  for (const a of (data.achievements || [])) {
    if (!a || !a.id) continue;
    achievements.set(a.id, { id: a.id, title: a.title || '', description: a.description || '', color: a.color || pick(ACH_PALETTE), showDescription: !!a.showDescription, pos: validPos(a.pos) });
  }
  if (WORLDS.includes(data.currentWorld)) currentWorld = data.currentWorld;
  groupTasks = !!data.groupTasks;
  groupPeople = !!data.groupPeople;
  applyTheme();
  updateWorldUI();
  refreshActiveWorld();
  updatePalette();
  renderSidebar();
}

// ============================================================
// Undo / redo
// ============================================================
const history = [];
let historyIndex = -1;
const HISTORY_MAX = 60;
const HISTORY_DEBOUNCE_MS = 800;
let historyTimer = null;

function pushHistorySnapshot() {
  if (isApplyingHistory) return;
  const snap = JSON.stringify(buildStateData());
  if (history.length > 0 && history[historyIndex] === snap) return;
  history.length = historyIndex + 1;
  history.push(snap);
  if (history.length > HISTORY_MAX) history.shift();
  else historyIndex++;
  updateUndoRedoUI();
}
function scheduleHistorySnapshot(immediate = false) {
  if (isApplyingHistory) return;
  clearTimeout(historyTimer);
  if (immediate) pushHistorySnapshot();
  else historyTimer = setTimeout(pushHistorySnapshot, HISTORY_DEBOUNCE_MS);
}
function undo() { if (historyIndex <= 0) return; clearTimeout(historyTimer); historyIndex--; applyHistoryAt(historyIndex); }
function redo() { if (historyIndex >= history.length - 1) return; clearTimeout(historyTimer); historyIndex++; applyHistoryAt(historyIndex); }
function applyHistoryAt(idx) {
  isApplyingHistory = true;
  try {
    applyStateData(JSON.parse(history[idx]));
    try { localStorage.setItem(STORAGE_KEY, history[idx]); } catch (e) {}
    if (typeof scheduleAutosave === 'function') scheduleAutosave();
  } finally { isApplyingHistory = false; updateUndoRedoUI(); }
}
function updateUndoRedoUI() {
  const u = document.getElementById('undo-btn'), r = document.getElementById('redo-btn');
  if (u) u.disabled = historyIndex <= 0;
  if (r) r.disabled = historyIndex >= history.length - 1;
}
document.getElementById('undo-btn').addEventListener('click', undo);
document.getElementById('redo-btn').addEventListener('click', redo);

// ============================================================
// Restore from .bak.N
// ============================================================
function fmtAgo(date) {
  const sec = Math.max(0, Math.floor((Date.now() - date.getTime()) / 1000));
  if (sec < 60) return `${sec}s ago`;
  const min = Math.floor(sec / 60); if (min < 60) return `${min}m ago`;
  const hr = Math.floor(min / 60); if (hr < 24) return `${hr}h ago`;
  return `${Math.floor(hr / 24)}d ago`;
}
function getBackupInfo(n) {
  const raw = localStorage.getItem(BACKUP_KEYS[n - 1]);
  if (!raw) return null;
  try {
    const d = JSON.parse(raw);
    const count = (d.people?.length || 0) + (d.tasks?.length || 0) + (d.achievements?.length || 0) + (d.projects?.length || 0) + (d.peopleGroups?.length || 0);
    return { n, ts: d.savedAt, count, raw };
  } catch (e) { return null; }
}
function showRestoreMenu() {
  const menu = document.getElementById('restore-menu');
  menu.innerHTML = '';
  const items = [1, 2, 3].map(getBackupInfo).filter(Boolean);
  if (items.length === 0) {
    const empty = document.createElement('div'); empty.className = 'empty';
    empty.textContent = 'No backups yet. The previous saved state will appear here.';
    menu.appendChild(empty);
  } else {
    for (const it of items) {
      const row = document.createElement('div'); row.className = 'item';
      const ago = it.ts ? fmtAgo(new Date(it.ts)) : 'unknown';
      const tsStr = it.ts ? new Date(it.ts).toLocaleString() : '';
      row.innerHTML = `<span>.bak.${it.n} <span class="meta">${ago}</span></span><span class="meta">${it.count} items</span>`;
      row.title = `Saved ${tsStr} — click to restore`;
      row.addEventListener('click', () => {
        if (confirm(`Restore from .bak.${it.n}? Your current state will be saved as a fresh backup first.`)) { restoreFromBackup(it.n); menu.style.display = 'none'; }
      });
      menu.appendChild(row);
    }
  }
  const btn = document.getElementById('restore-btn'); const rect = btn.getBoundingClientRect();
  menu.style.left = rect.left + 'px'; menu.style.top = (rect.bottom + 4) + 'px'; menu.style.display = 'flex';
}
function restoreFromBackup(n) {
  const info = getBackupInfo(n);
  if (!info) { alert('Backup not found.'); return; }
  lastBackupAt = 0; rotateBackups();
  try { applyStateData(JSON.parse(info.raw)); save(); scheduleHistorySnapshot(true); }
  catch (e) { alert('Backup is corrupted: ' + e.message); }
}
document.getElementById('restore-btn').addEventListener('click', (ev) => {
  ev.stopPropagation();
  const menu = document.getElementById('restore-menu');
  if (menu.style.display === 'flex') { menu.style.display = 'none'; return; }
  showRestoreMenu();
});
document.addEventListener('click', (ev) => {
  const menu = document.getElementById('restore-menu');
  if (menu.style.display === 'flex' && !menu.contains(ev.target) && ev.target.id !== 'restore-btn') menu.style.display = 'none';
});

// ============================================================
// JSON import / export
// ============================================================
function serializeState() { return { version: 11, exportedAt: new Date().toISOString(), ...buildStateData() }; }
function exportJSON() {
  const blob = new Blob([JSON.stringify(serializeState(), null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `obelisk-${new Date().toISOString().slice(0, 10)}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 0);
}
async function importJSON(file) {
  let text; try { text = await file.text(); } catch (e) { alert('Could not read file: ' + e.message); return; }
  let data; try { data = JSON.parse(text); } catch (e) { alert('File is not valid JSON: ' + e.message); return; }
  if (!data || (!Array.isArray(data.people) && !Array.isArray(data.tasks) && !Array.isArray(data.achievements))) {
    alert('JSON is missing "people", "tasks", and "achievements" arrays.'); return;
  }
  const incoming = (data.people?.length || 0) + (data.tasks?.length || 0) + (data.achievements?.length || 0);
  const existing = people.size + tasks.size + achievements.size;
  if (existing > 0 && !confirm(`Replace current state (${existing} item${existing !== 1 ? 's' : ''}) with ${incoming} from the file?`)) return;
  applyStateData(data); save(); scheduleHistorySnapshot(true); fitCamera();
}
document.getElementById('save-json-btn').addEventListener('click', exportJSON);
document.getElementById('load-json-btn').addEventListener('click', () => document.getElementById('load-json-input').click());
document.getElementById('load-json-input').addEventListener('change', (ev) => { const f = ev.target.files?.[0]; if (f) importJSON(f); ev.target.value = ''; });

// ============================================================
// Auto-save to a user-picked JSON file (File System Access API)
// ============================================================
const AUTOSAVE_DEBOUNCE_MS = 600;
const AUTOSAVE_DB = 'obelisk-fs';
const AUTOSAVE_KEY = 'autosaveHandle';
let autosaveHandle = null, autosaveTimer = null, autosaveInFlight = false, autosavePending = false;
let autosaveState = 'off', autosaveLastAt = null, autosaveError = null;
const autosaveBtn = document.getElementById('autosave-btn');
const autosaveSupported = typeof window.showSaveFilePicker === 'function';

function openHandleDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(AUTOSAVE_DB, 1);
    req.onupgradeneeded = () => req.result.createObjectStore('handles');
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function storeHandle(handle) {
  try { const db = await openHandleDB(); await new Promise((res, rej) => { const tx = db.transaction('handles', 'readwrite'); tx.objectStore('handles').put(handle, AUTOSAVE_KEY); tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); }); } catch (e) {}
}
async function loadStoredHandle() {
  try { const db = await openHandleDB(); return await new Promise((res) => { const tx = db.transaction('handles', 'readonly'); const req = tx.objectStore('handles').get(AUTOSAVE_KEY); req.onsuccess = () => res(req.result || null); req.onerror = () => res(null); }); } catch (e) { return null; }
}
async function clearStoredHandle() {
  try { const db = await openHandleDB(); await new Promise((res) => { const tx = db.transaction('handles', 'readwrite'); tx.objectStore('handles').delete(AUTOSAVE_KEY); tx.oncomplete = () => res(); tx.onerror = () => res(); }); } catch (e) {}
}
function fmtRelative(date) {
  if (!date) return '';
  const sec = Math.max(0, Math.floor((Date.now() - date.getTime()) / 1000));
  if (sec < 5) return 'just now'; if (sec < 60) return `${sec}s ago`;
  const min = Math.floor(sec / 60); if (min < 60) return `${min}m ago`;
  return `${Math.floor(min / 60)}h ago`;
}
function updateAutosaveUI() {
  if (!autosaveBtn) return;
  autosaveBtn.classList.remove('active', 'paused', 'error');
  if (!autosaveSupported) { autosaveBtn.textContent = 'Auto-save (unsupported)'; autosaveBtn.title = 'Your browser does not support the File System Access API. Use Chrome/Edge.'; autosaveBtn.disabled = true; return; }
  const name = autosaveHandle ? (autosaveHandle.name || 'file.json') : null;
  if (autosaveState === 'active') { autosaveBtn.classList.add('active'); autosaveBtn.textContent = `● Auto-save: ${name}`; autosaveBtn.title = `Auto-saving to ${name}` + (autosaveLastAt ? ` — last saved ${fmtRelative(autosaveLastAt)}` : '') + '. Click to stop.'; }
  else if (autosaveState === 'paused') { autosaveBtn.classList.add('paused'); autosaveBtn.textContent = `Resume auto-save: ${name}`; autosaveBtn.title = `Auto-save was paused. Click to resume writing to ${name}.`; }
  else if (autosaveState === 'error') { autosaveBtn.classList.add('error'); autosaveBtn.textContent = `Auto-save error: ${name || ''}`; autosaveBtn.title = `Last write failed: ${autosaveError || 'unknown'}.`; }
  else { autosaveBtn.textContent = 'Auto-save'; autosaveBtn.title = 'Pick a JSON file on disk and keep it in sync automatically.'; }
}
setInterval(() => { if (autosaveState === 'active' && autosaveLastAt) updateAutosaveUI(); }, 10000);
async function ensurePermission(handle, mode = 'readwrite') {
  try { const opts = { mode }; const q = await handle.queryPermission(opts); if (q === 'granted') return true; return (await handle.requestPermission(opts)) === 'granted'; } catch (e) { return false; }
}
async function writeAutosaveNow() {
  if (!autosaveHandle) return;
  if (autosaveInFlight) { autosavePending = true; return; }
  autosaveInFlight = true;
  try {
    if (!(await ensurePermission(autosaveHandle).catch(() => false))) { autosaveState = 'paused'; updateAutosaveUI(); return; }
    const writable = await autosaveHandle.createWritable();
    await writable.write(JSON.stringify(serializeState(), null, 2));
    await writable.close();
    autosaveLastAt = new Date(); autosaveError = null; autosaveState = 'active'; updateAutosaveUI();
  } catch (e) { autosaveError = e?.message || String(e); autosaveState = 'error'; updateAutosaveUI(); }
  finally { autosaveInFlight = false; if (autosavePending) { autosavePending = false; writeAutosaveNow(); } }
}
function scheduleAutosave() { if (!autosaveHandle || autosaveState === 'paused') return; clearTimeout(autosaveTimer); autosaveTimer = setTimeout(writeAutosaveNow, AUTOSAVE_DEBOUNCE_MS); }
async function startAutosave() {
  if (!autosaveSupported) return;
  try {
    const handle = await window.showSaveFilePicker({ suggestedName: `obelisk-${new Date().toISOString().slice(0, 10)}.json`, types: [{ description: 'Obelisk JSON', accept: { 'application/json': ['.json'] } }] });
    autosaveHandle = handle; autosaveState = 'active'; autosaveError = null; await storeHandle(handle); await writeAutosaveNow();
  } catch (e) { if (e?.name !== 'AbortError') { autosaveError = e?.message || String(e); autosaveState = 'error'; updateAutosaveUI(); } }
}
async function stopAutosave() { clearTimeout(autosaveTimer); autosaveHandle = null; autosaveState = 'off'; autosaveError = null; autosaveLastAt = null; await clearStoredHandle(); updateAutosaveUI(); }
async function resumeAutosave() { if (!autosaveHandle) return; if (!(await ensurePermission(autosaveHandle).catch(() => false))) { autosaveState = 'paused'; updateAutosaveUI(); return; } autosaveState = 'active'; await writeAutosaveNow(); }
async function restoreAutosaveOnLoad() {
  if (!autosaveSupported) { updateAutosaveUI(); return; }
  const stored = await loadStoredHandle();
  if (!stored) { updateAutosaveUI(); return; }
  autosaveHandle = stored;
  try { autosaveState = (await stored.queryPermission({ mode: 'readwrite' })) === 'granted' ? 'active' : 'paused'; } catch (e) { autosaveState = 'paused'; }
  updateAutosaveUI();
  if (autosaveState === 'active') writeAutosaveNow();
}
if (autosaveBtn) {
  autosaveBtn.addEventListener('click', async () => {
    if (!autosaveSupported) return;
    if (autosaveState === 'off') return startAutosave();
    if (autosaveState === 'paused') return resumeAutosave();
    if (autosaveState === 'error') { if (autosaveHandle) return writeAutosaveNow(); return startAutosave(); }
    if (confirm(`Stop auto-saving to ${autosaveHandle?.name || 'this file'}?`)) stopAutosave();
  });
}

  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
