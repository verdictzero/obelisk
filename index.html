  region.wallMat.dispose();
  disposeRegionFrame(region);
  region.label.geometry.dispose();
  region.labelMat.dispose();
  region.labelTexture.dispose();
  regions.delete(id);
  if (isSelected('region', id)) select(null);
  save();
}

function translateRegion(region, delta) {
  region.group.position.add(delta);
  region.position = [region.group.position.x, 0, region.group.position.z];
  for (const b of buckets.values()) {
    if (b.regionId === region.id && !b.parentId) translateBucketTree(b, delta);
  }
  for (const c of cards.values()) {
    if (c.regionId === region.id && !c.bucketId) {
      c.mesh.position.add(delta);
      c.position = c.mesh.position.toArray();
      for (const t of things.values()) {
        if (t.cardId === c.id) {
          t.mesh.position.add(delta);
          t.position = t.mesh.position.toArray();
        }
      }
    }
  }
}

// ============================================================
// Things (mini-card entities — people, systems, objects)
// ============================================================
const THING_W = 1.9;
const THING_H = 0.8;
const THING_ORBIT_R = 3.0; // distance from card center to its orbiting things
const THING_TYPES = {
  person: { label: 'Person', color: '#4f8cff', shape: 'circle' },
  system: { label: 'System', color: '#f7b955', shape: 'square' },
  object: { label: 'Object', color: '#7ad9a8', shape: 'hexagon' },
};
const things = new Map(); // id -> { id, title, description, type, position, cardId, mesh, canvas, texture }
let hoveredCardId = null;  // card under cursor during a thing drag

function makeThingCanvas() {
  const c = document.createElement('canvas');
  c.width = 384; c.height = 160;
  return c;
}

function drawThingShape(ctx, x, y, size, shape) {
  ctx.beginPath();
  if (shape === 'circle') {
    ctx.arc(x, y, size, 0, Math.PI * 2);
  } else if (shape === 'square') {
    ctx.rect(x - size, y - size, size * 2, size * 2);
  } else { // hexagon
    for (let i = 0; i < 6; i++) {
      const a = Math.PI / 3 * i - Math.PI / 2;
      const px = x + Math.cos(a) * size;
      const py = y + Math.sin(a) * size;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath();
  }
  ctx.fill();
}

function drawThing(thing, { selected = isSelected('thing', thing.id) } = {}) {
  const ctx = thing.canvas.getContext('2d');
  const w = thing.canvas.width, h = thing.canvas.height;
  ctx.clearRect(0, 0, w, h);
  const wt = getThemeFor(thing.world || 'main');
  const types = wt.thingTypes;
  const type = types[thing.type] || types.person;
  const cardT = wt.card;

  ctx.fillStyle = selected ? cardT.bgSelected : cardT.bg;
  roundRect(ctx, 4, 4, w - 8, h - 8, 16);
  ctx.fill();

  ctx.lineWidth = selected ? 5 : 3;
  ctx.strokeStyle = selected ? cardT.borderSelected : type.color;
  roundRect(ctx, 4, 4, w - 8, h - 8, 16);
  ctx.stroke();

  ctx.fillStyle = type.color;
  drawThingShape(ctx, 36, h / 2, 18, type.shape);

  ctx.fillStyle = cardT.text;
  ctx.font = '600 32px -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif';
  ctx.textBaseline = 'middle';
  let text = thing.title || 'Untitled';
  let suffix = '';
  while (ctx.measureText(text + suffix).width > w - 90 && text.length > 0) {
    text = text.slice(0, -1);
    suffix = '…';
  }
  ctx.fillText(text + suffix, 72, h / 2 + 2);

  thing.texture.needsUpdate = true;
}

function createThingMesh(thing) {
  const canvas = makeThingCanvas();
  const texture = new THREE.CanvasTexture(canvas);
  texture.colorSpace = THREE.SRGBColorSpace;
  texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
  const mat = new THREE.MeshBasicMaterial({ map: texture, transparent: true, side: THREE.DoubleSide });
  const geo = new THREE.PlaneGeometry(THING_W, THING_H);
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.fromArray(thing.position);
  mesh.userData.thingId = thing.id;
  thing.canvas = canvas;
  thing.texture = texture;
  thing.mesh = mesh;
  drawThing(thing);
  return mesh;
}

function addThing({ title = 'New thing', description = '', type = 'person', position, cardId = null } = {}) {
  if (!THING_TYPES[type]) type = 'person';
  if (!position) {
    const forward = new THREE.Vector3();
    camera.getWorldDirection(forward);
    const p = new THREE.Vector3().copy(controls.target).add(forward.multiplyScalar(5));
    p.x += (Math.random() - 0.5) * 4;
    p.z += (Math.random() - 0.5) * 4;
    position = [p.x, CARD_ALTITUDE, p.z];
  } else {
    position = [position[0], CARD_ALTITUDE, position[2]];
  }
  if (cardId && !cards.has(cardId)) cardId = null;
  const id = crypto.randomUUID();
  const thing = { id, title, description, type, position, cardId, world: currentWorld };
  scene.add(createThingMesh(thing));
  things.set(id, thing);
  if (cardId && cards.has(cardId)) layoutThingsAroundCard(cards.get(cardId));
  select('thing', id);
  save();
  updatePalette();
  return thing;
}

function deleteThing(id) {
  const thing = things.get(id);
  if (!thing) return;
  const oldCardId = thing.cardId;
  scene.remove(thing.mesh);
  thing.mesh.geometry.dispose();
  thing.mesh.material.map?.dispose();
  thing.mesh.material.dispose();
  things.delete(id);
  if (oldCardId && cards.has(oldCardId)) layoutThingsAroundCard(cards.get(oldCardId));
  if (isSelected('thing', id)) select(null);
  save();
  updatePalette();
}

function thingsAttachedTo(cardId) {
  const out = [];
  for (const t of things.values()) if (t.cardId === cardId) out.push(t);
  return out;
}

function layoutThingsAroundCard(card) {
  const attached = thingsAttachedTo(card.id);
  const n = attached.length;
  if (n === 0) return;
  for (let i = 0; i < n; i++) {
    const angle = (i / n) * Math.PI * 2 - Math.PI / 2;
    const x = card.position[0] + Math.cos(angle) * THING_ORBIT_R;
    const z = card.position[2] + Math.sin(angle) * THING_ORBIT_R;
    attached[i].mesh.position.set(x, CARD_ALTITUDE, z);
    attached[i].position = [x, CARD_ALTITUDE, z];
  }
}

// ============================================================
// Badges (reusable labels you can stick on any card)
// ============================================================
const BADGE_PALETTE = ['#f85149', '#f7b955', '#7ad9a8', '#79b8ff', '#b794f4', '#5cd4f0', '#ff6b9d', '#8b949e'];
const BADGE_MAX_LABEL = 20;
const badges = new Map(); // id -> { id, label, color }

function createBadge({ label = 'Badge', color } = {}) {
  const palette = badgePaletteForWorld(currentWorld);
  if (!color) {
    const sameWorld = [...badges.values()].filter(b => b.world === currentWorld).length;
    color = palette[sameWorld % palette.length];
  }
  const id = crypto.randomUUID();
  const badge = { id, label: String(label).slice(0, BADGE_MAX_LABEL), color, world: currentWorld };
  badges.set(id, badge);
  save();
  return badge;
}

function updateBadge(id, patch) {
  const b = badges.get(id);
  if (!b) return;
  if (patch.label !== undefined) b.label = String(patch.label).slice(0, BADGE_MAX_LABEL);
  if (patch.color !== undefined) b.color = patch.color;
  for (const c of cards.values()) if (c.badgeIds && c.badgeIds.includes(id)) drawCard(c);
  save();
}

function deleteBadge(id) {
  if (!badges.has(id)) return;
  badges.delete(id);
  for (const c of cards.values()) {
    if (c.badgeIds && c.badgeIds.includes(id)) {
      c.badgeIds = c.badgeIds.filter(x => x !== id);
      drawCard(c);
    }
  }
  save();
}

function applyBadgeToCard(cardId, badgeId) {
  const card = cards.get(cardId);
  if (!card || !badges.has(badgeId)) return;
  if (!card.badgeIds) card.badgeIds = [];
  if (card.badgeIds.includes(badgeId)) return;
  card.badgeIds.push(badgeId);
  drawCard(card);
  save();
}

function removeBadgeFromCard(cardId, badgeId) {
  const card = cards.get(cardId);
  if (!card || !card.badgeIds) return;
  card.badgeIds = card.badgeIds.filter(x => x !== badgeId);
  drawCard(card);
  save();
}

function linkAccomplishmentToCard(cardId, accomplishmentCardId) {
  const card = cards.get(cardId);
  const acc = cards.get(accomplishmentCardId);
  if (!card || !acc) return;
  if (card.world !== 'main' || acc.world !== 'accomplishments') return;
  if (!card.accomplishmentIds) card.accomplishmentIds = [];
  if (card.accomplishmentIds.includes(accomplishmentCardId)) return;
  card.accomplishmentIds.push(accomplishmentCardId);
  drawCard(card);
  save();
}

function unlinkAccomplishmentFromCard(cardId, accomplishmentCardId) {
  const card = cards.get(cardId);
  if (!card || !card.accomplishmentIds) return;
  card.accomplishmentIds = card.accomplishmentIds.filter(x => x !== accomplishmentCardId);
  drawCard(card);
  save();
}

function jumpToAccomplishment(accId) {
  const acc = cards.get(accId);
  if (!acc) return;
  if (acc.world !== currentWorld) setWorld(acc.world);
  select('card', accId);
  // focus camera on it
  const target = acc.mesh.position.clone();
  controls.target.copy(target);
  const dir = new THREE.Vector3().subVectors(camera.position, target).normalize();
  camera.position.copy(target).add(dir.multiplyScalar(8));
}

// ============================================================
// Selection
// ============================================================
function select(type, id = null) {
  // clicking a single item (or clearing) drops any active box-selection
  if (typeof boxSelection !== 'undefined' && boxSelection.size > 0) {
    const stale = [...boxSelection];
    boxSelection.clear();
    for (const k of stale) {
      const i = k.indexOf(':');
      const t = k.slice(0, i), iid = k.slice(i + 1);
      if (t === 'card') { const c = cards.get(iid); if (c) drawCard(c); }
      else if (t === 'bucket') { const b = buckets.get(iid); if (b) applyBucketVisualState(b); }
      else if (t === 'region') { const r = regions.get(iid); if (r) applyRegionVisualState(r); }
      else if (t === 'thing') { const th = things.get(iid); if (th) drawThing(th); }
    }
  }
  const prev = selection;
  selection = (type && id) ? { type, id } : null;
  if (prev) {
    if (prev.type === 'card') {
      const c = cards.get(prev.id);
      if (c) drawCard(c);
    } else if (prev.type === 'bucket') {
      const b = buckets.get(prev.id);
      if (b) applyBucketVisualState(b);
    } else if (prev.type === 'region') {
      const r = regions.get(prev.id);
      if (r) applyRegionVisualState(r);
    } else if (prev.type === 'thing') {
      const t = things.get(prev.id);
      if (t) drawThing(t);
    }
  }
  if (selection) {
    if (selection.type === 'card') {
      const c = cards.get(selection.id);
      if (c) drawCard(c);
    } else if (selection.type === 'bucket') {
      const b = buckets.get(selection.id);
      if (b) applyBucketVisualState(b);
    } else if (selection.type === 'region') {
      const r = regions.get(selection.id);
      if (r) applyRegionVisualState(r);
    } else if (selection.type === 'thing') {
      const t = things.get(selection.id);
      if (t) drawThing(t);
    }
  }
  renderSidebar();
  updatePaletteSelection();
}

// ============================================================
// Billboarding (cards + bucket labels face camera)
// ============================================================
const tmpVec = new THREE.Vector3();
function billboardAll() {
  tmpVec.copy(camera.position);
  for (const card of cards.values()) card.mesh.lookAt(tmpVec);
  for (const bucket of buckets.values()) bucket.label.lookAt(tmpVec);
  for (const region of regions.values()) region.label.lookAt(tmpVec);
  for (const thing of things.values()) thing.mesh.lookAt(tmpVec);
}

// ============================================================
// Picking & dragging
// ============================================================
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
const dragPlane = new THREE.Plane();
const dragOffset = new THREE.Vector3();
const dragPoint = new THREE.Vector3();
let dragging = null; // { type:'card'|'bucket', obj }
let pointerDownPos = null;
let pointerMoved = false;

function setPointer(ev) {
  const rect = renderer.domElement.getBoundingClientRect();
  pointer.x = ((ev.clientX - rect.left) / rect.width) * 2 - 1;
  pointer.y = -((ev.clientY - rect.top) / rect.height) * 2 + 1;
}

function pickAny(ev) {
  setPointer(ev);
  raycaster.setFromCamera(pointer, camera);
  const targets = [];
  for (const c of cards.values()) if (c.world === currentWorld) targets.push(c.mesh);
  for (const b of buckets.values()) if (b.world === currentWorld) { targets.push(b.ring); targets.push(b.label); }
  for (const r of regions.values()) if (r.world === currentWorld) {
    targets.push(r.label);
    for (const fm of r.frameMeshes) targets.push(fm);
  }
  for (const t of things.values()) if (t.world === currentWorld) targets.push(t.mesh);
  const hits = raycaster.intersectObjects(targets, false);
  if (!hits.length) return null;
  const o = hits[0].object;
  if (o.userData.cardId) return { type: 'card', id: o.userData.cardId };
  if (o.userData.bucketId) return { type: 'bucket', id: o.userData.bucketId };
  if (o.userData.regionId) return { type: 'region', id: o.userData.regionId };
  if (o.userData.thingId) return { type: 'thing', id: o.userData.thingId };
  return null;
}

renderer.domElement.addEventListener('pointerdown', (ev) => {
  if (ev.button !== 0) return;
  pointerDownPos = { x: ev.clientX, y: ev.clientY };
  pointerMoved = false;

  // Ctrl/Cmd + drag on empty space → box select
  if ((ev.ctrlKey || ev.metaKey) && !ev.shiftKey) {
    const hitCheck = pickAny(ev);
    if (!hitCheck) {
      boxSelectStart = { x: ev.clientX, y: ev.clientY };
      controls.enabled = false;
      boxOverlay.style.display = 'block';
      updateBoxOverlay(boxSelectStart, boxSelectStart);
      renderer.domElement.setPointerCapture(ev.pointerId);
      ev.preventDefault();
      return;
    }
  }

  if (!ev.shiftKey) return;
  const hit = pickAny(ev);
  if (!hit) return;

  if (hit.type === 'card') {
    const card = cards.get(hit.id);
    dragging = { type: 'card', obj: card };
    controls.enabled = false;
    hoveredBucketId = null;
    pushedBucketId = null;
    dragPlane.setFromNormalAndCoplanarPoint(new THREE.Vector3(0, 1, 0), card.mesh.position);
    raycaster.setFromCamera(pointer, camera);
    raycaster.ray.intersectPlane(dragPlane, dragPoint);
    dragOffset.copy(card.mesh.position).sub(dragPoint);
    renderer.domElement.setPointerCapture(ev.pointerId);
  } else if (hit.type === 'bucket') {
    const bucket = buckets.get(hit.id);
    dragging = { type: 'bucket', obj: bucket };
    controls.enabled = false;
    hoveredBucketId = null;
    pushedBucketId = null;
    dragPlane.setFromNormalAndCoplanarPoint(new THREE.Vector3(0, 1, 0), bucket.group.position);
    raycaster.setFromCamera(pointer, camera);
    raycaster.ray.intersectPlane(dragPlane, dragPoint);
    dragOffset.copy(bucket.group.position).sub(dragPoint);
    renderer.domElement.setPointerCapture(ev.pointerId);
  } else if (hit.type === 'region') {
    const region = regions.get(hit.id);
    dragging = { type: 'region', obj: region };
    controls.enabled = false;
    dragPlane.setFromNormalAndCoplanarPoint(new THREE.Vector3(0, 1, 0), region.group.position);
    raycaster.setFromCamera(pointer, camera);
    raycaster.ray.intersectPlane(dragPlane, dragPoint);
    dragOffset.copy(region.group.position).sub(dragPoint);
    renderer.domElement.setPointerCapture(ev.pointerId);
  } else if (hit.type === 'thing') {
    const thing = things.get(hit.id);
    dragging = { type: 'thing', obj: thing, startCardId: thing.cardId, startPos: thing.position.slice() };
    controls.enabled = false;
    hoveredCardId = null;
    // detach immediately so it follows freely; re-attached on drop
    if (thing.cardId) {
      const oldCard = cards.get(thing.cardId);
      thing.cardId = null;
      if (oldCard) layoutThingsAroundCard(oldCard);
    }
    dragPlane.setFromNormalAndCoplanarPoint(new THREE.Vector3(0, 1, 0), thing.mesh.position);
    raycaster.setFromCamera(pointer, camera);
    raycaster.ray.intersectPlane(dragPlane, dragPoint);
    dragOffset.copy(thing.mesh.position).sub(dragPoint);
    renderer.domElement.setPointerCapture(ev.pointerId);
  }
});

renderer.domElement.addEventListener('pointermove', (ev) => {
  if (pointerDownPos) {
    const dx = ev.clientX - pointerDownPos.x;
    const dy = ev.clientY - pointerDownPos.y;
    if (dx * dx + dy * dy > 9) pointerMoved = true;
  }
  if (boxSelectStart) {
    updateBoxOverlay(boxSelectStart, { x: ev.clientX, y: ev.clientY });
    return;
  }
  if (!dragging) return;
  setPointer(ev);
  raycaster.setFromCamera(pointer, camera);
  if (!raycaster.ray.intersectPlane(dragPlane, dragPoint)) return;

  if (dragging.type === 'card') {
    const card = dragging.obj;
    const target = new THREE.Vector3().copy(dragPoint).add(dragOffset);

    // forcefield: if card is currently a bucket member and target is outside, apply resistance
    let newPushed = null;
    if (card.bucketId && buckets.has(card.bucketId)) {
      const home = buckets.get(card.bucketId);
      const dx = target.x - home.position[0];
      const dz = target.z - home.position[2];
      const dist = Math.hypot(dx, dz);
      if (dist > home.radius) {
        newPushed = home.id;
        const excess = dist - home.radius;
        const t = Math.min(excess / FORCEFIELD_WIDTH, 1.0);
        const ease = t * t * (3 - 2 * t); // smoothstep
        const inv = 1 / dist;
        const bx = home.position[0] + dx * inv * home.radius;
        const bz = home.position[2] + dz * inv * home.radius;
        target.x = bx + (target.x - bx) * ease;
        target.z = bz + (target.z - bz) * ease;
      }
    }
    if (newPushed !== pushedBucketId) {
      const prev = pushedBucketId;
      pushedBucketId = newPushed;
      if (prev && buckets.has(prev)) applyBucketVisualState(buckets.get(prev));
      if (newPushed && buckets.has(newPushed)) applyBucketVisualState(buckets.get(newPushed));
    }

    const oldCardX = card.mesh.position.x;
    const oldCardZ = card.mesh.position.z;
    card.mesh.position.copy(target);
    card.position = card.mesh.position.toArray();
    // translate any attached things by same delta
    const cdx = card.mesh.position.x - oldCardX;
    const cdz = card.mesh.position.z - oldCardZ;
    if (cdx !== 0 || cdz !== 0) {
      for (const t of things.values()) {
        if (t.cardId === card.id) {
          t.mesh.position.x += cdx;
          t.mesh.position.z += cdz;
          t.position = t.mesh.position.toArray();
        }
      }
    }

    // drop-target highlight based on actual (possibly dampened) position
    const overBucket = findBucketContaining(card.position);
    const newHover = overBucket ? overBucket.id : null;
    if (newHover !== hoveredBucketId) {
      const prevHover = hoveredBucketId;
      hoveredBucketId = newHover;
      if (prevHover && buckets.has(prevHover)) applyBucketVisualState(buckets.get(prevHover));
      if (newHover && buckets.has(newHover)) applyBucketVisualState(buckets.get(newHover));
      const previewColor = newHover ? buckets.get(newHover).color : null;
      drawCard(card, { selected: isSelected('card', card.id), accentOverride: previewColor });
    }

    // region highlight: only when not landing in a bucket
    const overRegion = !overBucket ? findRegionContaining(card.position[0], card.position[2], card.regionId) : null;
    const newRegionHover = overRegion ? overRegion.id : null;
    if (newRegionHover !== hoveredRegionId) {
      const prev = hoveredRegionId;
      hoveredRegionId = newRegionHover;
      if (prev && regions.has(prev)) applyRegionVisualState(regions.get(prev));
      if (newRegionHover && regions.has(newRegionHover)) applyRegionVisualState(regions.get(newRegionHover));
    }
  } else if (dragging.type === 'bucket') {
    const bucket = dragging.obj;
    const oldPos = bucket.group.position.clone();
    const target = new THREE.Vector3().copy(dragPoint).add(dragOffset);
    target.y = 0;

    // forcefield: if bucket has a parent and target is outside parent's ring, resist
    let newPushed = null;
    if (bucket.parentId && buckets.has(bucket.parentId)) {
      const home = buckets.get(bucket.parentId);
      const dx = target.x - home.position[0];
      const dz = target.z - home.position[2];
      const dist = Math.hypot(dx, dz);
      if (dist > home.radius) {
        newPushed = home.id;
        const excess = dist - home.radius;
        const t = Math.min(excess / FORCEFIELD_WIDTH, 1.0);
        const ease = t * t * (3 - 2 * t);
        const inv = 1 / dist;
        const bx = home.position[0] + dx * inv * home.radius;
        const bz = home.position[2] + dz * inv * home.radius;
        target.x = bx + (target.x - bx) * ease;
        target.z = bz + (target.z - bz) * ease;
      }
    }
    if (newPushed !== pushedBucketId) {
      const prev = pushedBucketId;
      pushedBucketId = newPushed;
      if (prev && buckets.has(prev)) applyBucketVisualState(buckets.get(prev));
      if (newPushed && buckets.has(newPushed)) applyBucketVisualState(buckets.get(newPushed));
    }

    // collision: push out of any non-nested bucket overlap
    const resolvedB = resolveBucketOverlap(bucket, target.x, target.z);
    target.x = resolvedB.x;
    target.z = resolvedB.z;

    // translate bucket + entire descendant subtree by delta
    const delta = new THREE.Vector3().subVectors(target, oldPos);
    if (delta.lengthSq() > 0) translateBucketTree(bucket, delta);

    // drop-target highlight (deepest valid nesting candidate, excluding self & descendants)
    const excl = descendantSet(bucket.id, true);
    let candidate = findDeepestBucketContaining(bucket.position[0], bucket.position[2], excl);
    while (candidate && !canNest(bucket, candidate)) {
      candidate = candidate.parentId ? buckets.get(candidate.parentId) : null;
    }
    const newHover = candidate ? candidate.id : null;
    if (newHover !== hoveredBucketId) {
      const prevHover = hoveredBucketId;
      hoveredBucketId = newHover;
      if (prevHover && buckets.has(prevHover)) applyBucketVisualState(buckets.get(prevHover));
      if (newHover && buckets.has(newHover)) applyBucketVisualState(buckets.get(newHover));
    }

    // region highlight: only when not nesting into a parent bucket
    const overRegion = !candidate ? findRegionContaining(bucket.position[0], bucket.position[2], bucket.regionId) : null;
    const newRegionHover = overRegion ? overRegion.id : null;
    if (newRegionHover !== hoveredRegionId) {
      const prev = hoveredRegionId;
      hoveredRegionId = newRegionHover;
      if (prev && regions.has(prev)) applyRegionVisualState(regions.get(prev));
      if (newRegionHover && regions.has(newRegionHover)) applyRegionVisualState(regions.get(newRegionHover));
    }
  } else if (dragging.type === 'region') {
    const region = dragging.obj;
    const target = new THREE.Vector3().copy(dragPoint).add(dragOffset);
    target.y = 0;
    // collision: push out of any other region's AABB
    const resolvedR = resolveRegionOverlap(region, target.x, target.z);
    target.x = resolvedR.x;
    target.z = resolvedR.z;
    const delta = new THREE.Vector3().subVectors(target, region.group.position);
    if (delta.lengthSq() > 0) translateRegion(region, delta);
  } else if (dragging.type === 'thing') {
    const thing = dragging.obj;
    const target = new THREE.Vector3().copy(dragPoint).add(dragOffset);
    target.y = CARD_ALTITUDE;
    thing.mesh.position.copy(target);
    thing.position = target.toArray();

    // hover-card highlight (preview attach target)
    const cardMeshes = [...cards.values()].map(c => c.mesh);
    const hits = raycaster.intersectObjects(cardMeshes, false);
    const newHover = hits.length ? hits[0].object.userData.cardId : null;
    if (newHover !== hoveredCardId) {
      const prevHover = hoveredCardId;
      hoveredCardId = newHover;
      if (prevHover && cards.has(prevHover)) drawCard(cards.get(prevHover));
      if (newHover && cards.has(newHover)) {
        const type = THING_TYPES[thing.type] || THING_TYPES.person;
        drawCard(cards.get(newHover), { accentOverride: type.color });
      }
    }
  }
});

renderer.domElement.addEventListener('pointerup', (ev) => {
  if (ev.button !== 0) return;
  if (boxSelectStart) {
    const cur = { x: ev.clientX, y: ev.clientY };
    const x1 = Math.min(boxSelectStart.x, cur.x);
    const y1 = Math.min(boxSelectStart.y, cur.y);
    const x2 = Math.max(boxSelectStart.x, cur.x);
    const y2 = Math.max(boxSelectStart.y, cur.y);
    const keys = (Math.abs(cur.x - boxSelectStart.x) >= 3 && Math.abs(cur.y - boxSelectStart.y) >= 3)
      ? itemsInBox(x1, y1, x2, y2) : [];
    applyBoxSelectionResult(keys);
    boxSelectStart = null;
    boxOverlay.style.display = 'none';
    controls.enabled = true;
    try { renderer.domElement.releasePointerCapture(ev.pointerId); } catch (e) {}
    pointerDownPos = null;
    return;
  }
  if (dragging) {
    if (dragging.type === 'card') {
      const card = dragging.obj;
      const inB = findBucketContaining(card.position);
      const newBucketId = inB ? inB.id : null;
      const oldBucketId = card.bucketId;
      card.bucketId = newBucketId;

      // region: only if not in a bucket
      let newRegionId = null;
      if (!newBucketId) {
        const inR = findRegionContaining(card.position[0], card.position[2], card.regionId);
        if (inR) newRegionId = inR.id;
      }
      const oldRegionId = card.regionId;
      card.regionId = newRegionId;

      // clear all drag highlights
      const prevHover = hoveredBucketId;
      const prevPushed = pushedBucketId;
      const prevRegionHover = hoveredRegionId;
      hoveredBucketId = null;
      pushedBucketId = null;
      hoveredRegionId = null;
      if (prevHover && buckets.has(prevHover)) applyBucketVisualState(buckets.get(prevHover));
      if (prevPushed && prevPushed !== prevHover && buckets.has(prevPushed)) applyBucketVisualState(buckets.get(prevPushed));
      if (prevRegionHover && regions.has(prevRegionHover)) applyRegionVisualState(regions.get(prevRegionHover));

      // re-layout affected buckets (snap card into orbit slot; regrow/shrink)
      if (oldBucketId && oldBucketId !== newBucketId && buckets.has(oldBucketId)) refreshBucket(buckets.get(oldBucketId));
      if (newBucketId && buckets.has(newBucketId)) refreshBucket(buckets.get(newBucketId));
      // refresh affected regions
      if (oldRegionId && oldRegionId !== newRegionId && regions.has(oldRegionId)) refreshRegion(regions.get(oldRegionId));
      if (newRegionId && regions.has(newRegionId)) refreshRegion(regions.get(newRegionId));

      drawCard(card);
      if (isSelected('card', card.id)) renderSidebar();
    } else if (dragging.type === 'bucket') {
      const bucket = dragging.obj;
      const excl = descendantSet(bucket.id, true);
      let target = findDeepestBucketContaining(bucket.position[0], bucket.position[2], excl);
      while (target && !canNest(bucket, target)) {
        target = target.parentId ? buckets.get(target.parentId) : null;
      }
      const newParentId = target ? target.id : null;
      const oldParentId = bucket.parentId;
      bucket.parentId = newParentId;

      // region: only if no parent bucket
      let newRegionId = null;
      if (!newParentId) {
        const inR = findRegionContaining(bucket.position[0], bucket.position[2], bucket.regionId);
        if (inR) newRegionId = inR.id;
      }
      const oldRegionId = bucket.regionId;
      bucket.regionId = newRegionId;

      // clear drag highlights
      const prevHover = hoveredBucketId;
      const prevPushed = pushedBucketId;
      const prevRegionHover = hoveredRegionId;
      hoveredBucketId = null;
      pushedBucketId = null;
      hoveredRegionId = null;
      if (prevHover && buckets.has(prevHover)) applyBucketVisualState(buckets.get(prevHover));
      if (prevPushed && prevPushed !== prevHover && buckets.has(prevPushed)) applyBucketVisualState(buckets.get(prevPushed));
      if (prevRegionHover && regions.has(prevRegionHover)) applyRegionVisualState(regions.get(prevRegionHover));

      // re-layout affected ancestors (snap bucket into its parent's orbit; regrow/shrink)
      if (oldParentId && oldParentId !== newParentId && buckets.has(oldParentId)) refreshBucket(buckets.get(oldParentId));
      if (newParentId && buckets.has(newParentId)) refreshBucket(buckets.get(newParentId));
      if (oldRegionId && oldRegionId !== newRegionId && regions.has(oldRegionId)) refreshRegion(regions.get(oldRegionId));
      if (newRegionId && regions.has(newRegionId)) refreshRegion(regions.get(newRegionId));
      if (isSelected('bucket', bucket.id)) renderSidebar();
    } else if (dragging.type === 'region') {
      const region = dragging.obj;
      if (isSelected('region', region.id)) renderSidebar();
    } else if (dragging.type === 'thing') {
      const thing = dragging.obj;
      // find card under cursor for attachment
      setPointer(ev);
      raycaster.setFromCamera(pointer, camera);
      const cardMeshes = [...cards.values()].map(c => c.mesh);
      const hits = raycaster.intersectObjects(cardMeshes, false);
      const newCardId = hits.length ? hits[0].object.userData.cardId : null;
      const oldCardId = dragging.startCardId;
      thing.cardId = newCardId;

      // clear hover highlight
      const prevHover = hoveredCardId;
      hoveredCardId = null;
      if (prevHover && cards.has(prevHover)) drawCard(cards.get(prevHover));

      // re-layout cards' orbits
      if (oldCardId && oldCardId !== newCardId && cards.has(oldCardId)) layoutThingsAroundCard(cards.get(oldCardId));
      if (newCardId && cards.has(newCardId)) layoutThingsAroundCard(cards.get(newCardId));

      drawThing(thing);
      if (isSelected('thing', thing.id)) renderSidebar();
      updatePalette();
    }
    save();
    dragging = null;
    controls.enabled = true;
    renderer.domElement.releasePointerCapture(ev.pointerId);
    pointerDownPos = null;
    return;
  }
  if (!pointerMoved) {
    const hit = pickAny(ev);
    if (hit) select(hit.type, hit.id);
    else select(null);
  }
  pointerDownPos = null;
});

// ============================================================
// FPS navigation (hold right-click + WASD)
// ============================================================
let fpsMode = false;
let fpsYaw = 0, fpsPitch = 0;
let fpsSpeed = 10;
const fpsKeys = { w: false, a: false, s: false, d: false, space: false, ctrl: false, shift: false };

renderer.domElement.addEventListener('contextmenu', (ev) => ev.preventDefault());

function enterFPS() {
  if (fpsMode || dragging) return;
  fpsMode = true;
  controls.enabled = false;
  const dir = new THREE.Vector3();
  camera.getWorldDirection(dir);
  fpsYaw = Math.atan2(-dir.x, -dir.z);
  fpsPitch = Math.asin(Math.max(-1, Math.min(1, dir.y)));
  camera.rotation.order = 'YXZ';
  camera.rotation.set(fpsPitch, fpsYaw, 0);
  renderer.domElement.requestPointerLock?.();
}

function exitFPS() {
  if (!fpsMode) return;
  fpsMode = false;
  if (document.pointerLockElement === renderer.domElement) document.exitPointerLock();
  // re-anchor orbit target in front of camera
  const dir = new THREE.Vector3();
  camera.getWorldDirection(dir);
  controls.target.copy(camera.position).add(dir.multiplyScalar(10));
  controls.enabled = true;
  // clear any held keys so movement doesn't leak after exit
  for (const k of Object.keys(fpsKeys)) fpsKeys[k] = false;
}

// right-button press → FPS (capture phase to beat OrbitControls)
renderer.domElement.addEventListener('pointerdown', (ev) => {
  if (ev.button !== 2) return;
  ev.preventDefault();
  ev.stopImmediatePropagation();
  enterFPS();
}, true);

renderer.domElement.addEventListener('pointerup', (ev) => {
  if (ev.button !== 2) return;
  ev.preventDefault();
  exitFPS();
}, true);

document.addEventListener('pointerlockchange', () => {
  if (fpsMode && document.pointerLockElement !== renderer.domElement) exitFPS();
});

document.addEventListener('mousemove', (ev) => {
  if (!fpsMode) return;
  const sens = 0.0025;
  fpsYaw -= ev.movementX * sens;
  fpsPitch -= ev.movementY * sens;
  const limit = Math.PI / 2 - 0.001;
  fpsPitch = Math.max(-limit, Math.min(limit, fpsPitch));
  camera.rotation.set(fpsPitch, fpsYaw, 0);
});

function setFpsKey(keyLower, down) {
  switch (keyLower) {
    case 'w': case 'arrowup':    fpsKeys.w = down; return true;
    case 'a': case 'arrowleft':  fpsKeys.a = down; return true;
    case 's': case 'arrowdown':  fpsKeys.s = down; return true;
    case 'd': case 'arrowright': fpsKeys.d = down; return true;
    case ' ':                    fpsKeys.space = down; return true;
    case 'control':              fpsKeys.ctrl = down; return true;
    case 'shift':                fpsKeys.shift = down; return true;
  }
  return false;
}

document.addEventListener('keydown', (ev) => {
  if (!fpsMode) return;
  if (ev.target.matches('input, textarea')) return;
  if (setFpsKey(ev.key.toLowerCase(), true)) ev.preventDefault();
});
document.addEventListener('keyup', (ev) => {
  if (setFpsKey(ev.key.toLowerCase(), false)) ev.preventDefault();
});

renderer.domElement.addEventListener('wheel', (ev) => {
  if (!fpsMode) return;
  ev.preventDefault();
  ev.stopImmediatePropagation();
  fpsSpeed = Math.max(1, Math.min(80, fpsSpeed * (ev.deltaY < 0 ? 1.15 : 1 / 1.15)));
}, { passive: false, capture: true });

const _fpsForward = new THREE.Vector3();
const _fpsRight = new THREE.Vector3();
const _fpsUp = new THREE.Vector3(0, 1, 0);
const _fpsMotion = new THREE.Vector3();

function updateFPS(dt) {
  if (!fpsMode) return;
  let mx = 0, my = 0, mz = 0;
  if (fpsKeys.w) mz -= 1;
  if (fpsKeys.s) mz += 1;
  if (fpsKeys.a) mx -= 1;
  if (fpsKeys.d) mx += 1;
  if (fpsKeys.space) my += 1;
  if (fpsKeys.ctrl) my -= 1;
  if (mx === 0 && my === 0 && mz === 0) return;
  camera.getWorldDirection(_fpsForward);
  _fpsRight.crossVectors(_fpsForward, _fpsUp).normalize();
  _fpsMotion.set(0, 0, 0);
  _fpsMotion.addScaledVector(_fpsForward, -mz);
  _fpsMotion.addScaledVector(_fpsRight, mx);
  _fpsMotion.y += my;
  if (_fpsMotion.lengthSq() === 0) return;
  _fpsMotion.normalize().multiplyScalar(fpsSpeed * (fpsKeys.shift ? 3 : 1) * dt);
  camera.position.add(_fpsMotion);
}

const sidebarTitle = document.getElementById('sidebar-title');
const sidebarBody = document.getElementById('sidebar-body');
const sidebarFooter = document.getElementById('sidebar-footer');

function renderSidebar() {
  const deleteBtn = document.getElementById('delete-btn');
  if (typeof boxSelection !== 'undefined' && boxSelection.size > 0 && !selection) {
    renderMultiSelectSidebar();
    if (deleteBtn) deleteBtn.textContent = `Delete ${boxSelection.size}`;
    return;
  }
  if (deleteBtn) deleteBtn.textContent = 'Delete';
  if (!selection) {
    sidebarTitle.textContent = 'Selection';
    sidebarBody.innerHTML = `<div class="empty">Nothing selected.<br/>Click a card, bucket, region, or thing to edit it.<br/><br/><span style="font-size:11px;">Ctrl+drag on empty space to box-select multiple items.</span></div>`;
    sidebarFooter.style.display = 'none';
    return;
  }
  sidebarBody.innerHTML = '';
  sidebarFooter.style.display = 'flex';
  if (selection.type === 'card') renderCardSidebar(cards.get(selection.id));
  else if (selection.type === 'bucket') renderBucketSidebar(buckets.get(selection.id));
  else if (selection.type === 'region') renderRegionSidebar(regions.get(selection.id));
  else if (selection.type === 'thing') renderThingSidebar(things.get(selection.id));
}

function renderMultiSelectSidebar() {
  sidebarTitle.textContent = `${boxSelection.size} selected`;
  sidebarFooter.style.display = 'flex';
  sidebarBody.innerHTML = '';
  const counts = { card: 0, bucket: 0, region: 0, thing: 0 };
  const rows = [];
  for (const key of boxSelection) {
    const { type, id } = parseSelectionKey(key);
    counts[type] = (counts[type] || 0) + 1;
    let label = '';
    if (type === 'card') label = cards.get(id)?.title || 'Untitled card';
    else if (type === 'bucket') label = buckets.get(id)?.name || 'Untitled bucket';
    else if (type === 'region') label = regions.get(id)?.name || 'Untitled region';
    else if (type === 'thing') label = things.get(id)?.title || 'Untitled thing';
    rows.push({ type, id, label });
  }
  const wrap = document.createElement('div');
  wrap.className = 'selection-summary';
  const top = document.createElement('div');
  top.style.fontSize = '12px';
  top.style.color = 'var(--muted)';
  top.textContent = 'Box selection — mass delete needs three confirmations.';
  wrap.appendChild(top);
  const counts_el = document.createElement('div');
  counts_el.className = 'counts';
  for (const t of Object.keys(counts)) {
    if (!counts[t]) continue;
    const chip = document.createElement('span');
    chip.className = 'count-chip';
    chip.textContent = `${counts[t]} ${t}${counts[t] !== 1 ? 's' : ''}`;
    counts_el.appendChild(chip);
  }
  wrap.appendChild(counts_el);
  const list = document.createElement('div');
  list.className = 'list';
  for (const r of rows) {
    const row = document.createElement('div');
    row.className = 'row';
    row.innerHTML = `<span class="type">${r.type}</span><span>${escapeHtml(r.label)}</span>`;
    row.title = 'Click to select this item alone';
    row.addEventListener('click', () => select(r.type, r.id));
    list.appendChild(row);
  }
  wrap.appendChild(list);
  sidebarBody.appendChild(wrap);
}

  const nameLabel = document.createElement('label');
  nameLabel.textContent = 'Name';
  const nameInput = document.createElement('input');
  nameInput.value = bucket.name;

    save();
  });

  const colorLabel = document.createElement('label');
  colorLabel.textContent = 'Color';
  const swatches = document.createElement('div');
  swatches.className = 'swatches';

    const parentRow = document.createElement('div');
    const p = buckets.get(bucket.parentId);

    pill.addEventListener('click', () => select('bucket', p.id));
    parentRow.appendChild(pill);
    sidebarBody.append(parentLabel, parentRow);
  }

  // Region (only for top-level buckets)
  if (!bucket.parentId) {
    const regionLabel = document.createElement('label');
    regionLabel.textContent = 'Region';
    const regionRow = document.createElement('div');
    if (bucket.regionId && regions.has(bucket.regionId)) {
      const r = regions.get(bucket.regionId);
      const pill = document.createElement('span');
      pill.className = 'bucket-pill';
      pill.innerHTML = `<span class="dot" style="background:${r.color}"></span>${escapeHtml(r.name)}`;

    const cbLabel = document.createElement('label');

    cbList.style.flexDirection = 'column';
    cbList.style.gap = '4px';

      cbList.innerHTML = `<span class="meta">No nested buckets. Drag another bucket here, or press "+ Bucket" while this one is selected.</span>`;

        const row = document.createElement('div');
        row.className = 'bucket-pill';
        row.style.borderRadius = '6px';
        row.innerHTML = `<span class="dot" style="background:${cb.color}"></span>${escapeHtml(cb.name)}`;
        row.addEventListener('click', () => select('bucket', cb.id));
        cbList.appendChild(row);
      }

    sidebarBody.append(cbLabel, cbList);

  // Cards
  const members = membersOf(bucket.id);
  const memberLabel = document.createElement('label');
  memberLabel.textContent = `Cards (${members.length})`;
  const memberList = document.createElement('div');
  memberList.style.display = 'flex';

  memberList.style.gap = '4px';

  } else {

      memberList.appendChild(row);

  sidebarBody.append(memberLabel, memberList);

  const meta = document.createElement('div');
  meta.className = 'meta';
  const [x, , z] = bucket.position.map(n => n.toFixed(2));
  const depth = depthOf(bucket.id);
  meta.textContent = `Level ${depth + 1} · center (${x}, ${z}) · radius ${bucket.radius.toFixed(2)}`;

  if (bucket.name === 'New bucket') { nameInput.focus(); nameInput.select(); }

function renderCardBadgesSection(card) {
  const wrap = document.createElement('div');
  wrap.style.display = 'flex';
  wrap.style.flexDirection = 'column';
  wrap.style.gap = '6px';

  const applied = (card.badgeIds || []).map(id => badges.get(id)).filter(Boolean);
  const lbl = document.createElement('label');
  lbl.textContent = `Badges (${applied.length})`;
  wrap.appendChild(lbl);

  const appliedRow = document.createElement('div');
  appliedRow.className = 'badge-row';
  if (applied.length === 0) {
    const empty = document.createElement('span');
    empty.className = 'meta';
    empty.textContent = 'No badges applied.';
    appliedRow.appendChild(empty);
  } else {
    for (const b of applied) {
      const chip = document.createElement('span');
      chip.className = 'badge-chip';
      chip.style.background = b.color;
      const txt = document.createElement('span');
      txt.textContent = b.label;
      const close = document.createElement('span');
      close.className = 'x';
      close.textContent = '×';
      close.title = 'Remove from this card';
      close.addEventListener('click', (ev) => {
        ev.stopPropagation();
        removeBadgeFromCard(card.id, b.id);
        renderSidebar();
      });
      chip.append(txt, close);
      appliedRow.appendChild(chip);
    }
  }
  wrap.appendChild(appliedRow);

  const available = [...badges.values()].filter(b => !applied.includes(b));
  if (available.length > 0) {
    const avLabel = document.createElement('div');
    avLabel.className = 'meta';
    avLabel.style.marginTop = '4px';
    avLabel.textContent = 'Available — click to apply:';
    wrap.appendChild(avLabel);

    const avRow = document.createElement('div');
    avRow.className = 'badge-row';
    for (const b of available) {
      const chip = document.createElement('span');
      chip.className = 'badge-chip subtle';
      const dot = document.createElement('span');
      dot.className = 'dot';
      dot.style.background = b.color;
      const txt = document.createElement('span');
      txt.textContent = b.label;
      chip.append(dot, txt);
      chip.title = `Apply "${b.label}" to this card`;
      chip.addEventListener('click', () => {
        applyBadgeToCard(card.id, b.id);
        renderSidebar();
      });
      const del = document.createElement('span');
      del.className = 'x';
      del.textContent = '×';
      del.title = 'Delete this badge (removes from all cards)';
      del.addEventListener('click', (ev) => {
        ev.stopPropagation();
        const usedBy = [...cards.values()].filter(c => c.badgeIds && c.badgeIds.includes(b.id)).length;
        const msg = usedBy > 0

function focusSelected() {
  if (!selection) return;
  let target;
  let distance = 8;
  if (selection.type === 'card') {
    const c = cards.get(selection.id);
    if (!c) return;
    target = c.mesh.position.clone();
  } else if (selection.type === 'thing') {
    const t = things.get(selection.id);
    if (!t) return;
    target = t.mesh.position.clone();
    distance = 5;
  } else if (selection.type === 'region') {
    const r = regions.get(selection.id);
    if (!r) return;
    target = r.group.position.clone(); target.y = REGION_HEIGHT / 2;
    distance = Math.max(r.width, r.depth) * 1.4;
  } else {
    const b = buckets.get(selection.id);
    if (!b) return;
    target = b.group.position.clone(); target.y = BUCKET_HEIGHT / 2;
    distance = b.radius * 2.5;
  }
  controls.target.copy(target);
  const dir = new THREE.Vector3().subVectors(camera.position, target).normalize();
  camera.position.copy(target).add(dir.multiplyScalar(distance));
}

document.addEventListener('keydown', (ev) => {
  if (ev.target.matches('input, textarea, select')) return;
  if (fpsMode) return;
  if ((ev.key === 'Delete' || ev.key === 'Backspace')) {
    if (boxSelection.size > 0) { massDelete(); ev.preventDefault(); }
    else if (selection) {
      if (selection.type === 'card') deleteCard(selection.id);
      else if (selection.type === 'bucket') deleteBucket(selection.id);
      else if (selection.type === 'region') deleteRegion(selection.id);
      else if (selection.type === 'thing') deleteThing(selection.id);
      ev.preventDefault();
    }
  }
  if (ev.key === 'Escape') {
    if (boxSelection.size > 0) { clearBoxSelection(); ev.preventDefault(); }
    else if (selection) { select(null); ev.preventDefault(); }
  }
  if ((ev.ctrlKey || ev.metaKey) && (ev.key === 'z' || ev.key === 'Z')) {
    if (ev.shiftKey) redo(); else undo();
    ev.preventDefault();
  } else if ((ev.ctrlKey || ev.metaKey) && (ev.key === 'y' || ev.key === 'Y')) {
    redo();
    ev.preventDefault();
  }
  if (ev.key === 'f' && selection) focusSelected();
});

// ============================================================
// Persistence
// ============================================================
const STORAGE_KEY = 'obelisk.v2';
const BACKUP_KEYS = [STORAGE_KEY + '.bak.1', STORAGE_KEY + '.bak.2', STORAGE_KEY + '.bak.3'];
const BACKUP_MIN_INTERVAL_MS = 10000;
let saveTimer = null;
let lastBackupAt = 0;
let isApplyingHistory = false;

function buildStateData() {
  return {
    savedAt: new Date().toISOString(),
    currentWorld,
    currentViewMode: viewModeByWorld,
    currentColorMode,
    cards: [...cards.values()].map(c => ({
      id: c.id, title: c.title, description: c.description, position: c.position, bucketId: c.bucketId || null, regionId: c.regionId || null, badgeIds: c.badgeIds || [], accomplishmentIds: c.accomplishmentIds || [], priority: c.priority || 0, dueAt: c.dueAt || null, world: c.world || 'main',
    })),
    buckets: [...buckets.values()].map(b => ({
      id: b.id, name: b.name, position: b.position, radius: b.radius, baseRadius: b.baseRadius, color: b.color, parentId: b.parentId || null, regionId: b.regionId || null, world: b.world || 'main',
    })),
    regions: [...regions.values()].map(r => ({
      id: r.id, name: r.name, position: r.position, width: r.width, depth: r.depth, color: r.color, world: r.world || 'main',
    })),
    badges: [...badges.values()].map(b => ({ id: b.id, label: b.label, color: b.color, world: b.world || 'main' })),
    things: [...things.values()].map(t => ({
      id: t.id, title: t.title, description: t.description, type: t.type, position: t.position, cardId: t.cardId || null, world: t.world || 'main',
    })),
  };
}

function rotateBackups() {
  const now = Date.now();
  if (now - lastBackupAt < BACKUP_MIN_INTERVAL_MS) return;
  const current = localStorage.getItem(STORAGE_KEY);
  if (!current) return;
  try {
    const b1 = localStorage.getItem(BACKUP_KEYS[0]);
    const b2 = localStorage.getItem(BACKUP_KEYS[1]);
    if (b2) localStorage.setItem(BACKUP_KEYS[2], b2);
    if (b1) localStorage.setItem(BACKUP_KEYS[1], b1);
    localStorage.setItem(BACKUP_KEYS[0], current);
    lastBackupAt = now;
  } catch (e) { /* ignore quota etc. */ }
}

function save() {
  clearTimeout(saveTimer);
  const skipMaintenance = isApplyingHistory;
  saveTimer = setTimeout(() => {
    if (!skipMaintenance) rotateBackups();
    const data = buildStateData();
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch (e) {}
    if (!skipMaintenance) scheduleHistorySnapshot();
  }, 200);
  if (typeof scheduleAutosave === 'function') scheduleAutosave();
}

function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return false;
    const data = JSON.parse(raw);
    const empty =
      (data.buckets || []).length === 0 &&
      (data.cards || []).length === 0 &&
      (data.regions || []).length === 0 &&
      (data.badges || []).length === 0 &&
      (data.things || []).length === 0;
    if (empty) return false;
    applyStateData(data);
    return true;
  } catch (e) { return false; }
}

// ============================================================
// Undo / redo (history of state snapshots)
// ============================================================
const history = []; // array of JSON-stringified state snapshots
let historyIndex = -1;
const HISTORY_MAX = 60;
const HISTORY_DEBOUNCE_MS = 800;
let historyTimer = null;

function pushHistorySnapshot() {
  if (isApplyingHistory) return;
  const snap = JSON.stringify(buildStateData());
  if (history.length > 0 && history[historyIndex] === snap) return;
  history.length = historyIndex + 1; // truncate redo
  history.push(snap);
  if (history.length > HISTORY_MAX) history.shift();
  else historyIndex++;
  updateUndoRedoUI();
}

function scheduleHistorySnapshot(immediate = false) {
  if (isApplyingHistory) return;
  clearTimeout(historyTimer);
  if (immediate) pushHistorySnapshot();
  else historyTimer = setTimeout(pushHistorySnapshot, HISTORY_DEBOUNCE_MS);
}

function undo() {
  if (historyIndex <= 0) return;
  clearTimeout(historyTimer);
  historyIndex--;
  applyHistoryAt(historyIndex);
}

function redo() {
  if (historyIndex >= history.length - 1) return;
  clearTimeout(historyTimer);
  historyIndex++;
  applyHistoryAt(historyIndex);
}

function applyHistoryAt(idx) {
  isApplyingHistory = true;
  try {
    const data = JSON.parse(history[idx]);
    applyStateData(data);
    // write to localStorage directly, no rotation, no new history snapshot
    try { localStorage.setItem(STORAGE_KEY, history[idx]); } catch (e) {}
    if (typeof scheduleAutosave === 'function') scheduleAutosave();
  } finally {
    isApplyingHistory = false;
    updateUndoRedoUI();
  }
}

function updateUndoRedoUI() {
  const undoBtn = document.getElementById('undo-btn');
  const redoBtn = document.getElementById('redo-btn');
  if (undoBtn) undoBtn.disabled = historyIndex <= 0;
  if (redoBtn) redoBtn.disabled = historyIndex >= history.length - 1;
}

// ============================================================
// Restore from .bak.N
// ============================================================
function fmtAgo(date) {
  const sec = Math.max(0, Math.floor((Date.now() - date.getTime()) / 1000));
  if (sec < 60) return `${sec}s ago`;
  const min = Math.floor(sec / 60);
  if (min < 60) return `${min}m ago`;
  const hr = Math.floor(min / 60);
  if (hr < 24) return `${hr}h ago`;
  const day = Math.floor(hr / 24);
  return `${day}d ago`;
}

function getBackupInfo(n) {
  const raw = localStorage.getItem(BACKUP_KEYS[n - 1]);
  if (!raw) return null;
  try {
    const d = JSON.parse(raw);
    const count = (d.cards?.length || 0) + (d.buckets?.length || 0) + (d.regions?.length || 0) + (d.things?.length || 0) + (d.badges?.length || 0);
    return { n, ts: d.savedAt, count, raw };
  } catch (e) { return null; }
}

function showRestoreMenu() {
  const menu = document.getElementById('restore-menu');
  if (!menu) return;
  menu.innerHTML = '';
  const items = [1, 2, 3].map(getBackupInfo).filter(Boolean);
  if (items.length === 0) {
    const empty = document.createElement('div');
    empty.className = 'empty';
    empty.textContent = 'No backups yet. The previous saved state will appear here.';
    menu.appendChild(empty);
  } else {
    for (const it of items) {
      const row = document.createElement('div');
      row.className = 'item';
      const ago = it.ts ? fmtAgo(new Date(it.ts)) : 'unknown';
      const tsStr = it.ts ? new Date(it.ts).toLocaleString() : '';
      row.innerHTML = `<span>.bak.${it.n} <span class="meta">${ago}</span></span><span class="meta">${it.count} items</span>`;
      row.title = `Saved ${tsStr} — click to restore`;
      row.addEventListener('click', () => {
        if (confirm(`Restore from .bak.${it.n}? Your current state will be saved as a fresh backup first.`)) {
          restoreFromBackup(it.n);
          menu.style.display = 'none';
        }
      });
      menu.appendChild(row);
    }
  }
  const btn = document.getElementById('restore-btn');
  const rect = btn.getBoundingClientRect();
  menu.style.left = rect.left + 'px';
  menu.style.top = (rect.bottom + 4) + 'px';
  menu.style.display = 'flex';
}

function restoreFromBackup(n) {
  const info = getBackupInfo(n);
  if (!info) { alert('Backup not found.'); return; }
  // Force a backup of the current state first so this is itself undoable via .bak
  lastBackupAt = 0;
  rotateBackups();
  try {
    const data = JSON.parse(info.raw);
    applyStateData(data);
    save();
    scheduleHistorySnapshot(true);
  } catch (e) { alert('Backup is corrupted: ' + e.message); }
}

// ============================================================
// Box selection (Ctrl+drag on empty canvas)
// ============================================================
const boxSelection = new Set(); // 'card:id' / 'bucket:id' / etc.
const boxOverlay = document.getElementById('box-select-overlay');
let boxSelectStart = null; // {x, y} client coords

function selectionKey(type, id) { return `${type}:${id}`; }
function parseSelectionKey(key) {
  const i = key.indexOf(':');
  return { type: key.slice(0, i), id: key.slice(i + 1) };
}

function redrawAllVisible() {
  for (const c of cards.values()) if (c.world === currentWorld) drawCard(c);
  for (const b of buckets.values()) if (b.world === currentWorld) applyBucketVisualState(b);
  for (const r of regions.values()) if (r.world === currentWorld) applyRegionVisualState(r);
  for (const t of things.values()) if (t.world === currentWorld) drawThing(t);
}

function clearBoxSelection() {
  if (boxSelection.size === 0) return;
  boxSelection.clear();
  redrawAllVisible();
  renderSidebar();
}

function updateBoxOverlay(start, current) {
  const x = Math.min(start.x, current.x);
  const y = Math.min(start.y, current.y);
  const w = Math.abs(current.x - start.x);
  const h = Math.abs(current.y - start.y);
  boxOverlay.style.left = x + 'px';
  boxOverlay.style.top = y + 'px';
  boxOverlay.style.width = w + 'px';
  boxOverlay.style.height = h + 'px';
}

function projectToScreen(worldPos) {
  const v = worldPos.clone().project(camera);
  if (v.z > 1) return null; // behind camera
  const rect = renderer.domElement.getBoundingClientRect();
  return {
    x: (v.x + 1) / 2 * rect.width + rect.left,
    y: (-v.y + 1) / 2 * rect.height + rect.top,
  };
}

function itemsInBox(x1, y1, x2, y2) {
  const result = [];
  const inBox = (p) => p && p.x >= x1 && p.x <= x2 && p.y >= y1 && p.y <= y2;
  for (const c of cards.values()) {
    if (c.world !== currentWorld) continue;
    if (inBox(projectToScreen(c.mesh.position))) result.push(selectionKey('card', c.id));
  }
  for (const b of buckets.values()) {
    if (b.world !== currentWorld) continue;
    if (inBox(projectToScreen(b.group.position))) result.push(selectionKey('bucket', b.id));
  }
  for (const r of regions.values()) {
    if (r.world !== currentWorld) continue;
    if (inBox(projectToScreen(r.group.position))) result.push(selectionKey('region', r.id));
  }
  for (const t of things.values()) {
    if (t.world !== currentWorld) continue;
    if (inBox(projectToScreen(t.mesh.position))) result.push(selectionKey('thing', t.id));
  }
  return result;
}

function applyBoxSelectionResult(keys) {
  if (keys.length === 0) { clearBoxSelection(); select(null); return; }
  if (keys.length === 1) {
    boxSelection.clear();
    const { type, id } = parseSelectionKey(keys[0]);
    select(type, id);
    return;
  }
  selection = null;
  boxSelection.clear();
  for (const k of keys) boxSelection.add(k);
  redrawAllVisible();
  renderSidebar();
}

function massDelete() {
  const n = boxSelection.size;
  if (n === 0) return;
  if (!confirm(`ARE YOU SURE? You're about to delete ${n} item${n !== 1 ? 's' : ''}.`)) return;
  if (!confirm('ARE YOU REALLY SURE?')) return;
  if (!confirm('ARE YOU REALLY REALLY SURE?')) return;
  const items = [...boxSelection].map(parseSelectionKey);
  boxSelection.clear();
  // delete in dependency order: things → cards → buckets → regions
  for (const it of items.filter(x => x.type === 'thing')) deleteThing(it.id);
  for (const it of items.filter(x => x.type === 'card')) deleteCard(it.id);
  for (const it of items.filter(x => x.type === 'bucket')) deleteBucket(it.id);
  for (const it of items.filter(x => x.type === 'region')) deleteRegion(it.id);
  selection = null;
  renderSidebar();
  scheduleHistorySnapshot(true);
}

// ============================================================
// Things palette (bottom strip)
// ============================================================
const paletteStrip = document.getElementById('palette-strip');
let paletteDrag = null; // { thingId, startX, startY, isDragging, startPos, startCardId }

function updatePalette() {
  paletteStrip.innerHTML = '';
  const worldThings = [...things.values()].filter(t => t.world === currentWorld);
  if (worldThings.length === 0) {
    const empty = document.createElement('span');
    empty.className = 'palette-empty';
    empty.textContent = 'No things yet — press "+ Thing" to create one. Drag chips onto cards to attach.';
    paletteStrip.appendChild(empty);
    return;
  }
  const types = thingTypesForWorld(currentWorld);
  for (const thing of worldThings) {
    const chip = document.createElement('div');
    chip.className = 'thing-chip';
    chip.dataset.thingId = thing.id;
    if (thing.cardId) chip.classList.add('attached');
    if (isSelected('thing', thing.id)) chip.classList.add('active');
    const type = types[thing.type] || types.person;
    const icon = document.createElement('span');
    icon.className = `icon ${type.shape}`;
    icon.style.background = type.color;
    const label = document.createElement('span');
    label.className = 'label';
    label.textContent = thing.title || 'Untitled';
    chip.append(icon, label);
    attachChipDragHandlers(chip, thing.id);
    paletteStrip.appendChild(chip);
  }
}

function updatePaletteSelection() {
  for (const chip of paletteStrip.children) {
    if (chip.dataset && chip.dataset.thingId) {
      chip.classList.toggle('active', isSelected('thing', chip.dataset.thingId));
    }
  }
}

function attachChipDragHandlers(chip, thingId) {
  chip.addEventListener('pointerdown', (ev) => {
    if (ev.button !== 0) return;
    ev.preventDefault();
    paletteDrag = {
      thingId,
      startX: ev.clientX, startY: ev.clientY,
      isDragging: false,
      startPos: null,
      startCardId: null,
    };
    document.addEventListener('pointermove', onPaletteDragMove);
    document.addEventListener('pointerup', onPaletteDragUp);
  });
}

function onPaletteDragMove(ev) {
  if (!paletteDrag) return;
  const thing = things.get(paletteDrag.thingId);
  if (!thing) return;
  const dx = ev.clientX - paletteDrag.startX;
  const dy = ev.clientY - paletteDrag.startY;
  if (!paletteDrag.isDragging) {
    if (dx * dx + dy * dy <= 36) return;
    paletteDrag.isDragging = true;
    paletteDrag.startPos = thing.position.slice();
    paletteDrag.startCardId = thing.cardId;
    controls.enabled = false;
    // detach so it follows freely; re-attach on drop
    if (thing.cardId) {
      const oldCard = cards.get(thing.cardId);
      thing.cardId = null;
      if (oldCard) layoutThingsAroundCard(oldCard);
    }
  }

  const rect = renderer.domElement.getBoundingClientRect();
  const inCanvas = ev.clientX >= rect.left && ev.clientX <= rect.right && ev.clientY >= rect.top && ev.clientY <= rect.bottom;
  if (!inCanvas) return;

  const px = ((ev.clientX - rect.left) / rect.width) * 2 - 1;
  const py = -((ev.clientY - rect.top) / rect.height) * 2 + 1;
  pointer.set(px, py);
  raycaster.setFromCamera(pointer, camera);
  const plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -CARD_ALTITUDE);
  const hitPoint = new THREE.Vector3();
  if (raycaster.ray.intersectPlane(plane, hitPoint)) {
    thing.mesh.position.set(hitPoint.x, CARD_ALTITUDE, hitPoint.z);
    thing.position = [hitPoint.x, CARD_ALTITUDE, hitPoint.z];
  }

  const cardMeshes = [...cards.values()].map(c => c.mesh);
  const hits = raycaster.intersectObjects(cardMeshes, false);
  const newHover = hits.length ? hits[0].object.userData.cardId : null;
  if (newHover !== hoveredCardId) {
    const prev = hoveredCardId;
    hoveredCardId = newHover;
    if (prev && cards.has(prev)) drawCard(cards.get(prev));
    if (newHover && cards.has(newHover)) {
      const type = THING_TYPES[thing.type] || THING_TYPES.person;
      drawCard(cards.get(newHover), { accentOverride: type.color });
    }
  }
}

function onPaletteDragUp(ev) {
  if (!paletteDrag) return;
  document.removeEventListener('pointermove', onPaletteDragMove);
  document.removeEventListener('pointerup', onPaletteDragUp);

  const thing = things.get(paletteDrag.thingId);
  if (!thing) { paletteDrag = null; return; }

  if (!paletteDrag.isDragging) {
    select('thing', paletteDrag.thingId);
    paletteDrag = null;
    return;
  }

  const rect = renderer.domElement.getBoundingClientRect();
  const inCanvas = ev.clientX >= rect.left && ev.clientX <= rect.right && ev.clientY >= rect.top && ev.clientY <= rect.bottom;

  if (inCanvas) {
    const px = ((ev.clientX - rect.left) / rect.width) * 2 - 1;
    const py = -((ev.clientY - rect.top) / rect.height) * 2 + 1;
    pointer.set(px, py);
    raycaster.setFromCamera(pointer, camera);
    const cardMeshes = [...cards.values()].map(c => c.mesh);
    const hits = raycaster.intersectObjects(cardMeshes, false);
    const newCardId = hits.length ? hits[0].object.userData.cardId : null;
    thing.cardId = newCardId;
    if (newCardId && cards.has(newCardId)) layoutThingsAroundCard(cards.get(newCardId));
  } else {
    // released outside canvas — revert to pre-drag state
    thing.position = paletteDrag.startPos.slice();
    thing.mesh.position.fromArray(thing.position);
    thing.cardId = paletteDrag.startCardId;
    if (thing.cardId && cards.has(thing.cardId)) layoutThingsAroundCard(cards.get(thing.cardId));
  }

  const prevHover = hoveredCardId;
  hoveredCardId = null;
  if (prevHover && cards.has(prevHover)) drawCard(cards.get(prevHover));

  controls.enabled = true;
  drawThing(thing);
  if (isSelected('thing', thing.id)) renderSidebar();
  updatePalette();
  save();
  paletteDrag = null;
}

// ============================================================
// JSON import / export
// ============================================================
function serializeState() {
  return {
    version: 8,
    exportedAt: new Date().toISOString(),
    currentWorld,
    currentViewMode: viewModeByWorld,
    currentColorMode,
    regions: [...regions.values()].map(r => ({
      id: r.id, name: r.name, position: r.position, width: r.width, depth: r.depth, color: r.color, world: r.world || 'main',
    })),
    buckets: [...buckets.values()].map(b => ({
      id: b.id, name: b.name, position: b.position, radius: b.radius, baseRadius: b.baseRadius, color: b.color, parentId: b.parentId || null, regionId: b.regionId || null, world: b.world || 'main',
    })),
    badges: [...badges.values()].map(b => ({ id: b.id, label: b.label, color: b.color, world: b.world || 'main' })),
    cards: [...cards.values()].map(c => ({
      id: c.id, title: c.title, description: c.description, position: c.position, bucketId: c.bucketId || null, regionId: c.regionId || null, badgeIds: c.badgeIds || [], accomplishmentIds: c.accomplishmentIds || [], priority: c.priority || 0, dueAt: c.dueAt || null, world: c.world || 'main',
    })),
    things: [...things.values()].map(t => ({
      id: t.id, title: t.title, description: t.description, type: t.type, position: t.position, cardId: t.cardId || null, world: t.world || 'main',
    })),
  };
}

function validateBucketParents() {
  // strip parentId pointing to missing buckets
  for (const b of buckets.values()) {
    if (b.parentId && !buckets.has(b.parentId)) b.parentId = null;
  }
  // break cycles or over-depth chains
  for (const b of buckets.values()) {
    let p = b.parentId;
    const seen = new Set([b.id]);
    let steps = 0;
    while (p) {
      if (seen.has(p) || steps > 1000) { b.parentId = null; break; }
      seen.add(p);
      p = buckets.get(p)?.parentId;
      steps++;
    }
  }
  // enforce max nesting depth
  for (const b of buckets.values()) {
    while (depthOf(b.id) > MAX_NEST_DEPTH) b.parentId = null;
  }
}

function exportJSON() {
  const data = serializeState();
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `obelisk-${new Date().toISOString().slice(0, 10)}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 0);
}

// ============================================================
// Auto-save to a user-picked JSON file (File System Access API)
// ============================================================
const AUTOSAVE_DEBOUNCE_MS = 600;
const AUTOSAVE_DB = 'obelisk-fs';
const AUTOSAVE_KEY = 'autosaveHandle';
let autosaveHandle = null;
let autosaveTimer = null;
let autosaveInFlight = false;
let autosavePending = false;
let autosaveState = 'off'; // 'off' | 'active' | 'paused' | 'error'
let autosaveLastAt = null;
let autosaveError = null;

const autosaveBtn = document.getElementById('autosave-btn');
const autosaveSupported = typeof window.showSaveFilePicker === 'function';

function openHandleDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(AUTOSAVE_DB, 1);
    req.onupgradeneeded = () => req.result.createObjectStore('handles');
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function storeHandle(handle) {
  try {
    const db = await openHandleDB();
    await new Promise((res, rej) => {
      const tx = db.transaction('handles', 'readwrite');
      tx.objectStore('handles').put(handle, AUTOSAVE_KEY);
      tx.oncomplete = () => res();
      tx.onerror = () => rej(tx.error);
    });
  } catch (e) { /* non-fatal */ }
}
async function loadStoredHandle() {
  try {
    const db = await openHandleDB();
    return await new Promise((res) => {
      const tx = db.transaction('handles', 'readonly');
      const req = tx.objectStore('handles').get(AUTOSAVE_KEY);
      req.onsuccess = () => res(req.result || null);
      req.onerror = () => res(null);
    });
  } catch (e) { return null; }
}
async function clearStoredHandle() {
  try {
    const db = await openHandleDB();
    await new Promise((res) => {
      const tx = db.transaction('handles', 'readwrite');
      tx.objectStore('handles').delete(AUTOSAVE_KEY);
      tx.oncomplete = () => res();
      tx.onerror = () => res();
    });
  } catch (e) { /* non-fatal */ }
}

function fmtRelative(date) {
  if (!date) return '';
  const sec = Math.max(0, Math.floor((Date.now() - date.getTime()) / 1000));
  if (sec < 5) return 'just now';
  if (sec < 60) return `${sec}s ago`;
  const min = Math.floor(sec / 60);
  if (min < 60) return `${min}m ago`;
  const hr = Math.floor(min / 60);
  return `${hr}h ago`;
}

function updateAutosaveUI() {
  if (!autosaveBtn) return;
  autosaveBtn.classList.remove('active', 'paused', 'error');
  if (!autosaveSupported) {
    autosaveBtn.textContent = 'Auto-save (unsupported)';
    autosaveBtn.title = 'Your browser does not support the File System Access API. Use Chrome, Edge, or another Chromium browser.';
    autosaveBtn.disabled = true;
    return;
  }
  const name = autosaveHandle ? (autosaveHandle.name || 'file.json') : null;
  if (autosaveState === 'active') {
    autosaveBtn.classList.add('active');
    autosaveBtn.textContent = `● Auto-save: ${name}`;
    autosaveBtn.title = `Auto-saving to ${name}` + (autosaveLastAt ? ` — last saved ${fmtRelative(autosaveLastAt)}` : '') + '. Click to stop.';
  } else if (autosaveState === 'paused') {
    autosaveBtn.classList.add('paused');
    autosaveBtn.textContent = `Resume auto-save: ${name}`;
    autosaveBtn.title = `Auto-save was paused (permission lapsed after reload). Click to resume writing to ${name}.`;
  } else if (autosaveState === 'error') {
    autosaveBtn.classList.add('error');
    autosaveBtn.textContent = `Auto-save error: ${name || ''}`;
    autosaveBtn.title = `Last write failed: ${autosaveError || 'unknown error'}. Click to retry or pick a new file.`;
  } else {
    autosaveBtn.textContent = 'Auto-save';
    autosaveBtn.title = 'Pick a JSON file on disk and keep it in sync automatically.';
  }
}
// keep the relative time label fresh while auto-save is on
setInterval(() => { if (autosaveState === 'active' && autosaveLastAt) updateAutosaveUI(); }, 10000);

async function ensurePermission(handle, mode = 'readwrite') {
  try {
    const opts = { mode };
    const q = await handle.queryPermission(opts);
    if (q === 'granted') return true;
    const r = await handle.requestPermission(opts);
    return r === 'granted';
  } catch (e) { return false; }
}

async function writeAutosaveNow() {
  if (!autosaveHandle) return;
  if (autosaveInFlight) { autosavePending = true; return; }
  autosaveInFlight = true;
  try {
    const granted = await ensurePermission(autosaveHandle).catch(() => false);
    if (!granted) {
      autosaveState = 'paused';
      updateAutosaveUI();
      return;
    }
    const writable = await autosaveHandle.createWritable();
    await writable.write(JSON.stringify(serializeState(), null, 2));
    await writable.close();
    autosaveLastAt = new Date();
    autosaveError = null;
    autosaveState = 'active';
    updateAutosaveUI();
  } catch (e) {
    autosaveError = e?.message || String(e);
    autosaveState = 'error';
    updateAutosaveUI();
  } finally {
    autosaveInFlight = false;
    if (autosavePending) {
      autosavePending = false;
      writeAutosaveNow();
    }
  }
}

function scheduleAutosave() {
  if (!autosaveHandle || autosaveState === 'paused') return;
  clearTimeout(autosaveTimer);
  autosaveTimer = setTimeout(writeAutosaveNow, AUTOSAVE_DEBOUNCE_MS);
}

async function startAutosave() {
  if (!autosaveSupported) return;
  try {
    const handle = await window.showSaveFilePicker({
      suggestedName: `obelisk-${new Date().toISOString().slice(0, 10)}.json`,
      types: [{ description: 'Obelisk JSON', accept: { 'application/json': ['.json'] } }],
    });
    autosaveHandle = handle;
    autosaveState = 'active';
    autosaveError = null;
    await storeHandle(handle);
    await writeAutosaveNow();
  } catch (e) {
    if (e?.name !== 'AbortError') {
      autosaveError = e?.message || String(e);
      autosaveState = 'error';
      updateAutosaveUI();
    }
  }
}

async function stopAutosave() {
  clearTimeout(autosaveTimer);
  autosaveHandle = null;
  autosaveState = 'off';
  autosaveError = null;
  autosaveLastAt = null;
  await clearStoredHandle();
  updateAutosaveUI();
}

async function resumeAutosave() {
  if (!autosaveHandle) return;
  const granted = await ensurePermission(autosaveHandle).catch(() => false);
  if (!granted) {
    autosaveState = 'paused';
    updateAutosaveUI();
    return;
  }
  autosaveState = 'active';
  await writeAutosaveNow();
}

async function restoreAutosaveOnLoad() {
  if (!autosaveSupported) { updateAutosaveUI(); return; }
  const stored = await loadStoredHandle();
  if (!stored) { updateAutosaveUI(); return; }
  autosaveHandle = stored;
  // Don't request permission here (no user gesture). Just show the paused state.
  // Some browsers retain permission across reloads — if so, switch to active silently.
  try {
    const q = await stored.queryPermission({ mode: 'readwrite' });
    autosaveState = (q === 'granted') ? 'active' : 'paused';
  } catch (e) {
    autosaveState = 'paused';
  }
  updateAutosaveUI();
  // If the browser remembered permission, write the current state now so the on-disk file matches.
  if (autosaveState === 'active') writeAutosaveNow();
}

if (autosaveBtn) {
  autosaveBtn.addEventListener('click', async () => {
    if (!autosaveSupported) return;
    if (autosaveState === 'off') return startAutosave();
    if (autosaveState === 'paused') return resumeAutosave();
    if (autosaveState === 'error') {
      if (autosaveHandle) return writeAutosaveNow();
      return startAutosave();
    }
    // active → ask to stop
    if (confirm(`Stop auto-saving to ${autosaveHandle?.name || 'this file'}?`)) stopAutosave();
  });
}

function applyStateData(data) {
  clearAll();
  for (const r of (data.regions || [])) {
    if (!r || !Array.isArray(r.position)) continue;
    const world = WORLDS.includes(r.world) ? r.world : 'main';
    const pal = regionPaletteForWorld(world);
    const region = {
      id: r.id || crypto.randomUUID(),
      name: r.name || 'Region',
      position: [r.position[0] || 0, 0, r.position[2] || 0],
      width: r.width || REGION_DEFAULT_W,
      depth: r.depth || REGION_DEFAULT_D,
      color: r.color || pal[regions.size % pal.length],
      world,
    };
    scene.add(createRegionObjects(region));
    regions.set(region.id, region);
  }
  for (const b of (data.buckets || [])) {
    if (!b || !Array.isArray(b.position)) continue;
    const radius = b.radius || BUCKET_DEFAULT_RADIUS;
    const baseRadius = b.baseRadius || radius;
    const regionId = (b.regionId && regions.has(b.regionId)) ? b.regionId : null;
    const world = WORLDS.includes(b.world) ? b.world : 'main';
    const pal = bucketPaletteForWorld(world);
    const bucket = {
      id: b.id || crypto.randomUUID(),
      name: b.name || 'Bucket',
      position: [b.position[0] || 0, 0, b.position[2] || 0],
      baseRadius, radius,
      color: b.color || pal[buckets.size % pal.length],
      parentId: b.parentId || null,
      regionId,
      world,
    };
    scene.add(createBucketObjects(bucket));
    buckets.set(bucket.id, bucket);
  }
  validateBucketParents();
  for (const b of buckets.values()) if (b.parentId) b.regionId = null;
  for (const b of (data.badges || [])) {
    if (!b || !b.id) continue;
    const world = WORLDS.includes(b.world) ? b.world : 'main';
    const pal = badgePaletteForWorld(world);
    badges.set(b.id, {
      id: b.id,
      label: String(b.label || 'Badge').slice(0, BADGE_MAX_LABEL),
      color: b.color || pal[badges.size % pal.length],
      world,
    });
  }
  for (const c of (data.cards || [])) {
    if (!c || !Array.isArray(c.position)) continue;
    const pos = [c.position[0] || 0, CARD_ALTITUDE, c.position[2] || 0];
    const bucketId = (c.bucketId && buckets.has(c.bucketId)) ? c.bucketId : null;
    const regionId = (!bucketId && c.regionId && regions.has(c.regionId)) ? c.regionId : null;
    const badgeIds = Array.isArray(c.badgeIds) ? c.badgeIds.filter(id => badges.has(id)) : [];
    const accomplishmentIds = Array.isArray(c.accomplishmentIds) ? c.accomplishmentIds : [];
    const priority = (typeof c.priority === 'number' && c.priority >= 0 && c.priority <= 4) ? Math.floor(c.priority) : 0;
    const dueAt = (typeof c.dueAt === 'string') ? c.dueAt : null;
    const world = WORLDS.includes(c.world) ? c.world : 'main';
    const card = { id: c.id || crypto.randomUUID(), title: c.title || '', description: c.description || '', position: pos, bucketId, regionId, badgeIds, accomplishmentIds, priority, dueAt, world };
    scene.add(createCardMesh(card));
    cards.set(card.id, card);
  }
  for (const c of cards.values()) {
    if (c.world !== 'main') c.accomplishmentIds = [];
    else c.accomplishmentIds = (c.accomplishmentIds || []).filter(id => cards.has(id) && cards.get(id).world === 'accomplishments');
  }
  for (const t of (data.things || [])) {
    if (!t || !Array.isArray(t.position)) continue;
    const cardId = (t.cardId && cards.has(t.cardId)) ? t.cardId : null;
    const world = WORLDS.includes(t.world) ? t.world : 'main';
    const thing = {
      id: t.id || crypto.randomUUID(),
      title: t.title || '',
      description: t.description || '',
      type: THING_TYPES[t.type] ? t.type : 'person',
      position: [t.position[0] || 0, CARD_ALTITUDE, t.position[2] || 0],
      cardId,
      world,
    };
    scene.add(createThingMesh(thing));
    things.set(thing.id, thing);
  }
  for (const c of cards.values()) layoutThingsAroundCard(c);
  if (WORLDS.includes(data.currentWorld)) currentWorld = data.currentWorld;
  // restore view + color modes
  if (data.currentColorMode && COLOR_MODES.includes(data.currentColorMode)) currentColorMode = data.currentColorMode;
  if (data.currentViewMode && typeof data.currentViewMode === 'object') {
    for (const w of WORLDS) {
      if (VIEW_MODES.includes(data.currentViewMode[w])) viewModeByWorld[w] = data.currentViewMode[w];
    }
  }
  refreshAll();
  refreshAllRegions();
  applyTheme();
  applyWorldVisibility();
  updateWorldToggleUI();
  updatePalette();
  // if loaded view mode is not manual, snapshot current positions as the manual layout (best-guess) then apply view
  if (currentViewMode() !== 'manual') {
    snapshotManualLayout();
    applyCurrentView();
  }
  updateViewModeUI();
  updateColorModeUI();
  renderSidebar();
}

function clearAll() {
  for (const t of things.values()) {
    scene.remove(t.mesh);
    t.mesh.geometry.dispose();
    t.mesh.material.map?.dispose();
    t.mesh.material.dispose();
  }
  things.clear();
  for (const c of cards.values()) {
    scene.remove(c.mesh);
    c.mesh.geometry.dispose();
    c.mesh.material.map?.dispose();
    c.mesh.material.dispose();
  }
  cards.clear();
  for (const b of buckets.values()) {
    scene.remove(b.group);
    b.wall.geometry.dispose();
    b.wallMat.dispose();
    b.ring.geometry.dispose();
    b.ringMat.dispose();
    b.label.geometry.dispose();
    b.labelMat.dispose();
    b.labelTexture.dispose();
  }
  buckets.clear();
  for (const r of regions.values()) {
    scene.remove(r.group);
    r.wall.geometry.dispose();
    r.wallMat.dispose();
    disposeRegionFrame(r);
    r.label.geometry.dispose();
    r.labelMat.dispose();
    r.labelTexture.dispose();
  }
  regions.clear();
  badges.clear();
  selection = null;
  if (typeof boxSelection !== 'undefined') boxSelection.clear();
  hoveredBucketId = null;
  pushedBucketId = null;
  hoveredRegionId = null;
  hoveredCardId = null;
  updatePalette();
}

async function importJSON(file) {
  let text;
  try { text = await file.text(); } catch (e) { alert('Could not read file: ' + e.message); return; }
  let data;
  try { data = JSON.parse(text); } catch (e) { alert('File is not valid JSON: ' + e.message); return; }
  if (!data || (!Array.isArray(data.cards) && !Array.isArray(data.buckets) && !Array.isArray(data.things) && !Array.isArray(data.regions) && !Array.isArray(data.badges))) {
    alert('JSON is missing "cards", "buckets", "regions", "badges", and "things" arrays.');
    return;
  }
  const incoming = (data.cards?.length || 0) + (data.buckets?.length || 0) + (data.things?.length || 0) + (data.regions?.length || 0) + (data.badges?.length || 0);
  const existing = cards.size + buckets.size + things.size + regions.size + badges.size;
  if (existing > 0) {
    const msg = `Replace current state (${existing} item${existing !== 1 ? 's' : ''}) with ${incoming} item${incoming !== 1 ? 's' : ''} from the file?`;
    if (!confirm(msg)) return;
  }
  applyStateData(data);
  save();
}

document.getElementById('save-json-btn').addEventListener('click', exportJSON);
document.getElementById('load-json-btn').addEventListener('click', () => {
  document.getElementById('load-json-input').click();
});
document.getElementById('load-json-input').addEventListener('change', (ev) => {
  const file = ev.target.files?.[0];
  if (file) importJSON(file);
  ev.target.value = '';
});

restoreAutosaveOnLoad();

// ============================================================
// Resize & render loop
// ============================================================
function resize() {
  const w = container.clientWidth;
  const h = container.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
resize();

let lastFrameTime = performance.now();
function animate() {
  requestAnimationFrame(animate);
  const now = performance.now();
  const dt = Math.min((now - lastFrameTime) / 1000, 0.1);
  lastFrameTime = now;
  if (fpsMode) updateFPS(dt);
  else controls.update();
  updateTweens(now);
  billboardAll();
  renderer.render(scene, camera);
}
animate();
</script>
