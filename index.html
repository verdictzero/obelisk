<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Obelisk</title>
<style>
  :root {
    --bg: #0e1116;
    --panel: #161b22;
    --panel-2: #1f262f;
    --border: #2a313c;
    --text: #e6edf3;
    --muted: #8b949e;
    --accent: #4f8cff;
    --accent-2: #79b8ff;
    --danger: #f85149;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 14px;
  }
  #canvas-container { position: fixed; left: 0; top: 0; right: 340px; bottom: 130px; }
  #canvas-container canvas { display: block; }

  #palette {
    position: fixed; bottom: 0; left: 0; right: 340px; height: 130px;
    background: var(--panel); border-top: 1px solid var(--border);
    display: flex; flex-direction: column; z-index: 5;
  }
  #palette-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 14px; border-bottom: 1px solid var(--border);
  }
  #palette-header h2 {
    margin: 0; font-size: 12px; font-weight: 600; letter-spacing: 0.06em;
    text-transform: uppercase; color: var(--muted);
  }
  #palette-strip {
    flex: 1; overflow-x: auto; overflow-y: hidden;
    display: flex; gap: 8px; padding: 10px 14px;
    align-items: center;
  }
  .thing-chip {
    flex: 0 0 auto;
    display: flex; align-items: center; gap: 8px;
    background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 8px; padding: 8px 12px;
    font-size: 13px; cursor: grab;
    user-select: none;
    max-width: 180px;
    white-space: nowrap;
    touch-action: none;
  }
  .thing-chip:hover { border-color: var(--accent); }
  .thing-chip:active { cursor: grabbing; }
  .thing-chip.active { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .thing-chip.attached { opacity: 0.7; }
  .thing-chip .icon { width: 14px; height: 14px; flex-shrink: 0; }
  .thing-chip .icon.circle { border-radius: 50%; }
  .thing-chip .icon.hexagon { clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%); }
  .thing-chip .label { overflow: hidden; text-overflow: ellipsis; max-width: 140px; }
  .palette-empty { color: var(--muted); font-style: italic; padding: 0 8px; }

  #sidebar {
    position: fixed; right: 0; top: 0; width: 340px; height: 100%;
    background: var(--panel); border-left: 1px solid var(--border);
    display: flex; flex-direction: column;
  }
  #sidebar header {
    padding: 14px 16px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
  }
  #sidebar header h1 {
    margin: 0; font-size: 14px; font-weight: 600; letter-spacing: 0.04em;
    text-transform: uppercase; color: var(--muted);
  }
  #sidebar .body { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
  #sidebar .empty { color: var(--muted); font-style: italic; padding-top: 40px; text-align: center; }
  #sidebar label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
  #sidebar input, #sidebar textarea {
    width: 100%; background: var(--panel-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px;
    padding: 8px 10px; font: inherit; font-size: 14px; resize: vertical;
  }
  #sidebar input:focus, #sidebar textarea:focus { outline: none; border-color: var(--accent); }
  #sidebar textarea { min-height: 200px; }
  #sidebar .meta { font-size: 11px; color: var(--muted); }
  #sidebar footer {
    padding: 12px 16px; border-top: 1px solid var(--border);
    display: flex; gap: 8px;
  }
  button {
    background: var(--panel-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px;
    padding: 7px 12px; font: inherit; font-size: 13px; cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: white; }
  button.primary:hover { background: var(--accent-2); border-color: var(--accent-2); }
  button.danger { color: var(--danger); }
  button.danger:hover { border-color: var(--danger); }
  button:disabled { opacity: 0.4; cursor: not-allowed; }

  button#autosave-btn { max-width: 240px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  button#autosave-btn.active { background: #2da44e; border-color: #2da44e; color: white; }
  button#autosave-btn.active:hover { background: #3fb461; border-color: #3fb461; }
  button#autosave-btn.paused { border-color: #f7b955; color: #f7b955; }
  button#autosave-btn.paused:hover { background: rgba(247,185,85,0.1); }
  button#autosave-btn.error { border-color: var(--danger); color: var(--danger); }

  button#world-toggle-btn.accomplishments {
    background: linear-gradient(180deg, #5a4118, #2a1f08);
    border-color: #d4a017; color: #ffd700;
  }
  button#world-toggle-btn.accomplishments:hover { border-color: #ffd700; background: linear-gradient(180deg, #6a4f1a, #3a2810); }

  .box-select-overlay {
    position: fixed; pointer-events: none; z-index: 8;
    border: 1px solid var(--accent);
    background: rgba(79, 140, 255, 0.12);
    display: none;
  }
  .dropdown-menu {
    position: fixed; z-index: 30;
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
    padding: 6px; min-width: 260px;
    display: none; flex-direction: column; gap: 2px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  }
  .dropdown-menu .item {
    padding: 8px 12px; border-radius: 4px; cursor: pointer;
    display: flex; justify-content: space-between; gap: 12px;
    font-size: 13px;
  }
  .dropdown-menu .item:hover { background: var(--panel-2); }
  .dropdown-menu .item .meta { color: var(--muted); font-size: 11px; }
  .dropdown-menu .empty { color: var(--muted); padding: 10px 12px; font-style: italic; font-size: 12px; }
  .selection-summary {
    display: flex; flex-direction: column; gap: 6px;
    padding: 12px; border: 1px dashed var(--border); border-radius: 8px;
    background: rgba(79,140,255,0.04);
  }
  .selection-summary .counts {
    display: flex; flex-wrap: wrap; gap: 6px; font-size: 12px;
  }
  .selection-summary .count-chip {
    background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 999px; padding: 2px 10px; color: var(--muted);
  }
  .selection-summary .list {
    max-height: 200px; overflow-y: auto;
    display: flex; flex-direction: column; gap: 3px;
  }
  .selection-summary .row {
    font-size: 12px; padding: 4px 6px; border-radius: 4px;
    cursor: pointer; display: flex; gap: 8px; align-items: center;
    color: var(--muted);
  }
  .selection-summary .row:hover { background: var(--panel-2); color: var(--text); }
  .selection-summary .row .type { font-size: 10px; text-transform: uppercase; opacity: 0.7; min-width: 50px; }

  .swatches { display: flex; gap: 6px; flex-wrap: wrap; }
  .swatch {
    width: 22px; height: 22px; border-radius: 50%;
    border: 2px solid transparent; cursor: pointer;
    transition: transform 80ms ease;
  }
  .swatch:hover { transform: scale(1.1); }
  .swatch.active { border-color: var(--text); }

  .bucket-pill {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 999px; padding: 3px 10px 3px 6px;
    font-size: 12px; cursor: pointer;
  }
  .bucket-pill .dot { width: 10px; height: 10px; border-radius: 50%; }
  .bucket-pill:hover { border-color: var(--accent); }

  .badge-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .badge-chip {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 3px 4px 3px 10px; border-radius: 999px;
    font-size: 12px; font-weight: 600; color: #fff;
    user-select: none; line-height: 1.4;
  }
  .badge-chip.subtle {
    background: var(--panel-2); border: 1px solid var(--border); color: var(--text);
    padding: 3px 4px 3px 6px; cursor: pointer; font-weight: 500;
  }
  .badge-chip.subtle:hover { border-color: var(--accent); }
  .badge-chip .dot { width: 10px; height: 10px; border-radius: 50%; }
  .badge-chip .x {
    display: inline-flex; align-items: center; justify-content: center;
    width: 16px; height: 16px; border-radius: 50%;
    background: rgba(0,0,0,0.28); color: #fff;
    font-size: 12px; line-height: 1; cursor: pointer;
  }
  .badge-chip.subtle .x { background: rgba(255,255,255,0.08); color: var(--muted); }
  .badge-chip .x:hover { background: rgba(0,0,0,0.5); }
  .badge-chip.subtle .x:hover { background: rgba(248,81,73,0.25); color: var(--danger); }
  .badge-form {
    display: none; flex-direction: column; gap: 6px;
    padding: 10px; border: 1px solid var(--border); border-radius: 6px;
    margin-top: 4px;
  }

  #toolbar {
    position: fixed; top: 12px; left: 12px; z-index: 10;
    display: flex; gap: 6px;
    background: rgba(22,27,34,0.85); backdrop-filter: blur(8px);
    border: 1px solid var(--border); border-radius: 8px; padding: 6px;
  }
  #status {
    position: fixed; bottom: 140px; left: 12px; z-index: 10;
    color: var(--muted); font-size: 11px;
    background: rgba(22,27,34,0.7); backdrop-filter: blur(8px);
    border: 1px solid var(--border); border-radius: 6px;
    padding: 4px 8px;
    pointer-events: none;
  }
  kbd {
    background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 3px; padding: 1px 4px; font-size: 10px;
    font-family: ui-monospace, monospace;
  }
</style>
</head>
<body>
  <div id="canvas-container"></div>
  <div id="box-select-overlay" class="box-select-overlay"></div>
  <div id="restore-menu" class="dropdown-menu"></div>
  <div id="view-menu" class="dropdown-menu"></div>
  <div id="color-menu" class="dropdown-menu"></div>

  <div id="toolbar">
    <button id="world-toggle-btn" title="Switch between Main and Accomplishments worlds">World: Main</button>
    <button id="view-mode-btn" title="Auto-group items by priority, due date, or person (Manual = your manual arrangement)">View: Manual ▾</button>
    <button id="color-mode-btn" title="Override rendering colors (per-item colors are preserved)">Colors: Default ▾</button>
    <button id="add-card-btn" class="primary">+ Card</button>
    <button id="add-bucket-btn">+ Bucket</button>
    <button id="add-region-btn">+ Region</button>
    <button id="focus-btn" title="Frame selected">Focus</button>
    <button id="reset-view-btn" title="Reset camera">Reset view</button>
    <button id="save-json-btn" title="Download current state as JSON">Save .json</button>
    <button id="load-json-btn" title="Replace current state with a JSON file">Load .json</button>
    <button id="autosave-btn" title="Pick a JSON file on disk and keep it in sync automatically">Auto-save</button>
    <button id="restore-btn" title="Restore from an automatic backup of a previous state">Restore ▾</button>
    <button id="undo-btn" title="Undo (Ctrl+Z)">↶</button>
    <button id="redo-btn" title="Redo (Ctrl+Y / Ctrl+Shift+Z)">↷</button>
    <input type="file" id="load-json-input" accept=".json,application/json" style="display:none;" />
  </div>

  <div id="status">
    <kbd>L-drag</kbd> orbit · <kbd>M-drag</kbd> pan · <kbd>scroll</kbd> zoom · <kbd>R-hold + WASD</kbd> fly · <kbd>click</kbd> select · <kbd>shift+drag</kbd> move · <kbd>ctrl+drag</kbd> box-select · <kbd>del</kbd> delete · <kbd>ctrl+z/y</kbd> undo/redo
  </div>

  <div id="palette">
    <div id="palette-header">
      <h2>Things</h2>
      <button id="add-thing-btn" class="primary">+ Thing</button>
    </div>
    <div id="palette-strip"></div>
  </div>

  <aside id="sidebar">
    <header>
      <h1 id="sidebar-title">Selection</h1>
    </header>
    <div class="body" id="sidebar-body">
      <div class="empty">Nothing selected.<br/>Click a card, bucket, or region to edit it.</div>
    </div>
    <footer id="sidebar-footer" style="display:none;">
      <button id="delete-btn" class="danger">Delete</button>
    </footer>
  </aside>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ============================================================
// Scene / camera / renderer
// ============================================================
const container = document.getElementById('canvas-container');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0e1116);
scene.fog = new THREE.Fog(0x0e1116, 60, 240);

const camera = new THREE.PerspectiveCamera(55, 1, 0.1, 5000);
const DEFAULT_CAM_POS = new THREE.Vector3(8, 8, 14);
const DEFAULT_CAM_TARGET = new THREE.Vector3(0, 1.5, 0);
camera.position.copy(DEFAULT_CAM_POS);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
container.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.target.copy(DEFAULT_CAM_TARGET);
controls.screenSpacePanning = true;
controls.mouseButtons = {
  LEFT: THREE.MOUSE.ROTATE,
  MIDDLE: THREE.MOUSE.PAN,
  RIGHT: null, // reserved for FPS-fly (see FPS navigation section)
};

const ambientLight = new THREE.AmbientLight(0xffffff, 0.9);
scene.add(ambientLight);
const sun = new THREE.DirectionalLight(0xffffff, 0.4);
sun.position.set(10, 20, 10);
scene.add(sun);

// ============================================================
// Accomplishments world scene props (floor + skydome) — hidden by default
// ============================================================
const accomplishmentFloorGeo = new THREE.PlaneGeometry(2000, 2000);
accomplishmentFloorGeo.rotateX(-Math.PI / 2);
const accomplishmentFloorMat = new THREE.MeshStandardMaterial({
  color: 0x1a1208,
  roughness: 0.92,
  metalness: 0.08,
});
const accomplishmentFloor = new THREE.Mesh(accomplishmentFloorGeo, accomplishmentFloorMat);
accomplishmentFloor.position.y = -0.05;
accomplishmentFloor.renderOrder = -3;
accomplishmentFloor.visible = false;
scene.add(accomplishmentFloor);

const accomplishmentSkyGeo = new THREE.SphereGeometry(900, 32, 16);
const accomplishmentSkyMat = new THREE.ShaderMaterial({
  uniforms: {
    uHorizon: { value: new THREE.Color(0xffb84d) },
    uSky: { value: new THREE.Color(0x0a0703) },
    uGround: { value: new THREE.Color(0x1a1208) },
  },
  vertexShader: `
    varying vec3 vWorldDir;
    void main() {
      vWorldDir = normalize((modelMatrix * vec4(position, 0.0)).xyz);
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    precision highp float;
    varying vec3 vWorldDir;
    uniform vec3 uHorizon;
    uniform vec3 uSky;
    uniform vec3 uGround;
    void main() {
      float h = vWorldDir.y;
      // glow concentrated near horizon (h ~ 0)
      float horizonGlow = exp(-abs(h) * 6.0);
      // gradient: ground below, sky above
      vec3 base = (h < 0.0) ? mix(uGround, uHorizon, smoothstep(-0.3, 0.0, h))
                            : mix(uHorizon, uSky, smoothstep(0.0, 0.5, h));
      vec3 col = base + uHorizon * horizonGlow * 0.6;
      gl_FragColor = vec4(col, 1.0);
    }
  `,
  side: THREE.BackSide,
  depthWrite: false,
});
const accomplishmentSky = new THREE.Mesh(accomplishmentSkyGeo, accomplishmentSkyMat);
accomplishmentSky.renderOrder = -10;
accomplishmentSky.visible = false;
scene.add(accomplishmentSky);

// ============================================================
// Infinite ground grid (shader on a large plane)
// ============================================================
const gridGeo = new THREE.PlaneGeometry(2000, 2000);
gridGeo.rotateX(-Math.PI / 2);
const gridMat = new THREE.ShaderMaterial({
  transparent: true,
  side: THREE.DoubleSide,
  uniforms: {
    uMinor: { value: new THREE.Color(0x1c2330) },
    uMajor: { value: new THREE.Color(0x2c3a52) },
    uAxisX: { value: new THREE.Color(0x6b3a3a) },
    uAxisZ: { value: new THREE.Color(0x3a5a6b) },
    uMinorStep: { value: 1.0 },
    uMajorStep: { value: 10.0 },
    uFadeNear: { value: 30.0 },
    uFadeFar: { value: 200.0 },
  },
  vertexShader: `
    varying vec3 vWorld;
    void main() {
      vec4 wp = modelMatrix * vec4(position, 1.0);
      vWorld = wp.xyz;
      gl_Position = projectionMatrix * viewMatrix * wp;
    }
  `,
  fragmentShader: `
    precision highp float;
    varying vec3 vWorld;
    uniform vec3 uMinor, uMajor, uAxisX, uAxisZ;
    uniform float uMinorStep, uMajorStep, uFadeNear, uFadeFar;

    float gridLine(vec2 p, float step) {
      vec2 g = abs(fract(p / step - 0.5) - 0.5) / fwidth(p / step);
      float l = min(g.x, g.y);
      return 1.0 - min(l, 1.0);
    }
    float axisLine(float c) {
      float w = fwidth(c);
      return 1.0 - smoothstep(0.0, w * 1.5, abs(c));
    }
    void main() {
      vec2 p = vWorld.xz;
      float minor = gridLine(p, uMinorStep);
      float major = gridLine(p, uMajorStep);
      float ax2 = axisLine(vWorld.z);
      float az2 = axisLine(vWorld.x);

      vec3 col = uMinor * minor;
      col = mix(col, uMajor, major);
      col = mix(col, uAxisX, ax2 * 0.9);
      col = mix(col, uAxisZ, az2 * 0.9);

      float alpha = max(max(minor * 0.5, major), max(ax2, az2));
      float dist = length(vWorld.xz - cameraPosition.xz);
      float fade = 1.0 - smoothstep(uFadeNear, uFadeFar, dist);
      alpha *= fade;

      if (alpha < 0.005) discard;
      gl_FragColor = vec4(col, alpha);
    }
  `,
});
const grid = new THREE.Mesh(gridGeo, gridMat);
grid.renderOrder = -2;
scene.add(grid);

// ============================================================
// Worlds (Main + Accomplishments) — theme + state
// ============================================================
let currentWorld = 'main';
const WORLDS = ['main', 'accomplishments'];
const WORLD_LABELS = { main: 'Main', accomplishments: 'Accomplishments' };

const WORLD_THEMES = {
  main: {
    background: 0x0e1116,
    fog: { color: 0x0e1116, near: 60, far: 240 },
    grid: { minor: 0x1c2330, major: 0x2c3a52, axisX: 0x6b3a3a, axisZ: 0x3a5a6b },
    ambient: { color: 0xffffff, intensity: 0.9 },
    sun: { color: 0xffffff, intensity: 0.4 },
    card: {
      bg: '#161b22', bgSelected: '#1d2a44',
      border: '#2a313c', borderSelected: '#79b8ff',
      text: '#e6edf3', accent: '#3a4658', accentSelected: '#4f8cff',
    },
    bucketPalette: ['#4f8cff', '#ff6b9d', '#7ad9a8', '#f7b955', '#b794f4', '#5cd4f0', '#ff8a65'],
    regionPalette: ['#5a6878', '#785a68', '#5a7868', '#78685a', '#685a78', '#687858', '#785a5a'],
    badgePalette: ['#f85149', '#f7b955', '#7ad9a8', '#79b8ff', '#b794f4', '#5cd4f0', '#ff6b9d', '#8b949e'],
    thingTypes: {
      person: { label: 'Person', color: '#4f8cff', shape: 'circle' },
      system: { label: 'System', color: '#f7b955', shape: 'square' },
      object: { label: 'Object', color: '#7ad9a8', shape: 'hexagon' },
    },
  },
  accomplishments: {
    background: 0x0a0703,
    fog: { color: 0x3a2208, near: 40, far: 200 },
    grid: { minor: 0x4a3818, major: 0xd4a017, axisX: 0xffd700, axisZ: 0xffd700 },
    ambient: { color: 0xffe4a0, intensity: 0.55 },
    sun: { color: 0xffd87a, intensity: 1.3 },
    card: {
      bg: '#1a1408', bgSelected: '#3a2a08',
      border: '#5a3a08', borderSelected: '#ffd700',
      text: '#ffd87a', accent: '#7a5a18', accentSelected: '#ffb84d',
    },
    bucketPalette: ['#d4a017', '#b8860b', '#ffb84d', '#daa520', '#e6b800', '#f0c419', '#c8a008'],
    regionPalette: ['#5a4a18', '#6a5818', '#785a18', '#4a3a08', '#7a5a08', '#8a6a18', '#9a7a28'],
    badgePalette: ['#ffd700', '#ffb84d', '#d4a017', '#daa520', '#b8860b', '#ff8c00', '#cd9b1d', '#e6c200'],
    thingTypes: {
      person: { label: 'Person', color: '#ffd700', shape: 'circle' },
      system: { label: 'System', color: '#daa520', shape: 'square' },
      object: { label: 'Object', color: '#ffb84d', shape: 'hexagon' },
    },
  },
};

function getThemeFor(world) { return WORLD_THEMES[world] || WORLD_THEMES.main; }
function theme() { return getThemeFor(currentWorld); }
function bucketPaletteForWorld(world) { return getThemeFor(world).bucketPalette; }
function regionPaletteForWorld(world) { return getThemeFor(world).regionPalette; }
function badgePaletteForWorld(world) { return getThemeFor(world).badgePalette; }
function thingTypesForWorld(world) { return getThemeFor(world).thingTypes; }

function applyTheme() {
  const t = theme();
  scene.background = new THREE.Color(t.background);
  scene.fog.color.set(t.fog.color);
  scene.fog.near = t.fog.near;
  scene.fog.far = t.fog.far;
  gridMat.uniforms.uMinor.value.set(t.grid.minor);
  gridMat.uniforms.uMajor.value.set(t.grid.major);
  gridMat.uniforms.uAxisX.value.set(t.grid.axisX);
  gridMat.uniforms.uAxisZ.value.set(t.grid.axisZ);
  gridMat.uniforms.uFadeFar.value = t.fog.far - 40;
  ambientLight.color.set(t.ambient.color);
  ambientLight.intensity = t.ambient.intensity;
  sun.color.set(t.sun.color);
  sun.intensity = t.sun.intensity;
  const isAcc = currentWorld === 'accomplishments';
  accomplishmentFloor.visible = isAcc;
  accomplishmentSky.visible = isAcc;
}

function applyWorldVisibility() {
  for (const c of cards.values()) if (c.mesh) c.mesh.visible = (c.world === currentWorld);
  for (const b of buckets.values()) if (b.group) b.group.visible = (b.world === currentWorld);
  for (const r of regions.values()) if (r.group) r.group.visible = (r.world === currentWorld);
  for (const t of things.values()) if (t.mesh) t.mesh.visible = (t.world === currentWorld);
}

function setWorld(world) {
  if (!WORLDS.includes(world) || world === currentWorld) return;
  // dispose any super-regions/clones from the leaving world
  disposeSuperRegions();
  disposeViewClones();
  currentWorld = world;
  applyTheme();
  applyWorldVisibility();
  // apply the view mode for the new world
  applyCurrentView();
  updateViewModeUI();
  // clear selection if it's in a different world
  if (selection) {
    let item = null;
    if (selection.type === 'card') item = cards.get(selection.id);
    else if (selection.type === 'bucket') item = buckets.get(selection.id);
    else if (selection.type === 'region') item = regions.get(selection.id);
    else if (selection.type === 'thing') item = things.get(selection.id);
    if (!item || item.world !== currentWorld) select(null);
  }
  // refresh hover state — anything hovered in the old world should clear
  if (hoveredBucketId && buckets.get(hoveredBucketId)?.world !== currentWorld) hoveredBucketId = null;
  if (hoveredRegionId && regions.get(hoveredRegionId)?.world !== currentWorld) hoveredRegionId = null;
  if (hoveredCardId && cards.get(hoveredCardId)?.world !== currentWorld) hoveredCardId = null;
  updateWorldToggleUI();
  updatePalette();
  renderSidebar();
  save();
}

function updateWorldToggleUI() {
  const btn = document.getElementById('world-toggle-btn');
  if (!btn) return;
  btn.textContent = `World: ${WORLD_LABELS[currentWorld]}`;
  btn.classList.toggle('accomplishments', currentWorld === 'accomplishments');
  document.body.dataset.world = currentWorld;
}

// ============================================================
// View modes (auto-grouping) + Color modes
// ============================================================
const VIEW_MODES = ['manual', 'priority', 'immediacy', 'people'];
const VIEW_MODE_LABELS = {
  manual: 'Manual',
  priority: 'By Priority',
  immediacy: 'By Immediacy',
  people: 'By People',
};
const COLOR_MODES = ['default', 'monochrome', 'randomized', 'byPriority'];
const COLOR_MODE_LABELS = {
  default: 'Default',
  monochrome: 'Monochrome',
  randomized: 'Randomized',
  byPriority: 'By Priority',
};

const PRIORITY_LABELS = ['None', 'Low', 'Medium', 'High', 'Urgent'];
const PRIORITY_COLORS = ['#6b7280', '#7ad9a8', '#f7b955', '#ff8a65', '#f85149'];
const PRIORITY_REGION_COLORS = ['#3a3f47', '#3a5a48', '#7a5a18', '#7a4a28', '#7a3a3a'];

const IMMEDIACY_LANES = [
  { key: 'overdue', label: '⚠ Overdue', color: '#f85149' },
  { key: 'today',   label: '▸ Today',    color: '#ff8a65' },
  { key: 'week',    label: '▸ This week', color: '#f7b955' },
  { key: 'month',   label: '▸ This month', color: '#7ad9a8' },
  { key: 'later',   label: '▸ Later',     color: '#5cd4f0' },
  { key: 'none',    label: '— No date',   color: '#6b7280' },
];

const MONO_HUE_BY_WORLD = { main: 210, accomplishments: 45 }; // blue for main, gold for acc
const MONO_COLORS = {
  card:   { sat: 25, light: 50 },
  bucket: { sat: 35, light: 45 },
  region: { sat: 20, light: 35 },
  thing:  { sat: 40, light: 55 },
};

let currentColorMode = 'default';
const viewModeByWorld = { main: 'manual', accomplishments: 'manual' };
const manualLayout = { main: new Map(), accomplishments: new Map() };
const tweens = []; // [{ obj3d, item, target: Vector3, start: Vector3, t0, dur, onDone }]

function currentViewMode() { return viewModeByWorld[currentWorld] || 'manual'; }
function inAutoView() { return currentViewMode() !== 'manual'; }

function hashHue(id) {
  let h = 0;
  const s = String(id);
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0;
  return ((h % 360) + 360) % 360;
}

function hslToHex(h, s, l) {
  s /= 100; l /= 100;
  const k = n => (n + h / 30) % 12;
  const a = s * Math.min(l, 1 - l);
  const f = n => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
  const toHex = x => Math.round(x * 255).toString(16).padStart(2, '0');
  return '#' + toHex(f(0)) + toHex(f(8)) + toHex(f(4));
}

function effectivePriority(item, kind) {
  if (kind === 'card') return item.priority || 0;
  if (kind === 'bucket') {
    let p = 0;
    for (const c of cards.values()) if (c.bucketId === item.id) p = Math.max(p, c.priority || 0);
    for (const b of buckets.values()) if (b.parentId === item.id) p = Math.max(p, effectivePriority(b, 'bucket'));
    return p;
  }
  if (kind === 'region') {
    let p = 0;
    for (const b of buckets.values()) if (b.regionId === item.id && !b.parentId) p = Math.max(p, effectivePriority(b, 'bucket'));
    for (const c of cards.values()) if (c.regionId === item.id && !c.bucketId) p = Math.max(p, c.priority || 0);
    return p;
  }
  return 0;
}

function effectiveColor(item, kind) {
  switch (currentColorMode) {
    case 'monochrome': {
      const world = item.world || currentWorld;
      const hue = MONO_HUE_BY_WORLD[world] ?? 210;
      const m = MONO_COLORS[kind] || MONO_COLORS.card;
      return hslToHex(hue, m.sat, m.light);
    }
    case 'randomized': {
      return hslToHex(hashHue(item.id), 65, kind === 'region' ? 38 : 55);
    }
    case 'byPriority': {
      const p = effectivePriority(item, kind);
      const arr = (kind === 'region') ? PRIORITY_REGION_COLORS : PRIORITY_COLORS;
      return arr[p] || arr[0];
    }
    default:
      return item.color || PRIORITY_COLORS[0];
  }
}

// ------------------------------------------------------------
// Position tweens (animated layout transitions)
// ------------------------------------------------------------
const TWEEN_DURATION_MS = 320;
function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }
function startTween(obj3d, target, dur = TWEEN_DURATION_MS, onDone) {
  // remove any existing tween for this object
  for (let i = tweens.length - 1; i >= 0; i--) if (tweens[i].obj3d === obj3d) tweens.splice(i, 1);
  tweens.push({
    obj3d,
    start: obj3d.position.clone(),
    target: target.clone(),
    t0: performance.now(),
    dur,
    onDone,
  });
}
function updateTweens(now) {
  if (tweens.length === 0) return;
  for (let i = tweens.length - 1; i >= 0; i--) {
    const tw = tweens[i];
    const t = Math.min(1, (now - tw.t0) / tw.dur);
    const e = easeOutCubic(t);
    tw.obj3d.position.lerpVectors(tw.start, tw.target, e);
    if (t >= 1) {
      tw.obj3d.position.copy(tw.target);
      if (tw.onDone) tw.onDone();
      tweens.splice(i, 1);
    }
  }
}

// ------------------------------------------------------------
// Super-regions (transient view containers)
// ------------------------------------------------------------
const SUPER_REGION_HEIGHT = 7.0;
const SUPER_REGION_FRAME_THICKNESS = 0.36;
const SUPER_REGION_PADDING = 3.0;
const SUPER_REGION_GUTTER = 4.0; // gap between adjacent super-regions
const superRegions = []; // active super-region meshes/state for current view
const viewClones = [];   // cloned card meshes for People view

function buildSuperRegionLabelCanvas() {
  const c = document.createElement('canvas');
  c.width = 768; c.height = 112;
  return c;
}

function drawSuperRegionLabel(sr) {
  const ctx = sr.labelCanvas.getContext('2d');
  const w = sr.labelCanvas.width, h = sr.labelCanvas.height;
  ctx.clearRect(0, 0, w, h);
  ctx.fillStyle = 'rgba(14,17,22,0.92)';
  roundRect(ctx, 0, 0, w, h, 30);
  ctx.fill();
  ctx.lineWidth = 4;
  ctx.strokeStyle = sr.color;
  roundRect(ctx, 2, 2, w - 4, h - 4, 28);
  ctx.stroke();
  ctx.fillStyle = sr.color;
  ctx.fillRect(28, h / 2 - 18, 10, 36);
  ctx.fillStyle = '#e6edf3';
  ctx.font = '700 44px -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif';
  ctx.textBaseline = 'middle';
  let text = sr.label;
  let suffix = '';
  while (ctx.measureText(text + suffix).width > w - 80 && text.length > 0) {
    text = text.slice(0, -1);
    suffix = '…';
  }
  ctx.fillText(text + suffix, 56, h / 2 + 2);
  sr.labelTexture.needsUpdate = true;
}

function createSuperRegionObjects(sr) {
  const group = new THREE.Group();
  group.position.set(sr.cx, 0, sr.cz);
  // wall halo
  const wallGeo = makeRegionWallGeometry(sr.width, sr.depth, SUPER_REGION_HEIGHT);
  const wallMat = new THREE.ShaderMaterial({
    uniforms: {
      uColor: { value: new THREE.Color(sr.color) },
      uOpacity: { value: 0.32 },
    },
    vertexShader: wallVertexShader,
    fragmentShader: wallFragmentShader,
    transparent: true,
    depthWrite: false,
    side: THREE.DoubleSide,
  });
  const wall = new THREE.Mesh(wallGeo, wallMat);
  wall.renderOrder = -2;
  group.add(wall);
  // frame
  const t = SUPER_REGION_FRAME_THICKNESS;
  const w = sr.width, d = sr.depth;
  const mat = new THREE.MeshBasicMaterial({ color: sr.color });
  const meshes = [];
  const mk = (geom, x, z) => { const m = new THREE.Mesh(geom, mat); m.position.set(x, 0.03, z); meshes.push(m); group.add(m); };
  mk(new THREE.BoxGeometry(w + t * 2, t, t), 0, d / 2 + t / 2);
  mk(new THREE.BoxGeometry(w + t * 2, t, t), 0, -d / 2 - t / 2);
  mk(new THREE.BoxGeometry(t, t, d), -w / 2 - t / 2, 0);
  mk(new THREE.BoxGeometry(t, t, d), w / 2 + t / 2, 0);
  // label
  const labelCanvas = buildSuperRegionLabelCanvas();
  const labelTexture = new THREE.CanvasTexture(labelCanvas);
  labelTexture.colorSpace = THREE.SRGBColorSpace;
  labelTexture.anisotropy = renderer.capabilities.getMaxAnisotropy();
  const labelMat = new THREE.MeshBasicMaterial({ map: labelTexture, transparent: true, side: THREE.DoubleSide });
  const labelGeo = new THREE.PlaneGeometry(5.2, 0.76);
  const label = new THREE.Mesh(labelGeo, labelMat);
  label.position.set(0, SUPER_REGION_HEIGHT + 1.2, 0);
  group.add(label);
  sr.group = group;
  sr.wall = wall;
  sr.wallMat = wallMat;
  sr.frameMat = mat;
  sr.frameMeshes = meshes;
  sr.label = label;
  sr.labelMat = labelMat;
  sr.labelCanvas = labelCanvas;
  sr.labelTexture = labelTexture;
  drawSuperRegionLabel(sr);
  scene.add(group);
}

function disposeSuperRegions() {
  for (const sr of superRegions) {
    scene.remove(sr.group);
    sr.wall.geometry.dispose();
    sr.wallMat.dispose();
    for (const m of sr.frameMeshes) m.geometry.dispose();
    sr.frameMat.dispose();
    sr.label.geometry.dispose();
    sr.labelMat.dispose();
    sr.labelTexture.dispose();
  }
  superRegions.length = 0;
}

function disposeViewClones() {
  for (const cl of viewClones) {
    scene.remove(cl);
    if (cl.geometry) cl.geometry.dispose();
    if (cl.material) {
      if (cl.material.map) cl.material.map.dispose();
      cl.material.dispose();
    }
  }
  viewClones.length = 0;
}

// ------------------------------------------------------------
// Layout packing — items inside a super-region
// ------------------------------------------------------------
const SR_INNER_GUTTER_X = 1.8;
const SR_INNER_GUTTER_Z = 1.8;
const SR_CARD_W = 3.6; // tile size for a card
const SR_CARD_D = 2.6;

function packIntoSuperRegions(groups) {
  // groups: array of { key, label, color, members: [{ kind, item, weight }] }
  // weight controls cell size (e.g., a bucket needs more room than a card)
  // returns the same groups with .cx/.cz/.width/.depth computed, and target positions per member
  let cursorX = 0;
  let cursorZ = 0;
  const ROW_LIMIT_X = 80; // wrap to next row when exceeded
  let rowMaxDepth = 0;
  for (const g of groups) {
    // compute inner grid for this group
    const n = g.members.length || 1;
    const cols = Math.max(1, Math.ceil(Math.sqrt(n * 1.3)));
    const rows = Math.ceil(n / cols);
    // cell size by max weight
    let cellW = SR_CARD_W, cellD = SR_CARD_D;
    for (const m of g.members) {
      if (m.kind === 'bucket') { cellW = Math.max(cellW, m.item.radius * 2 + 0.6); cellD = Math.max(cellD, m.item.radius * 2 + 0.6); }
    }
    const innerW = cols * cellW + (cols - 1) * SR_INNER_GUTTER_X;
    const innerD = rows * cellD + (rows - 1) * SR_INNER_GUTTER_Z;
    g.width = Math.max(8, innerW + SUPER_REGION_PADDING * 2);
    g.depth = Math.max(6, innerD + SUPER_REGION_PADDING * 2);
    // wrap row if it would exceed limit
    if (cursorX > 0 && cursorX + g.width > ROW_LIMIT_X) {
      cursorX = 0;
      cursorZ += rowMaxDepth + SUPER_REGION_GUTTER;
      rowMaxDepth = 0;
    }
    g.cx = cursorX + g.width / 2;
    g.cz = cursorZ + g.depth / 2;
    // place members
    const x0 = g.cx - innerW / 2 + cellW / 2;
    const z0 = g.cz - innerD / 2 + cellD / 2;
    for (let i = 0; i < g.members.length; i++) {
      const m = g.members[i];
      const col = i % cols;
      const row = Math.floor(i / cols);
      const x = x0 + col * (cellW + SR_INNER_GUTTER_X);
      const z = z0 + row * (cellD + SR_INNER_GUTTER_Z);
      m.targetX = x; m.targetZ = z;
    }
    cursorX += g.width + SUPER_REGION_GUTTER;
    rowMaxDepth = Math.max(rowMaxDepth, g.depth);
  }
}

// ------------------------------------------------------------
// Snapshot / restore manual layout
// ------------------------------------------------------------
function snapshotManualLayout() {
  const m = manualLayout[currentWorld];
  m.clear();
  for (const c of cards.values()) if (c.world === currentWorld) m.set(`card:${c.id}`, c.position.slice());
  for (const b of buckets.values()) if (b.world === currentWorld) m.set(`bucket:${b.id}`, b.position.slice());
  for (const r of regions.values()) if (r.world === currentWorld) m.set(`region:${r.id}`, r.position.slice());
  for (const t of things.values()) if (t.world === currentWorld) m.set(`thing:${t.id}`, t.position.slice());
}
function setManualRegionVisibility(visible) {
  for (const r of regions.values()) if (r.world === currentWorld && r.group) r.group.visible = visible;
}

// ------------------------------------------------------------
// Group computation for the three auto-views
// ------------------------------------------------------------
function dueAtToLane(iso) {
  if (!iso) return 'none';
  const due = new Date(iso);
  if (isNaN(due.getTime())) return 'none';
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const dueDay = new Date(due);
  dueDay.setHours(0, 0, 0, 0);
  const dayDiff = Math.floor((dueDay - today) / 86400000);
  if (dayDiff < 0) return 'overdue';
  if (dayDiff === 0) return 'today';
  if (dayDiff <= 7) return 'week';
  if (dayDiff <= 30) return 'month';
  return 'later';
}

function computeGroups_priority() {
  const groups = [];
  for (let p = 4; p >= 0; p--) {
    groups.push({ key: `priority:${p}`, label: `★ ${PRIORITY_LABELS[p]}`, color: PRIORITY_COLORS[p], members: [] });
  }
  // top-level cards (no bucket) + top-level buckets
  for (const c of cards.values()) {
    if (c.world !== currentWorld || c.bucketId) continue;
    const p = c.priority || 0;
    const g = groups[4 - p];
    g.members.push({ kind: 'card', item: c });
  }
  for (const b of buckets.values()) {
    if (b.world !== currentWorld || b.parentId) continue;
    const p = effectivePriority(b, 'bucket');
    const g = groups[4 - p];
    g.members.push({ kind: 'bucket', item: b });
  }
  // drop empty groups
  return groups.filter(g => g.members.length > 0);
}

function computeGroups_immediacy() {
  const groups = [];
  const byKey = {};
  for (const lane of IMMEDIACY_LANES) {
    const g = { key: `imm:${lane.key}`, label: lane.label, color: lane.color, laneKey: lane.key, members: [] };
    groups.push(g);
    byKey[lane.key] = g;
  }
  for (const c of cards.values()) {
    if (c.world !== currentWorld || c.bucketId) continue;
    const lane = dueAtToLane(c.dueAt);
    byKey[lane].members.push({ kind: 'card', item: c });
  }
  // buckets contribute to the lane of their *earliest* card; if none, 'none'
  for (const b of buckets.values()) {
    if (b.world !== currentWorld || b.parentId) continue;
    let earliest = null;
    function walk(bid) {
      for (const c of cards.values()) if (c.bucketId === bid && c.dueAt) {
        const t = new Date(c.dueAt).getTime();
        if (!isNaN(t) && (earliest === null || t < earliest)) earliest = t;
      }
      for (const sub of buckets.values()) if (sub.parentId === bid) walk(sub.id);
    }
    walk(b.id);
    const lane = earliest === null ? 'none' : dueAtToLane(new Date(earliest).toISOString());
    byKey[lane].members.push({ kind: 'bucket', item: b });
  }
  return groups.filter(g => g.members.length > 0);
}

function computeGroups_people() {
  const personById = new Map();
  for (const t of things.values()) {
    if (t.world !== currentWorld) continue;
    if (t.type !== 'person') continue;
    personById.set(t.id, t);
  }
  const groups = [];
  // a group per referenced person, plus a "Misc" group for cards with no person attached
  const cardPersonMap = new Map(); // cardId -> [personIds]
  for (const t of things.values()) {
    if (t.world !== currentWorld) continue;
    if (t.type !== 'person') continue;
    if (!t.cardId || !cards.has(t.cardId)) continue;
    if (!cardPersonMap.has(t.cardId)) cardPersonMap.set(t.cardId, []);
    cardPersonMap.get(t.cardId).push(t.id);
  }
  for (const [pid, person] of personById) {
    const cardsForPerson = [];
    for (const [cid, pids] of cardPersonMap) {
      if (pids.includes(pid)) {
        const c = cards.get(cid);
        if (c && c.world === currentWorld) cardsForPerson.push(c);
      }
    }
    if (cardsForPerson.length === 0) continue;
    const personColor = (getThemeFor(currentWorld).thingTypes.person.color) || '#4f8cff';
    const g = { key: `person:${pid}`, label: `👤 ${person.title || 'Untitled'}`, color: personColor, members: [], personId: pid };
    for (const c of cardsForPerson) g.members.push({ kind: 'card', item: c, clone: true });
    groups.push(g);
  }
  // Misc lane: cards with no attached person (and not in a bucket)
  const misc = { key: 'person:misc', label: '— No person', color: '#6b7280', members: [] };
  for (const c of cards.values()) {
    if (c.world !== currentWorld || c.bucketId) continue;
    if (!cardPersonMap.has(c.id)) misc.members.push({ kind: 'card', item: c });
  }
  if (misc.members.length > 0) groups.push(misc);
  return groups;
}

// ------------------------------------------------------------
// applyCurrentView: build super-regions + tween items
// ------------------------------------------------------------
function applyCurrentView() {
  disposeSuperRegions();
  disposeViewClones();
  const mode = currentViewMode();
  // restore visibility of items in current world
  for (const c of cards.values()) if (c.world === currentWorld && c.mesh) c.mesh.visible = true;
  for (const t of things.values()) if (t.world === currentWorld && t.mesh) t.mesh.visible = (mode === 'manual');
  if (mode === 'manual') {
    setManualRegionVisibility(true);
    const m = manualLayout[currentWorld];
    if (m && m.size > 0) {
      for (const [key, pos] of m) {
        const { type, id } = parseSelectionKey(key);
        if (type === 'card') { const c = cards.get(id); if (c) startTween(c.mesh, new THREE.Vector3(pos[0], pos[1], pos[2])); }
        else if (type === 'bucket') {
          const b = buckets.get(id);
          if (b) {
            const dx = pos[0] - b.position[0], dz = pos[2] - b.position[2];
            if (Math.abs(dx) > 0.001 || Math.abs(dz) > 0.001) translateBucketTree(b, new THREE.Vector3(dx, 0, dz));
          }
        }
        else if (type === 'region') {
          const r = regions.get(id);
          if (r) {
            const dx = pos[0] - r.position[0], dz = pos[2] - r.position[2];
            if (Math.abs(dx) > 0.001 || Math.abs(dz) > 0.001) translateRegion(r, new THREE.Vector3(dx, 0, dz));
          }
        }
        else if (type === 'thing') {
          const tt = things.get(id);
          if (tt) startTween(tt.mesh, new THREE.Vector3(pos[0], pos[1], pos[2]));
        }
      }
    }
    return;
  }
  // auto-view: hide manual regions, compute groups, place items
  setManualRegionVisibility(false);
  let groups;
  if (mode === 'priority') groups = computeGroups_priority();
  else if (mode === 'immediacy') groups = computeGroups_immediacy();
  else if (mode === 'people') groups = computeGroups_people();
  else groups = [];
  if (groups.length === 0) return;
  packIntoSuperRegions(groups);
  // recenter the whole grid around camera target's xz
  const cam = controls.target;
  let minX = Infinity, maxX = -Infinity, minZ = Infinity, maxZ = -Infinity;
  for (const g of groups) {
    minX = Math.min(minX, g.cx - g.width / 2);
    maxX = Math.max(maxX, g.cx + g.width / 2);
    minZ = Math.min(minZ, g.cz - g.depth / 2);
    maxZ = Math.max(maxZ, g.cz + g.depth / 2);
  }
  const shiftX = cam.x - (minX + maxX) / 2;
  const shiftZ = cam.z - (minZ + maxZ) / 2;
  // count card placements (for cloning decision)
  const cardCounts = new Map();
  for (const g of groups) for (const m of g.members) {
    if (m.kind === 'card') cardCounts.set(m.item.id, (cardCounts.get(m.item.id) || 0) + 1);
  }
  // create super-region meshes + place members
  for (const g of groups) {
    g.cx += shiftX;
    g.cz += shiftZ;
    superRegions.push(g);
    createSuperRegionObjects(g);
    for (const m of g.members) {
      const tx = m.targetX + shiftX;
      const tz = m.targetZ + shiftZ;
      if (m.kind === 'card') {
        const count = cardCounts.get(m.item.id) || 1;
        if (count > 1) {
          // multi-assignment: hide real mesh, render N clones
          m.item.mesh.visible = false;
          const clone = m.item.mesh.clone();
          clone.material = m.item.mesh.material;
          clone.userData = { cardId: m.item.id };
          clone.position.copy(m.item.mesh.position);
          clone.visible = true;
          scene.add(clone);
          viewClones.push(clone);
          startTween(clone, new THREE.Vector3(tx, CARD_ALTITUDE, tz));
        } else {
          startTween(m.item.mesh, new THREE.Vector3(tx, CARD_ALTITUDE, tz));
        }
      } else if (m.kind === 'bucket') {
        const cur = m.item.group.position;
        const dx = tx - cur.x, dz = tz - cur.z;
        if (Math.abs(dx) > 0.001 || Math.abs(dz) > 0.001) {
          translateBucketTree(m.item, new THREE.Vector3(dx, 0, dz));
        }
      }
    }
  }
}

function setColorMode(mode) {
  if (!COLOR_MODES.includes(mode) || mode === currentColorMode) return;
  currentColorMode = mode;
  updateColorModeUI();
  redrawAllVisible();
  save();
}

function setViewMode(mode) {
  if (!VIEW_MODES.includes(mode)) return;
  const prev = currentViewMode();
  if (mode === prev) return;
  // when leaving manual, snapshot first
  if (prev === 'manual') snapshotManualLayout();
  viewModeByWorld[currentWorld] = mode;
  applyCurrentView();
  updateViewModeUI();
  save();
}

function updateViewModeUI() {
  const btn = document.getElementById('view-mode-btn');
  if (btn) btn.textContent = `View: ${VIEW_MODE_LABELS[currentViewMode()]}`;
}
function updateColorModeUI() {
  const btn = document.getElementById('color-mode-btn');
  if (btn) btn.textContent = `Colors: ${COLOR_MODE_LABELS[currentColorMode]}`;
}

// ============================================================
// Selection state (tagged union)
// ============================================================
let selection = null; // { type: 'card' | 'bucket', id }
function isSelected(type, id) {
  if (selection && selection.type === type && selection.id === id) return true;
  return (typeof boxSelection !== 'undefined') && boxSelection.has(`${type}:${id}`);
}

// ============================================================
// Cards
// ============================================================
const CARD_W = 3.2;
const CARD_H = 1.8;
const cards = new Map(); // id -> { id, title, description, position:[x,y,z], bucketId, mesh, canvas, texture }

function makeCardCanvas() {
  const c = document.createElement('canvas');
  c.width = 512; c.height = 288;
  return c;
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y,     x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x,     y + h, r);
  ctx.arcTo(x,     y + h, x,     y,     r);
  ctx.arcTo(x,     y,     x + w, y,     r);
  ctx.closePath();
}

function wrapText(ctx, text, x, y, maxWidth, lineHeight, maxLines) {
  const words = String(text).split(/\s+/);
  let line = '';
  const lines = [];
  for (const word of words) {
    const test = line ? line + ' ' + word : word;
    if (ctx.measureText(test).width > maxWidth && line) {
      lines.push(line);
      line = word;
    } else {
      line = test;
    }
    if (lines.length >= maxLines) break;
  }
  if (line && lines.length < maxLines) lines.push(line);
  if (lines.length === maxLines) {
    let last = lines[maxLines - 1];
    const usedWords = lines.join(' ').split(/\s+/).length;
    if (usedWords < words.length) {
      while (ctx.measureText(last + '…').width > maxWidth && last.length > 0) last = last.slice(0, -1);
      lines[maxLines - 1] = last + '…';
    }
  }
  lines.forEach((l, i) => ctx.fillText(l, x, y + i * lineHeight));
}

function drawCard(card, { selected = isSelected('card', card.id), accentOverride } = {}) {
  const ctx = card.canvas.getContext('2d');
  const w = card.canvas.width, h = card.canvas.height;
  ctx.clearRect(0, 0, w, h);

  const wt = getThemeFor(card.world || 'main');
  const cardT = wt.card;

  // accent precedence: explicit override > current color-mode resolution > assigned bucket color > none
  let accent;
  if (accentOverride !== undefined) {
    accent = accentOverride;
  } else if (currentColorMode !== 'default') {
    accent = effectiveColor(card, 'card');
  } else if (card.bucketId) {
    const parentBucket = buckets.get(card.bucketId);
    accent = parentBucket ? effectiveColor(parentBucket, 'bucket') : null;
  } else {
    accent = null;
  }

  // background
  ctx.fillStyle = selected ? cardT.bgSelected : cardT.bg;
  roundRect(ctx, 4, 4, w - 8, h - 8, 24);
  ctx.fill();

  // border (selection > accent > default)
  ctx.lineWidth = selected ? 6 : 3;
  ctx.strokeStyle = selected ? cardT.borderSelected : (accent || cardT.border);
  roundRect(ctx, 4, 4, w - 8, h - 8, 24);
  ctx.stroke();

  // accent bar
  ctx.fillStyle = accent || (selected ? cardT.accentSelected : cardT.accent);
  roundRect(ctx, 20, 24, 8, h - 48, 4);
  ctx.fill();

  // title text
  ctx.fillStyle = cardT.text;
  ctx.font = '600 36px -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif';
  ctx.textBaseline = 'top';
  wrapText(ctx, card.title || 'Untitled', 48, 36, w - 80, 44, 4);

  drawCardBadges(ctx, card, w, h);
  drawCardAccomplishmentMarker(ctx, card, w, h);

  card.texture.needsUpdate = true;
}

function drawCardAccomplishmentMarker(ctx, card, w, h) {
  const ids = card.accomplishmentIds || [];
  if (ids.length === 0) return;
  const cx = w - 36, cy = 34;
  // gold star
  ctx.save();
  ctx.translate(cx, cy);
  ctx.fillStyle = '#ffd700';
  ctx.strokeStyle = '#b8860b';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const r = (i % 2 === 0) ? 16 : 7;
    const a = Math.PI / 5 * i - Math.PI / 2;
    const px = Math.cos(a) * r, py = Math.sin(a) * r;
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.closePath();
  ctx.fill();
  ctx.stroke();
  if (ids.length > 1) {
    ctx.fillStyle = '#1a1408';
    ctx.font = '700 14px -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(String(ids.length), 0, 1);
    ctx.textAlign = 'start';
  }
  ctx.restore();
}

function drawCardBadges(ctx, card, w, h) {
  if (!card.badgeIds || card.badgeIds.length === 0) return;
  const list = card.badgeIds.map(id => badges.get(id)).filter(Boolean);
  if (list.length === 0) return;
  const pillH = 28;
  const padX = 12;
  const gap = 6;
  const fontSize = 18;
  const y = h - pillH - 14;
  const maxX = w - 24;
  let x = 40;
  ctx.font = `600 ${fontSize}px -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif`;
  ctx.textBaseline = 'middle';
  for (let i = 0; i < list.length; i++) {
    const b = list[i];
    const remaining = list.length - i;
    const label = b.label || 'badge';
    const tw = ctx.measureText(label).width;
    const pillW = tw + padX * 2;
    const overflowLabel = `+${remaining}`;
    const ow = ctx.measureText(overflowLabel).width + padX * 2;
    const needsOverflow = (remaining > 1) && (x + pillW + gap + ow > maxX);
    if ((x + pillW > maxX) || needsOverflow) {
      ctx.fillStyle = 'rgba(255,255,255,0.16)';
      roundRect(ctx, x, y, ow, pillH, pillH / 2);
      ctx.fill();
      ctx.fillStyle = '#e6edf3';
      ctx.fillText(overflowLabel, x + padX, y + pillH / 2);
      return;
    }
    ctx.fillStyle = b.color;
    roundRect(ctx, x, y, pillW, pillH, pillH / 2);
    ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.fillText(label, x + padX, y + pillH / 2);
    x += pillW + gap;
  }
}

function createCardMesh(card) {
  const canvas = makeCardCanvas();
  const texture = new THREE.CanvasTexture(canvas);
  texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
  texture.colorSpace = THREE.SRGBColorSpace;
  const mat = new THREE.MeshBasicMaterial({ map: texture, transparent: true, side: THREE.DoubleSide });
  const geo = new THREE.PlaneGeometry(CARD_W, CARD_H);
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.fromArray(card.position);
  mesh.userData.cardId = card.id;
  card.canvas = canvas;
  card.texture = texture;
  card.mesh = mesh;
  drawCard(card);
  return mesh;
}

function addCard({ title = 'New card', description = '', position, bucketId } = {}) {
  if (!position) {
    const forward = new THREE.Vector3();
    camera.getWorldDirection(forward);
    const p = new THREE.Vector3().copy(controls.target).add(forward.multiplyScalar(6));
    p.x += (Math.random() - 0.5) * 4;
    p.z += (Math.random() - 0.5) * 4;
    position = [p.x, CARD_ALTITUDE, p.z];
  } else {
    position = [position[0], CARD_ALTITUDE, position[2]];
  }
  const id = crypto.randomUUID();
  const card = { id, title, description, position, bucketId: bucketId ?? null, regionId: null, badgeIds: [], accomplishmentIds: [], priority: 0, dueAt: null, world: currentWorld };
  if (card.bucketId === null) {
    const inB = findBucketContaining(position);
    if (inB && inB.world === card.world) card.bucketId = inB.id;
  }
  if (card.bucketId === null) {
    const inR = findRegionContaining(position[0], position[2]);
    if (inR && inR.world === card.world) card.regionId = inR.id;
  }
  scene.add(createCardMesh(card));
  cards.set(id, card);
  if (card.bucketId && buckets.has(card.bucketId)) refreshBucket(buckets.get(card.bucketId));
  if (card.regionId && regions.has(card.regionId)) refreshRegion(regions.get(card.regionId));
  select('card', id);
  save();
  return card;
}

function deleteCard(id) {
  const card = cards.get(id);
  if (!card) return;
  const oldBucketId = card.bucketId;
  const oldRegionId = card.regionId;
  // orphan attached things (they keep their last position, lose attachment)
  let orphanedThings = false;
  for (const t of things.values()) {
    if (t.cardId === id) { t.cardId = null; orphanedThings = true; }
  }
  scene.remove(card.mesh);
  card.mesh.geometry.dispose();
  card.mesh.material.map?.dispose();
  card.mesh.material.dispose();
  cards.delete(id);
  if (oldBucketId && buckets.has(oldBucketId)) refreshBucket(buckets.get(oldBucketId));
  if (oldRegionId && regions.has(oldRegionId)) refreshRegion(regions.get(oldRegionId));
  if (isSelected('card', id)) select(null);
  if (orphanedThings) updatePalette();
  save();
}

// ============================================================
// Buckets (3D ringed zones with vertical fading wall halo)
// ============================================================
const BUCKET_HEIGHT = 4;
const BUCKET_DEFAULT_RADIUS = 5;
const BUCKET_PALETTE = ['#4f8cff', '#ff6b9d', '#7ad9a8', '#f7b955', '#b794f4', '#5cd4f0', '#ff8a65'];
const buckets = new Map();

const wallVertexShader = `
  varying vec2 vUv;
  void main() {
    vUv = uv;
    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
  }
`;
const wallFragmentShader = `
  precision highp float;
  uniform vec3 uColor;
  uniform float uOpacity;
  varying vec2 vUv;
  void main() {
    // uv.y = 0 at bottom, 1 at top — fade out toward top
    float v = clamp(vUv.y, 0.0, 1.0);
    float a = pow(1.0 - v, 1.7) * uOpacity;
    // gentle rim brightening at base
    float base = smoothstep(0.0, 0.08, v);
    vec3 col = mix(uColor * 1.4, uColor, base);
    gl_FragColor = vec4(col, a);
  }
`;

function makeBucketLabelCanvas() {
  const c = document.createElement('canvas');
  c.width = 512; c.height = 96;
  return c;
}

function drawBucketLabel(bucket, { selected = isSelected('bucket', bucket.id) } = {}) {
  const { labelCanvas: canvas, name } = bucket;
  const color = effectiveColor(bucket, 'bucket');
  const ctx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  ctx.clearRect(0, 0, w, h);
  ctx.fillStyle = 'rgba(14,17,22,0.88)';
  roundRect(ctx, 0, 0, w, h, 28);
  ctx.fill();
  ctx.lineWidth = selected ? 5 : 3;
  ctx.strokeStyle = color;
  roundRect(ctx, 2, 2, w - 4, h - 4, 26);
  ctx.stroke();
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.arc(38, h / 2, 12, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#e6edf3';
  ctx.font = '600 36px -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif';
  ctx.textBaseline = 'middle';
  let text = name || 'Untitled bucket';
  let suffix = '';
  while (ctx.measureText(text + suffix).width > w - 80 && text.length > 0) {
    text = text.slice(0, -1);
    suffix = '…';
  }
  ctx.fillText(text + suffix, 60, h / 2 + 2);
  bucket.labelTexture.needsUpdate = true;
}

function createBucketObjects(bucket) {
  const group = new THREE.Group();
  group.position.fromArray(bucket.position);

  const wallGeo = new THREE.CylinderGeometry(bucket.radius, bucket.radius, BUCKET_HEIGHT, 64, 1, true);
  const wallMat = new THREE.ShaderMaterial({
    uniforms: {
      uColor: { value: new THREE.Color(bucket.color) },
      uOpacity: { value: 0.45 },
    },
    vertexShader: wallVertexShader,
    fragmentShader: wallFragmentShader,
    transparent: true,
    depthWrite: false,
    side: THREE.DoubleSide,
  });
  const wall = new THREE.Mesh(wallGeo, wallMat);
  wall.position.y = BUCKET_HEIGHT / 2;
  wall.renderOrder = -1;
  group.add(wall);

  const ringGeo = new THREE.TorusGeometry(bucket.radius, 0.06, 8, 96);
  ringGeo.rotateX(Math.PI / 2);
  const ringMat = new THREE.MeshBasicMaterial({ color: bucket.color });
  const ring = new THREE.Mesh(ringGeo, ringMat);
  ring.position.y = 0.02;
  ring.userData.bucketId = bucket.id;
  group.add(ring);

  const labelCanvas = makeBucketLabelCanvas();
  const labelTexture = new THREE.CanvasTexture(labelCanvas);
  labelTexture.colorSpace = THREE.SRGBColorSpace;
  labelTexture.anisotropy = renderer.capabilities.getMaxAnisotropy();
  const labelMat = new THREE.MeshBasicMaterial({ map: labelTexture, transparent: true, side: THREE.DoubleSide });
  const labelGeo = new THREE.PlaneGeometry(3.2, 0.6);
  const label = new THREE.Mesh(labelGeo, labelMat);
  label.position.y = BUCKET_HEIGHT + 0.8;
  label.userData.bucketId = bucket.id;
  group.add(label);

  bucket.group = group;
  bucket.wall = wall;
  bucket.wallMat = wallMat;
  bucket.ring = ring;
  bucket.ringMat = ringMat;
  bucket.label = label;
  bucket.labelMat = labelMat;
  bucket.labelCanvas = labelCanvas;
  bucket.labelTexture = labelTexture;
  drawBucketLabel(bucket);
  return group;
}

function addBucket({ name = 'New bucket', position, radius = BUCKET_DEFAULT_RADIUS, color, parentId = null } = {}) {
  if (parentId && !buckets.has(parentId)) parentId = null;
  if (parentId && depthOf(parentId) + 1 > MAX_NEST_DEPTH) parentId = null;
  if (!position) {
    if (parentId) {
      const parent = buckets.get(parentId);
      position = [parent.position[0], 0, parent.position[2]];
    } else {
      const forward = new THREE.Vector3();
      camera.getWorldDirection(forward);
      forward.y = 0; forward.normalize();
      const p = new THREE.Vector3().copy(controls.target).add(forward.multiplyScalar(8));
      p.x += (Math.random() - 0.5) * 6;
      p.z += (Math.random() - 0.5) * 6;
      position = [p.x, 0, p.z];
    }
  } else {
    position = [position[0], 0, position[2]];
  }
  const palette = bucketPaletteForWorld(currentWorld);
  if (!color) {
    const sameWorld = [...buckets.values()].filter(b => b.world === currentWorld).length;
    color = palette[sameWorld % palette.length];
  }
  const id = crypto.randomUUID();
  const bucket = { id, name, position, baseRadius: radius, radius, color, parentId, regionId: null, world: currentWorld };
  if (!parentId) {
    const inR = findRegionContaining(position[0], position[2]);
    if (inR && inR.world === bucket.world) bucket.regionId = inR.id;
  }
  scene.add(createBucketObjects(bucket));
  buckets.set(id, bucket);
  // nudge if the default position overlaps any existing same-world bucket
  const r = resolveBucketOverlap(bucket, bucket.position[0], bucket.position[2]);
  if (Math.abs(r.x - bucket.position[0]) > 1e-3 || Math.abs(r.z - bucket.position[2]) > 1e-3) {
    const d = new THREE.Vector3(r.x - bucket.position[0], 0, r.z - bucket.position[2]);
    translateBucketTree(bucket, d);
  }
  if (parentId && buckets.has(parentId)) refreshBucket(buckets.get(parentId));
  if (bucket.regionId && regions.has(bucket.regionId)) refreshRegion(regions.get(bucket.regionId));
  select('bucket', id);
  save();
  return bucket;
}

function deleteBucket(id) {
  const bucket = buckets.get(id);
  if (!bucket) return;
  const oldParentId = bucket.parentId;
  const oldRegionId = bucket.regionId;
  // orphan direct card children — they keep their positions, lose membership; re-check region by position
  const regionsToRefresh = new Set();
  if (oldRegionId && regions.has(oldRegionId)) regionsToRefresh.add(oldRegionId);
  for (const c of cards.values()) {
    if (c.bucketId === id) {
      c.bucketId = null;
      const inR = findRegionContaining(c.position[0], c.position[2]);
      const newRId = inR ? inR.id : null;
      if (c.regionId && c.regionId !== newRId) regionsToRefresh.add(c.regionId);
      c.regionId = newRId;
      if (newRId) regionsToRefresh.add(newRId);
      drawCard(c);
    }
  }
  // orphan direct bucket children — they become top-level; re-check region by position
  for (const b of buckets.values()) {
    if (b.parentId === id) {
      b.parentId = null;
      const inR = findRegionContaining(b.position[0], b.position[2]);
      const newRId = inR ? inR.id : null;
      if (b.regionId && b.regionId !== newRId) regionsToRefresh.add(b.regionId);
      b.regionId = newRId;
      if (newRId) regionsToRefresh.add(newRId);
    }
  }
  scene.remove(bucket.group);
  bucket.wall.geometry.dispose();
  bucket.wallMat.dispose();
  bucket.ring.geometry.dispose();
  bucket.ringMat.dispose();
  bucket.label.geometry.dispose();
  bucket.labelMat.dispose();
  bucket.labelTexture.dispose();
  buckets.delete(id);
  if (isSelected('bucket', id)) select(null);
  if (oldParentId && buckets.has(oldParentId)) refreshBucket(buckets.get(oldParentId));
  for (const rid of regionsToRefresh) if (regions.has(rid)) refreshRegion(regions.get(rid));
  save();
}

let hoveredBucketId = null;  // drop target while dragging
let pushedBucketId = null;   // forcefield: home bucket being pushed against

function applyBucketVisualState(bucket) {
  const sel = isSelected('bucket', bucket.id);
  const hov = hoveredBucketId === bucket.id;
  const pushed = pushedBucketId === bucket.id;
  let opacity = 0.45;
  if (pushed) opacity = 1.0;
  else if (hov) opacity = 0.85;
  else if (sel) opacity = 0.7;
  bucket.wallMat.uniforms.uOpacity.value = opacity;
  const color = effectiveColor(bucket, 'bucket');
  bucket.wallMat.uniforms.uColor.value.set(color);
  const intensity = (pushed || hov) ? 1.5 : 1.0;
  bucket.ringMat.color.set(color).multiplyScalar(intensity);
  drawBucketLabel(bucket, { selected: sel || hov || pushed });
}

// ---------- Bucket auto-sizing & orbit layout ----------
const CARD_ALTITUDE = 2.0;
const FORCEFIELD_WIDTH = 2.0;  // how far past the boundary before drag breaks free
const ORBIT_MARGIN = 0.6;      // extra spacing between members on the orbit
const CARD_HALF_SIZE = 1.7;    // approximate half-width of a card on its orbit

function memberHalfSize(member) {
  return cards.has(member.id) ? CARD_HALF_SIZE : member.radius;
}

function requiredBucketRadius(bucket) {
  const cardChildren = membersOf(bucket.id);
  const bucketChildren = bucketChildrenOf(bucket.id);
  const all = [...bucketChildren, ...cardChildren];
  const n = all.length;
  if (n === 0) return bucket.baseRadius;
  let maxHalf = 0;
  for (const m of all) maxHalf = Math.max(maxHalf, memberHalfSize(m));
  let orbitR;
  if (n === 1) orbitR = 0;
  else orbitR = (maxHalf + ORBIT_MARGIN / 2) / Math.sin(Math.PI / n);
  return Math.max(bucket.baseRadius, orbitR + maxHalf + ORBIT_MARGIN);
}

function rebuildBucketGeometry(bucket) {
  bucket.wall.geometry.dispose();
  bucket.ring.geometry.dispose();
  bucket.wall.geometry = new THREE.CylinderGeometry(bucket.radius, bucket.radius, BUCKET_HEIGHT, 64, 1, true);
  const ringGeo = new THREE.TorusGeometry(bucket.radius, 0.06, 8, 96);
  ringGeo.rotateX(Math.PI / 2);
  bucket.ring.geometry = ringGeo;
}

function recomputeBucketRadius(bucket) {
  const target = requiredBucketRadius(bucket);
  if (Math.abs(target - bucket.radius) > 0.05) {
    bucket.radius = target;
    rebuildBucketGeometry(bucket);
  }
}

function layoutBucketMembers(bucket) {
  const cardChildren = membersOf(bucket.id);
  const bucketChildren = bucketChildrenOf(bucket.id);
  const all = [...bucketChildren, ...cardChildren];
  const n = all.length;
  if (n === 0) return;
  let maxHalf = 0;
  for (const m of all) maxHalf = Math.max(maxHalf, memberHalfSize(m));
  const orbitR = n === 1 ? 0 : Math.max(0, bucket.radius - maxHalf - ORBIT_MARGIN);
  for (let i = 0; i < n; i++) {
    const angle = (i / n) * Math.PI * 2 - Math.PI / 2;
    const x = bucket.position[0] + Math.cos(angle) * orbitR;
    const z = bucket.position[2] + Math.sin(angle) * orbitR;
    const m = all[i];
    if (cards.has(m.id)) {
      m.mesh.position.set(x, CARD_ALTITUDE, z);
      m.position = [x, CARD_ALTITUDE, z];
    } else {
      const dx = x - m.position[0];
      const dz = z - m.position[2];
      if (dx * dx + dz * dz > 1e-6) translateBucketTree(m, new THREE.Vector3(dx, 0, dz));
    }
  }
}

function refreshBucket(bucket) {
  recomputeBucketRadius(bucket);
  layoutBucketMembers(bucket);
  if (bucket.parentId && buckets.has(bucket.parentId)) {
    refreshBucket(buckets.get(bucket.parentId));
  } else if (bucket.regionId && regions.has(bucket.regionId)) {
    // top-level bucket inside a region — region needs to expand to fit the new radius
    refreshRegion(regions.get(bucket.regionId));
  }
}

function refreshAll() {
  // bottom-up: deepest first so each parent sees its children's final radii
  const sorted = [...buckets.values()].sort((a, b) => depthOf(b.id) - depthOf(a.id));
  for (const b of sorted) {
    recomputeBucketRadius(b);
    layoutBucketMembers(b);
  }
}

function getBucketColor(bucketId) {
  return buckets.get(bucketId)?.color || null;
}

const MAX_NEST_DEPTH = Infinity; // no depth cap — only cycles are prevented

function depthOf(bucketId) {
  let d = 0;
  let id = bucketId;
  while (id) {
    const b = buckets.get(id);
    if (!b || !b.parentId) break;
    d++;
    id = b.parentId;
    if (d > 1000) break; // safety against pathological cycles
  }
  return d;
}

function subtreeDepth(bucketId) {
  let max = 0;
  for (const b of buckets.values()) {
    if (b.parentId === bucketId) max = Math.max(max, 1 + subtreeDepth(b.id));
  }
  return max;
}

function descendantSet(rootId, includeSelf = false) {
  const set = new Set();
  if (includeSelf) set.add(rootId);
  function walk(id) {
    for (const b of buckets.values()) {
      if (b.parentId === id) { set.add(b.id); walk(b.id); }
    }
  }
  walk(rootId);
  return set;
}

function canNest(dropped, target) {
  if (!target) return true; // top-level always OK
  if (target.id === dropped.id) return false;
  let p = target.parentId;
  while (p) {
    if (p === dropped.id) return false; // would create a cycle
    p = buckets.get(p)?.parentId;
  }
  return depthOf(target.id) + 1 + subtreeDepth(dropped.id) <= MAX_NEST_DEPTH;
}

function translateBucketTree(bucket, delta) {
  bucket.group.position.add(delta);
  bucket.position = [bucket.group.position.x, 0, bucket.group.position.z];
  for (const c of cards.values()) {
    if (c.bucketId === bucket.id) {
      c.mesh.position.add(delta);
      c.position = c.mesh.position.toArray();
      // things attached to this card move with it too
      for (const t of things.values()) {
        if (t.cardId === c.id) {
          t.mesh.position.add(delta);
          t.position = t.mesh.position.toArray();
        }
      }
    }
  }
  for (const b of buckets.values()) {
    if (b.parentId === bucket.id) translateBucketTree(b, delta);
  }
}

function findDeepestBucketContaining(x, z, excludeIds = null) {
  let best = null;
  let bestDepth = -1;
  for (const b of buckets.values()) {
    if (b.world !== currentWorld) continue;
    if (excludeIds && excludeIds.has(b.id)) continue;
    const dx = x - b.position[0];
    const dz = z - b.position[2];
    if (dx * dx + dz * dz <= b.radius * b.radius) {
      const d = depthOf(b.id);
      if (d > bestDepth) { bestDepth = d; best = b; }
    }
  }
  return best;
}

function findBucketContaining(position) {
  return findDeepestBucketContaining(position[0], position[2], null);
}

function membersOf(bucketId) {
  const out = [];
  for (const c of cards.values()) if (c.bucketId === bucketId) out.push(c);
  return out;
}

function bucketChildrenOf(bucketId) {
  const out = [];
  for (const b of buckets.values()) if (b.parentId === bucketId) out.push(b);
  return out;
}

// Push the dragged bucket's proposed (x,z) out of overlap with other buckets.
// Allowed overlaps: self, ancestors (we sit inside them), descendants (they sit inside us),
// nest target (the bucket whose center we're entering), and siblings under a shared non-null
// parent (orbital layout will resolve those on drop).
function resolveBucketOverlap(dragged, x, z) {
  const desc = descendantSet(dragged.id, true);
  const skip = new Set(desc);
  let p = dragged.parentId;
  while (p) { skip.add(p); p = buckets.get(p)?.parentId; }
  const nest = findDeepestBucketContaining(x, z, desc);
  if (nest) skip.add(nest.id);
  let nx = x, nz = z;
  for (let pass = 0; pass < 6; pass++) {
    let moved = false;
    for (const other of buckets.values()) {
      if (skip.has(other.id)) continue;
      if (other.world !== dragged.world) continue;
      if (dragged.parentId !== null && dragged.parentId === other.parentId) continue;
      const dx = nx - other.position[0];
      const dz = nz - other.position[2];
      const dist = Math.hypot(dx, dz);
      const minDist = dragged.radius + other.radius;
      if (dist >= minDist) continue;
      if (dist < 1e-4) {
        nx += minDist;
      } else {
        const push = (minDist - dist);
        nx += (dx / dist) * push;
        nz += (dz / dist) * push;
      }
      moved = true;
    }
    if (!moved) break;
  }
  return { x: nx, z: nz };
}

// ============================================================
// Regions (rectangular super-groups that auto-size to contents)
// ============================================================
const REGION_HEIGHT = 5.5;
const REGION_DEFAULT_W = 14;
const REGION_DEFAULT_D = 14;
const REGION_PADDING = 2.0;
const REGION_STICKY_MARGIN = 3.0; // extra zone where a current member stays bonded on drop
const REGION_FRAME_THICKNESS = 0.18;
const REGION_PALETTE = ['#5a6878', '#785a68', '#5a7868', '#78685a', '#685a78', '#687858', '#785a5a'];
const regions = new Map();
let hoveredRegionId = null;

function makeRegionWallGeometry(width, depth, height) {
  const hw = width / 2, hd = depth / 2;
  const positions = [], uvs = [], indices = [];
  function addQuad(a, b, c, d) {
    const i = positions.length / 3;
    positions.push(...a, ...b, ...c, ...d);
    uvs.push(0, 0, 1, 0, 1, 1, 0, 1);
    indices.push(i, i + 1, i + 2, i, i + 2, i + 3);
  }
  addQuad([-hw, 0, hd], [hw, 0, hd], [hw, height, hd], [-hw, height, hd]);
  addQuad([hw, 0, -hd], [-hw, 0, -hd], [-hw, height, -hd], [hw, height, -hd]);
  addQuad([-hw, 0, -hd], [-hw, 0, hd], [-hw, height, hd], [-hw, height, -hd]);
  addQuad([hw, 0, hd], [hw, 0, -hd], [hw, height, -hd], [hw, height, hd]);
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  g.setIndex(indices);
  return g;
}

function buildRegionFrame(region) {
  const t = REGION_FRAME_THICKNESS;
  const w = region.width, d = region.depth;
  const mat = new THREE.MeshBasicMaterial({ color: region.color });
  const meshes = [];
  const top = new THREE.Mesh(new THREE.BoxGeometry(w + t * 2, t, t), mat);
  top.position.set(0, 0.02, d / 2 + t / 2);
  meshes.push(top);
  const bot = new THREE.Mesh(new THREE.BoxGeometry(w + t * 2, t, t), mat);
  bot.position.set(0, 0.02, -d / 2 - t / 2);
  meshes.push(bot);
  const left = new THREE.Mesh(new THREE.BoxGeometry(t, t, d), mat);
  left.position.set(-w / 2 - t / 2, 0.02, 0);
  meshes.push(left);
  const right = new THREE.Mesh(new THREE.BoxGeometry(t, t, d), mat);
  right.position.set(w / 2 + t / 2, 0.02, 0);
  meshes.push(right);
  for (const m of meshes) {
    m.userData.regionId = region.id;
    region.group.add(m);
  }
  region.frameMat = mat;
  region.frameMeshes = meshes;
}

function disposeRegionFrame(region) {
  for (const m of region.frameMeshes) {
    m.geometry.dispose();
    region.group.remove(m);
  }
  region.frameMat.dispose();
  region.frameMeshes = [];
}

function makeRegionLabelCanvas() {
  const c = document.createElement('canvas');
  c.width = 640; c.height = 96;
  return c;
}

function drawRegionLabel(region, { selected = isSelected('region', region.id) } = {}) {
  const { labelCanvas: canvas, name } = region;
  const color = region.isSuperRegion ? (region.color) : effectiveColor(region, 'region');
  const ctx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  ctx.clearRect(0, 0, w, h);
  ctx.fillStyle = 'rgba(14,17,22,0.88)';
  roundRect(ctx, 0, 0, w, h, 28);
  ctx.fill();
  ctx.lineWidth = selected ? 5 : 3;
  ctx.strokeStyle = color;
  roundRect(ctx, 2, 2, w - 4, h - 4, 26);
  ctx.stroke();
  ctx.fillStyle = color;
  ctx.fillRect(28, h / 2 - 14, 8, 28);
  ctx.fillStyle = '#e6edf3';
  ctx.font = '600 36px -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif';
  ctx.textBaseline = 'middle';
  let text = name || 'Untitled region';
  let suffix = '';
  while (ctx.measureText(text + suffix).width > w - 70 && text.length > 0) {
    text = text.slice(0, -1);
    suffix = '…';
  }
  ctx.fillText(text + suffix, 56, h / 2 + 2);
  region.labelTexture.needsUpdate = true;
}

function createRegionObjects(region) {
  const group = new THREE.Group();
  group.position.fromArray(region.position);
  region.group = group;

  const wallGeo = makeRegionWallGeometry(region.width, region.depth, REGION_HEIGHT);
  const wallMat = new THREE.ShaderMaterial({
    uniforms: {
      uColor: { value: new THREE.Color(region.color) },
      uOpacity: { value: 0.22 },
    },
    vertexShader: wallVertexShader,
    fragmentShader: wallFragmentShader,
    transparent: true,
    depthWrite: false,
    side: THREE.DoubleSide,
  });
  const wall = new THREE.Mesh(wallGeo, wallMat);
  wall.renderOrder = -1;
  group.add(wall);
  region.wall = wall;
  region.wallMat = wallMat;

  region.frameMeshes = [];
  buildRegionFrame(region);

  const labelCanvas = makeRegionLabelCanvas();
  const labelTexture = new THREE.CanvasTexture(labelCanvas);
  labelTexture.colorSpace = THREE.SRGBColorSpace;
  labelTexture.anisotropy = renderer.capabilities.getMaxAnisotropy();
  const labelMat = new THREE.MeshBasicMaterial({ map: labelTexture, transparent: true, side: THREE.DoubleSide });
  const labelGeo = new THREE.PlaneGeometry(4.0, 0.6);
  const label = new THREE.Mesh(labelGeo, labelMat);
  label.position.set(0, REGION_HEIGHT + 1.0, 0);
  label.userData.regionId = region.id;
  group.add(label);
  region.label = label;
  region.labelMat = labelMat;
  region.labelCanvas = labelCanvas;
  region.labelTexture = labelTexture;
  drawRegionLabel(region);

  return group;
}

function rebuildRegionGeometry(region) {
  region.wall.geometry.dispose();
  region.wall.geometry = makeRegionWallGeometry(region.width, region.depth, REGION_HEIGHT);
  disposeRegionFrame(region);
  buildRegionFrame(region);
}

function regionMembers(regionId) {
  const out = { buckets: [], cards: [] };
  for (const b of buckets.values()) if (b.regionId === regionId && !b.parentId) out.buckets.push(b);
  for (const c of cards.values()) if (c.regionId === regionId && !c.bucketId) out.cards.push(c);
  return out;
}

function computeRegionBounds(region) {
  const m = regionMembers(region.id);
  const cx = region.position[0];
  const cz = region.position[2];
  if (m.buckets.length === 0 && m.cards.length === 0) {
    return { width: REGION_DEFAULT_W, depth: REGION_DEFAULT_D };
  }
  let minX = Infinity, maxX = -Infinity, minZ = Infinity, maxZ = -Infinity;
  for (const b of m.buckets) {
    minX = Math.min(minX, b.position[0] - b.radius);
    maxX = Math.max(maxX, b.position[0] + b.radius);
    minZ = Math.min(minZ, b.position[2] - b.radius);
    maxZ = Math.max(maxZ, b.position[2] + b.radius);
  }
  for (const c of m.cards) {
    minX = Math.min(minX, c.position[0] - CARD_HALF_SIZE);
    maxX = Math.max(maxX, c.position[0] + CARD_HALF_SIZE);
    minZ = Math.min(minZ, c.position[2] - CARD_HALF_SIZE);
    maxZ = Math.max(maxZ, c.position[2] + CARD_HALF_SIZE);
  }
  // keep center fixed; grow symmetrically (around fixed center) to encompass furthest reach
  const halfW = Math.max(REGION_DEFAULT_W / 2, maxX - cx, cx - minX) + REGION_PADDING;
  const halfD = Math.max(REGION_DEFAULT_D / 2, maxZ - cz, cz - minZ) + REGION_PADDING;
  return { width: halfW * 2, depth: halfD * 2 };
}

function refreshRegion(region) {
  const b = computeRegionBounds(region);
  const needsResize = Math.abs(b.width - region.width) > 0.05 || Math.abs(b.depth - region.depth) > 0.05;
  region.width = b.width;
  region.depth = b.depth;
  if (needsResize) rebuildRegionGeometry(region);
}

function refreshAllRegions() {
  for (const r of regions.values()) refreshRegion(r);
}

// Push the dragged region's proposed (x,z) out of AABB overlap with other regions.
// Separation is along the axis of least overlap (AABB minimum translation vector).
function resolveRegionOverlap(dragged, x, z) {
  let nx = x, nz = z;
  const halfW = dragged.width / 2, halfD = dragged.depth / 2;
  for (let pass = 0; pass < 6; pass++) {
    let moved = false;
    for (const other of regions.values()) {
      if (other === dragged) continue;
      if (other.world !== dragged.world) continue;
      const ohw = other.width / 2, ohd = other.depth / 2;
      const dx = nx - other.position[0];
      const dz = nz - other.position[2];
      const overlapX = (halfW + ohw) - Math.abs(dx);
      const overlapZ = (halfD + ohd) - Math.abs(dz);
      if (overlapX <= 0 || overlapZ <= 0) continue;
      if (overlapX < overlapZ) {
        nx += (dx >= 0 ? overlapX : -overlapX);
      } else {
        nz += (dz >= 0 ? overlapZ : -overlapZ);
      }
      moved = true;
    }
    if (!moved) break;
  }
  return { x: nx, z: nz };
}

function findRegionContaining(x, z, currentRegionId = null) {
  for (const r of regions.values()) {
    if (r.world !== currentWorld) continue;
    const margin = (currentRegionId === r.id) ? REGION_STICKY_MARGIN : 0;
    const dx = Math.abs(x - r.position[0]);
    const dz = Math.abs(z - r.position[2]);
    if (dx <= r.width / 2 + margin && dz <= r.depth / 2 + margin) return r;
  }
  return null;
}

function applyRegionVisualState(region) {
  const sel = isSelected('region', region.id);
  const hov = hoveredRegionId === region.id;
  let opacity = 0.22;
  if (hov) opacity = 0.55;
  else if (sel) opacity = 0.4;
  if (region.isSuperRegion) opacity = Math.max(opacity, 0.4);
  region.wallMat.uniforms.uOpacity.value = opacity;
  const color = region.isSuperRegion ? region.color : effectiveColor(region, 'region');
  region.wallMat.uniforms.uColor.value.set(color);
  const intensity = hov ? 1.5 : 1.0;
  region.frameMat.color.set(color).multiplyScalar(intensity);
  drawRegionLabel(region, { selected: sel || hov });
}

function addRegion({ name = 'New region', position, width = REGION_DEFAULT_W, depth = REGION_DEFAULT_D, color } = {}) {
  if (!position) {
    const forward = new THREE.Vector3();
    camera.getWorldDirection(forward);
    forward.y = 0; forward.normalize();
    const p = new THREE.Vector3().copy(controls.target).add(forward.multiplyScalar(10));
    p.x += (Math.random() - 0.5) * 8;
    p.z += (Math.random() - 0.5) * 8;
    position = [p.x, 0, p.z];
  } else {
    position = [position[0], 0, position[2]];
  }
  const palette = regionPaletteForWorld(currentWorld);
  if (!color) {
    const sameWorld = [...regions.values()].filter(r => r.world === currentWorld).length;
    color = palette[sameWorld % palette.length];
  }
  const id = crypto.randomUUID();
  const region = { id, name, position, width, depth, color, world: currentWorld };
  scene.add(createRegionObjects(region));
  regions.set(id, region);
  // nudge if the default position overlaps any existing same-world region
  const rr = resolveRegionOverlap(region, region.position[0], region.position[2]);
  if (Math.abs(rr.x - region.position[0]) > 1e-3 || Math.abs(rr.z - region.position[2]) > 1e-3) {
    const d = new THREE.Vector3(rr.x - region.position[0], 0, rr.z - region.position[2]);
    translateRegion(region, d);
  }
  select('region', id);
  save();
  return region;
}

function deleteRegion(id) {
  const region = regions.get(id);
  if (!region) return;
  for (const b of buckets.values()) if (b.regionId === id) b.regionId = null;
  for (const c of cards.values()) if (c.regionId === id) c.regionId = null;
  scene.remove(region.group);
  region.wall.geometry.dispose();
